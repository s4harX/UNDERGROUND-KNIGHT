  const dashPct = 1 - clamp(p.dashCd / (p.dashStartMax || p.dashCdMax || 1), 0, 1);
  ctx.fillStyle = "rgba(154,216,255,.25)";
  roundRect(32, 46, 190, 8, 4); ctx.fill();
  ctx.fillStyle = "#9ad8ff";
  roundRect(32, 46, 190 * dashPct, 8, 4); ctx.fill();
  if (!compact) {
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.font = uiFont(10);
    ctx.fillText("РЫВОК", 230, 52);
  }

  if (p.shieldMax > 0) {
    ctx.fillStyle = "rgba(255,226,122,.2)";
    roundRect(32, 41, 190, 4, 2); ctx.fill();
    ctx.fillStyle = p.shieldRegenT > 0 ? "#c99a4a" : "#ffe27a";
    roundRect(32, 41, 190 * clamp(p.shield / p.shieldMax, 0, 1), 4, 2); ctx.fill();
    if (!compact) {
      ctx.fillStyle = "rgba(255,226,122,.85)";
      ctx.font = uiFont(9);
      ctx.fillText("ЩИТ " + Math.ceil(p.shield) + (p.shieldRegenT > 0 ? " · " + Math.ceil(p.shieldRegenT) + "с" : ""),
                   230, 42);
    }
    requestTooltip(32, 38, 190, 22, "ЩИТ " + Math.ceil(p.shield) + " / " + p.shieldMax, [
      p.shieldRegenT > 0 ? "Восстановление через " + p.shieldRegenT.toFixed(1) + " с"
        : p.shield < p.shieldMax ? "Медленно восстанавливается" : "Щит полон",
      "Задержка после любого попадания: " + SHIELD_REGEN_DELAY + " с"
    ]);
  }
  ctx.fillStyle = "rgba(142,230,255,.18)";
  roundRect(32, 55, 190, 7, 4); ctx.fill();
  ctx.fillStyle = p.energy < 8 ? "#ff6b81" : "#8ee6ff";
  roundRect(32, 55, 190 * clamp(p.energy / p.energyMax, 0, 1), 7, 4); ctx.fill();
  ctx.fillStyle = "rgba(142,230,255,.8)";
  ctx.font = uiFont(9);
  ctx.fillText(compact ? String(Math.ceil(p.energy)) : "ЭНЕРГИЯ " + Math.ceil(p.energy), 230, 62);
  if (p.meleeMode) {
    ctx.fillStyle = "#b8a1ff";
    ctx.font = uiFont(10, true);
    ctx.fillText("⚔ КЛИНОК", 32, 66);
  }
  if (p.phoenix > 0) {
    ctx.fillStyle = "#ff9d4d";
    ctx.font = uiFont(10, true);
    ctx.fillText("ФЕНИКС ×" + p.phoenix, 120, 66);
  }

  const touchHud = isTouch;
  const wx = touchHud ? 348 : 18;
  const wy = touchHud ? 14 : 524;
  const panelW = touchHud ? 410 : 480;
  const panelH = touchHud ? (compact ? 40 : 50) : (compact ? 50 : 62);
  const cardW = touchHud ? 94 : 108;
  const cardH = touchHud ? (compact ? 34 : 42) : (compact ? 38 : 46);
  const cardY = wy + (touchHud ? (compact ? 3 : 4) : (compact ? 5 : 8));
  const step = cardW + (touchHud ? 6 : 8);
  ctx.fillStyle = "rgba(8,8,16,.82)";
  roundRect(wx, wy, panelW, panelH, 10); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.stroke();
  for (let i = 0; i < p.weapons.length; i++) {
    const w = p.weapons[i];
    const x = wx + (touchHud ? 6 : 10) + i * step;
    const active = i === p.wIndex;
    ctx.fillStyle = active ? "rgba(142,230,255,.16)" : "rgba(255,255,255,.04)";
    roundRect(x, cardY, cardW, cardH, 7); ctx.fill();
    if (active) { ctx.strokeStyle = "#8ee6ff"; ctx.lineWidth = 2; ctx.stroke(); }
    if (!compact) {
      ctx.fillStyle = w.color;
      roundRect(x + 7, cardY + 15, 20, 6, 3); ctx.fill();
    }
    ctx.fillStyle = "#e9e6f5";
    ctx.font = uiFont(touchHud ? 10 : 11, true);
    ctx.textAlign = "left";
    ctx.fillText((i + 1) + ". " + w.name, x + 7, cardY + 14);
    ctx.fillStyle = w.reloadT > 0 ? "#ffb36b" : "rgba(233,230,245,.6)";
    ctx.font = (touchHud ? 9 : 10) + "px 'Segoe UI', sans-serif";
    ctx.fillText(w.reloadT > 0 ? (compact ? "ЗАРЯД" : "ПЕРЕЗАРЯДКА")
      : w.ammo + " / " + (Number.isFinite(w.reserve) ? w.reserve : "∞"),
      x + 7, cardY + (compact ? 25 : 33));
    requestTooltip(x, cardY, cardW, cardH, "СЛОТ " + (i + 1) + " · " + w.name,
      weaponPreview(w).concat(active ? ["Активное оружие"] : ["Клик или " + (i + 1) + " — выбрать"]));
  }

  ctx.fillStyle = "rgba(8,8,16,.82)";
  roundRect(W - 188, 14, 170, 128, 10); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.stroke();
  ctx.fillStyle = "rgba(233,230,245,.55)";
  ctx.font = uiFont(10);
  fitFont("ГЛАВА " + stageLabel() + " · УР. " + game.level, 158, 10, true);
  ctx.fillText("ГЛАВА " + stageLabel() + " · УР. " + game.level, W - 176, 28);
  drawMinimap(W - 174, 38);
  ctx.fillStyle = game.threat >= 8 ? "#ff6b81" : game.threat >= 4 ? "#ffb36b" : "#8ee6ff";
  ctx.font = uiFont(9, true);
  ctx.fillText("УГРОЗА " + (game.threat || threatLevel()) + " / " + threatLevelMax(), W - 176, 124);
  if (settings.bigMap) {
    ctx.fillStyle = "rgba(8,8,16,.82)";
    roundRect(W - 188, 190, 170, 132, 10); ctx.fill();
    ctx.strokeStyle = "rgba(142,230,255,.3)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#8ee6ff"; ctx.font = uiFont(9, true); ctx.textAlign = "left";
    ctx.fillText("КАРТА · M", W - 176, 204);
    drawMinimap(W - 172, 214, 16);
  }

  const sk = SKILLS[currentChar().skill];
  const ready = p.skillCd <= 0;
  ctx.fillStyle = ready ? sk.color : "rgba(255,255,255,.14)";
  ctx.beginPath(); ctx.arc(W - 166, 119, 11, 0, 7); ctx.fill();
  ctx.strokeStyle = ready ? "#ffffff" : "rgba(255,255,255,.2)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = ready ? "#1a1420" : "rgba(255,255,255,.45)";
  ctx.font = uiFont(11, true); ctx.textAlign = "center";
  ctx.fillText("Q", W - 166, 120);
  ctx.textAlign = "left";
  ctx.fillStyle = ready ? "rgba(233,230,245,.8)" : "rgba(233,230,245,.38)";
  ctx.font = uiFont(10, true);
  ctx.fillText(sk.name, W - 149, 115);
  if (!compact) {
    ctx.fillStyle = "rgba(233,230,245,.4)";
    ctx.font = uiFont(9);
    ctx.fillText(ready ? "ГОТОВО" : p.skillCd.toFixed(1) + " с", W - 149, 128);
  }
  requestTooltip(W - 184, 100, 160, 40, sk.name,
    [sk.desc, ready ? "Готово к применению (Q)" : "Перезарядка: " + p.skillCd.toFixed(1) + " с"]);

  if (!compact) {
    ctx.fillStyle = "rgba(233,230,245,.5)";
    ctx.font = uiFont(11);
    ctx.textAlign = "right";
    ctx.fillText("Врагов: " + currentRoom().props.filter(o => o.type && !o.dead).length + "   Убийств: " + game.killCount, W - 24, 162);

    ctx.fillStyle = "rgba(233,230,245,.4)";
    ctx.font = uiFont(10);
    ctx.fillText("СИД " + game.seed, W - 24, 178);
  }

  const boss = currentRoom().props.find(o => o.type === "boss" && !o.dead);
  if (boss) {
    const theme = roomTheme(currentRoom());
    const bx = W / 2 - 180, by = 70, bw = 360;
    ctx.fillStyle = "rgba(8,8,16,.85)";
    roundRect(bx, by, bw, 15, 7); ctx.fill();
    ctx.fillStyle = boss.enraged ? "#ffd76b" : theme.accent;
    roundRect(bx + 2, by + 2, (bw - 4) * clamp(boss.hp / boss.maxHp, 0, 1), 11, 5); ctx.fill();
    ctx.fillStyle = "#fff0f3";
    ctx.font = uiFont(10, true);
    ctx.textAlign = "center";
    ctx.fillText(theme.bossName.toUpperCase() + (boss.enraged ? " · ЯРОСТЬ" : ""), W / 2, by + 8);
  }

  if (game.relics.length) {
    ctx.textAlign = "left";
    const ry = compact ? 96 : 84;
    /* Adaptive spacing keeps every relic on screen in long runs. */
    const rs = Math.min(compact ? 14 : 24, 380 / game.relics.length);
    const rr = Math.min(compact ? 6 : 10, rs * .45);
    for (let i = 0; i < game.relics.length; i++) {
      const r = game.relics[i];
      const rx = 30 + i * rs;
      ctx.fillStyle = "rgba(8,8,16,.8)";
      ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.fill();
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.arc(rx, ry, rr * .6, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.beginPath(); ctx.arc(rx - rr * .2, ry - rr * .2, rr * .2, 0, 7); ctx.fill();
      requestTooltip(rx - rr, ry - rr, rr * 2, rr * 2, r.name,
        [r.desc, rarityOf(r.rarity).name + (r.stack ? " · стак" : "")]);
    }
  }

  if (game.synergyIds && game.synergyIds.length) {
    ctx.textAlign = "left";
    if (!compact) {
      ctx.fillStyle = "rgba(233,230,245,.5)";
      ctx.font = uiFont(9);
      ctx.fillText("СИНЕРГИИ", 30, 106);
    }
    game.synergyIds.forEach((id, i) => {
      const s = SYNERGIES.find(v => v.id === id);
      if (!s) return;
      const sx = 34 + i * (compact ? 14 : 16), sy = compact ? 112 : 118;
      const sr = compact ? 4 : 5;
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.65)";
      ctx.beginPath(); ctx.arc(sx - sr * .3, sy - sr * .3, sr * .3, 0, 7); ctx.fill();
    });
  }

  if (game.statues && game.statues.length) {
    ctx.textAlign = "left";
    if (!compact) {
      ctx.fillStyle = "rgba(192,140,255,.7)";
      ctx.font = uiFont(9);
      ctx.fillText("СТАТУИ", 30, 136);
    }
    game.statues.forEach((id, i) => {
      const s = STATUES.find(v => v.id === id);
      if (!s) return;
      const sx = 36 + i * (compact ? 18 : 22), sy = compact ? 128 : 150;
      const sr = compact ? 8 : 10;
      ctx.fillStyle = "rgba(8,8,16,.85)";
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
      ctx.fillStyle = s.color;
      ctx.font = uiFont(compact ? 11 : 12, true);
      ctx.fillText(s.icon, sx - sr * .45, sy + 4);
    });
  }
  if (game.mergedIds && game.mergedIds.length) {
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd76b";
    ctx.font = uiFont(9, true);
    ctx.fillText((compact ? "✦×" : "СЛИЯНИЯ ×") + game.mergedIds.length, 30, compact ? 146 : 170);
  }
  if (game.mercenaries && game.mercenaries.length) {
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(124,255,207,.85)";
    ctx.font = uiFont(9, true);
    ctx.fillText("НАЁМНИКИ ×" + game.mercenaries.length, 30, compact ? 158 : 186);
  }
  if (game.buffs && game.buffs.length) {
    ctx.textAlign = "left";
    if (!compact) {
      ctx.fillStyle = "rgba(142,230,245,.7)";
      ctx.font = uiFont(9);
      ctx.fillText("БАФФЫ", 30, compact ? 170 : 196);
    }
    const bs = Math.min(compact ? 13 : 18, 380 / game.buffs.length);
    game.buffs.forEach((b, i) => {
      const def = BUFFS.find(v => v.id === b.id) || b;
      const bx = 34 + i * bs, by = compact ? 182 : 214;
      const br = Math.min(compact ? 5 : 7, bs * .45);
      ctx.fillStyle = "rgba(8,8,16,.85)";
      ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(bx, by, br * .65, 0, 7); ctx.fill();
      requestTooltip(bx - br, by - br, br * 2, br * 2, def.name, [def.desc, "Бафф забега"]);
    });
  }

  const mode = MODES.find(m => m.id === game.mode) || MODES[0];
  const modNames = game.mods.map(id => {
    const m = MODIFIERS.find(v => v.id === id);
    return m ? m.name : "";
  }).filter(Boolean).join(" / ");
  if (!compact) {
    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,215,107,.7)";
    ctx.font = uiFont(10, true);
    ctx.fillText(mode.name + (modNames ? " · " + modNames : ""), W - 24, 194);
  }

  if (game.mode === "sprint") {
    ctx.textAlign = "center";
    ctx.fillStyle = "#8ee6ff";
    ctx.font = uiFont(14, true);
    const secs = Math.floor(game.time);
    ctx.fillText("ВРЕМЯ " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0"),
                 W / 2, 34);
    if (saveData.records.sprintBest) {
      ctx.fillStyle = "rgba(142,230,245,.55)";
      ctx.font = uiFont(9);
      ctx.fillText("РЕКОРД " + Math.floor(saveData.records.sprintBest / 60) + ":" +
                   String(saveData.records.sprintBest % 60).padStart(2, "0"), W / 2, 48);
    }
  }

  drawCombatLog();

  if ((settings.autoAim !== false || touchMode()) && game.aimTarget && !game.aimTarget.dead) {
    const t = game.aimTarget, s = t.r + 10;
    ctx.strokeStyle = "rgba(124,255,155,.55)";
    ctx.lineWidth = 2;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(t.x + sx * s, t.y + sy * s - sy * 8);
      ctx.lineTo(t.x + sx * s, t.y + sy * s);
      ctx.lineTo(t.x + sx * s - sx * 8, t.y + sy * s);
      ctx.stroke();
    }
  }
}

function requestTooltip(x, y, w, h, title, lines) {
  if (!settings.tooltips || mouse.x < x || mouse.x > x + w || mouse.y < y || mouse.y > y + h) return;
  tooltip = { title, lines: lines.filter(Boolean) };
}

function weaponPreview(w) {
  if (!w) return [];
  const cur = game && game.player ? game.player.weapons[game.player.wIndex] : null;
  const dmg = Math.round(w.damage || 0), rate = (w.rate || 0).toFixed(2);
  const lines = [];
  lines.push("Урон " + dmg + (cur ? " · сейчас " + Math.round(cur.damage || 0) : ""));
  lines.push("Темп " + rate + " с · магазин " + (w.mag || 0));
  if (w.count > 1) lines.push("Снарядов за выстрел: " + w.count);
  if (w.pierce) lines.push("Пробитие: " + w.pierce);
  if (w.explosive) lines.push("Взрыв: " + w.explosive);
  if (w.chain) lines.push("Цепная молния: " + w.chain);
  if (w.bounce) lines.push("Рикошет: " + w.bounce);
  if (w.split) lines.push("Осколки: " + w.split);
  if (w.slow) lines.push("Замедление: " + w.slow + " с");
  if (w.mine) lines.push("Ставит мины");
  if (w.boomerang) lines.push("Возвращается");
  const extras = [];
  if (w.homing) extras.push("Наведение " + w.homing);
  if (w.poison) extras.push("Яд " + w.poison);
  if (w.healOnHit) extras.push("Лечение " + w.healOnHit);
  if (w.shock) extras.push("Волна " + w.shock);
  if (w.stun) extras.push("Оглушение " + w.stun + " с");
  if (w.orbit) extras.push("Спутники " + w.orbit);
  if (w.fire) extras.push("Огонь");
  if (extras.length) {
    lines.push(extras.slice(0, 3).join(" · "));
    if (extras.length > 3) lines.push(extras.slice(3).join(" · "));
  }
  if (w.energy) lines.push("Энергии за выстрел: " + w.energy);
  const syn = SYNERGIES.filter(s => s.a === w.id || s.b === w.id).map(s => s.name).slice(0, 2);
  if (syn.length) lines.push("Синергии: " + syn.join(", "));
  return lines;
}

function drawTooltip() {
  if (!tooltip || !tooltip.lines.length) return;
  const lines = tooltip.lines.slice(0, 10);
  const w = 290, h = 34 + lines.length * 16;
  let x = mouse.x + 18, y = mouse.y + 16;
  if (x + w > W - 10) x = mouse.x - w - 18;
  if (y + h > H - 10) y = H - h - 10;
  ctx.save();
  ctx.fillStyle = "rgba(12,12,22,.96)";
  roundRect(x, y, w, h, 9); ctx.fill();
  ctx.strokeStyle = "rgba(142,230,255,.5)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#8ee6ff"; ctx.font = uiFont(12, true);
  ctx.fillText(tooltip.title, x + 12, y + 16);
  lines.forEach((l, i) => {
    ctx.fillStyle = "rgba(233,230,245,.8)"; ctx.font = uiFont(10);
    const text = l.length > 48 ? l.slice(0, 47) + "…" : l;
    ctx.fillText(text, x + 12, y + 36 + i * 16);
  });
  ctx.restore();
}

function drawCombatLog() {
  if (!game || state !== "playing" || !game.log) return;
  const now = performance.now();
  const life = COMBAT_LOG_HOLD + COMBAT_LOG_FADE;
  // Clean up even while disabled, so re-enabling never shows stale events.
  game.log = game.log.filter(e => now - e.time < life);
  if (!settings.combatLog || !game.log.length) return;

  const lines = game.log.slice(0, settings.compactHud ? 3 : 5);
  const alpha = clamp(1 - (now - lines[0].time - COMBAT_LOG_HOLD) / COMBAT_LOG_FADE, 0, 1);
  if (alpha <= 0) return;

  const h = 20 + lines.length * 15;
  const y = 296 - h;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(8,8,16,.7)";
  roundRect(18, y, 252, h, 8); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(142,230,255,.7)";
  ctx.font = uiFont(9, true);
  ctx.fillText("ЖУРНАЛ БОЯ", 28, y + 11);
  lines.forEach((e, i) => {
    ctx.globalAlpha = alpha * (i === 0 ? 1 : Math.max(.3, .75 - i * .14));
    ctx.fillStyle = e.color;
    ctx.font = uiFont(10);
    const text = e.text.length > 34 ? e.text.slice(0, 33) + "…" : e.text;
    ctx.fillText(text, 28, y + 27 + i * 15);
  });
  ctx.restore();
}

function drawTouchControls() {
  const compact = settings.compactHud === true;
  ctx.save();

  // Virtual joystick
  const jx = 120, jy = 500, jr = 64 * settings.touchSize;
  const active = touch.moveId !== null;
  const ox = active ? touch.moveOrigin.x : jx;
  const oy = active ? touch.moveOrigin.y : jy;
  ctx.strokeStyle = active ? "rgba(142,230,255,.55)" : "rgba(142,230,255,.2)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(ox, oy, jr, 0, 7); ctx.stroke();
  ctx.fillStyle = "rgba(142,230,255,.06)";
  ctx.beginPath(); ctx.arc(ox, oy, jr, 0, 7); ctx.fill();

  const kx = ox + touch.moveVec.x * (jr - 12);
  const ky = oy + touch.moveVec.y * (jr - 12);
  ctx.fillStyle = active ? "rgba(142,230,255,.55)" : "rgba(142,230,255,.22)";
  ctx.beginPath(); ctx.arc(kx, ky, 24, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 2; ctx.stroke();

  // Action buttons
  for (const b of TOUCH_BTNS) {
    const pos = touchButtonPos(b);
    const ready = b.id === "dash" ? game.player.dashCd <= 0
                : b.id === "skill" ? game.player.skillCd <= 0
                : b.id === "melee" ? game.player.meleeCd <= 0 : true;
    ctx.fillStyle = ready ? "rgba(12,14,26,.72)" : "rgba(30,30,42,.55)";
    ctx.beginPath(); ctx.arc(pos.x, pos.y, pos.r, 0, 7); ctx.fill();
    ctx.strokeStyle = ready ? b.color : "rgba(255,255,255,.12)";
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = ready ? b.color : "rgba(255,255,255,.25)";
    ctx.font = "bold " + Math.round((b.id === "dash" ? 30 : 24) * settings.touchSize) + "px 'Segoe UI', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(b.id === "attack" && nearbyInteractable() ? "E" : b.label, pos.x, pos.y + 1);

    if ((b.id === "dash" || b.id === "skill" || b.id === "melee") && !ready) {
      const cdKey = b.id === "skill" ? "skillCd" : b.id === "melee" ? "meleeCd" : "dashCd";
      const maxKey = b.id === "skill" ? "skillCdMax" : "dashCdMax";
      const max = b.id === "melee" ? .34 : game.player[maxKey];
      const pct = 1 - clamp(game.player[cdKey] / max, 0, 1);
      ctx.strokeStyle = b.id === "melee" ? "rgba(184,161,255,.8)" : "rgba(255,255,255,.3)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, pos.r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
      ctx.stroke();
    }
    const labels = {
      dash: ["РЫВОК", "#9ad8ff"],
      reload: ["ПЕРЕЗАРЯД", "#ffe27a"],
      weapon: ["СМЕНА", "#ff9de2"],
      attack: [nearbyInteractable() ? "ВЗАИМОД." : game.player.meleeMode ? "УДАР" : "ОГОНЬ", "#7cff9b"],
      skill: ["НАВЫК Q", "#ffb36b"],
      melee: [game.player.meleeMode ? "КЛИНОК ВКЛ" : "КЛИНОК", "#c08cff"]
    };
    const lab = labels[b.id];
    if (lab) {
      ctx.fillStyle = ready ? lab[1] : "rgba(255,255,255,.35)";
      ctx.font = uiFont(10, true);
      ctx.fillText(lab[0], pos.x, pos.y + pos.r + 14);
    }
    if (state === "paused") {
      ctx.fillStyle = "rgba(255,215,107,.6)";
      ctx.font = uiFont(9, true);
      ctx.fillText("ПЕРЕТАЩИ", pos.x, pos.y - pos.r - 10);
    }
  }

  ctx.fillStyle = "rgba(142,230,255,.7)";
  ctx.font = uiFont(10, true);
  ctx.fillText("ДВИЖЕНИЕ", jx, jy + jr + 14);

  ctx.restore();
}

function roomMapColor(room) {
  let color = "rgba(255,255,255,.08)";
  if (room.visited) {
    color = room.cleared ? "rgba(124,255,155,.38)" : "rgba(255,107,129,.45)";
    if (room.type === "boss") color = floorData(game.floor).accent;
    if (room.type === "shop") color = "#8ee6ff";
    if (room.type === "treasure") color = "#ffd76b";
    if (room.type === "arena") color = "#ffb36b";
    if (room.secretBiome) color = SECRET_THEME.accent;
    if (room.secret && !room.secretBiome) color = "#ff9de2";
  }
  return color;
}

function roomMapMark(room) {
  if (room.type === "ambush") return room.armed ? "!" : "T";
  if (room.type === "boss") return "B";
  if (room.type === "shop") return "$";
  if (room.type === "treasure") return "T";
  if (room.secretBiome || room.secret) return "?";
  return "";
}

function drawMinimap(ox, oy, s = 12) {
  const gap = Math.max(2, Math.round(s * .25));
  const big = s >= 24;
  /* Show the ten-room chain so the snaking layout reads as one path. */
  if (game.path && game.path.length > 1) {
    ctx.strokeStyle = "rgba(142,230,255,.28)";
    ctx.lineWidth = big ? 3 : 2;
    ctx.beginPath();
    game.path.forEach((c, i) => {
      const cx = ox + c.x * (s + gap) + s / 2, cy = oy + c.y * (s + gap) + s / 2;
      if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
    });
    ctx.stroke();
  }
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const room = game.grid[y][x];
      if (!room) continue;
      const px = ox + x * (s + gap), py = oy + y * (s + gap);
      ctx.fillStyle = roomMapColor(room);
      roundRect(px, py, s, s, Math.max(2, Math.round(s * .16))); ctx.fill();
      if (x === game.cx && y === game.cy) {
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = big ? 3 : 2; ctx.stroke();
      }
      if (big && room.visited) {
        const mark = roomMapMark(room);
        if (mark) {
          ctx.fillStyle = "rgba(9,9,16,.85)";
          ctx.font = "bold " + Math.round(s * .5) + "px 'Segoe UI', sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(mark, px + s / 2, py + s / 2 + 1);
        }
        ctx.fillStyle = "rgba(233,230,245,.55)";
        ctx.font = uiFont(10, true);
        ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        ctx.fillText(String(room.stage || 1), px + 5, py + s - 5);
      }
    }
  }
  /* Arrow toward the boss when it has not been cleared yet. */
  const b = game.bossPos;
  const bossRoom = b && game.grid[b.y] && game.grid[b.y][b.x];
  if (bossRoom && !bossRoom.cleared) {
    const dx = b.x - game.cx, dy = b.y - game.cy;
    if (dx || dy) {
      const a = Math.atan2(dy, dx);
      const span = SIZE * (s + gap) / 2 - (big ? 12 : 4);
      const ax = ox + SIZE * (s + gap) / 2 + Math.cos(a) * span;
      const ay = oy + SIZE * (s + gap) / 2 + Math.sin(a) * span;
      ctx.save();
      ctx.translate(ax, ay); ctx.rotate(a);
      ctx.fillStyle = floorData(game.floor).accent;
      const z = big ? 11 : 6;
      ctx.beginPath(); ctx.moveTo(z, 0); ctx.lineTo(-z, -z * .7); ctx.lineTo(-z, z * .7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawMapOverlay() {
  const big = 44, gap = 8, mw = SIZE * (big + gap) - gap;
  const px = (W - mw) / 2, py = 120;
  ctx.fillStyle = "rgba(5,5,12,.9)";

  ctx.strokeStyle = "#8ee6ff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#8ee6ff";
  ctx.font = "bold 24px 'Segoe UI', sans-serif";
  ctx.fillText("КАРТА · ГЛАВА " + game.floor + " · СТУПЕНЬ " + game.stage + "/" + game.stageCount, W / 2, py - 28);
  drawMinimap(px, py, big);
  const legend = [
    ["#7cff9b", "зачищено"], ["#ff6b81", "враги"], [floorData(game.floor).accent, "босс"],
    ["#8ee6ff", "магазин"], ["#ffd76b", "сокровище"], ["#ff9de2", "секрет"]
  ];
  ctx.font = uiFont(11);
  legend.forEach((l, i) => {

    ctx.fillStyle = "rgba(233,230,245,.75)";
    ctx.textAlign = "left";
    ctx.fillText(l[1], lx + 20, ly);
  });
  ctx.fillStyle = "rgba(233,230,245,.45)";
  ctx.font = uiFont(11); ctx.textAlign = "center";
  ctx.fillText("M — закрыть карту", W / 2, py + mw + 104);
}

function drawShop() {
  ctx.fillStyle = "rgba(5,5,12,.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#191827";
  roundRect(210, 126, 540, 392, 16); ctx.fill();
  ctx.strokeStyle = "rgba(142,230,255,.35)"; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#8ee6ff";
  ctx.font = "bold 24px 'Segoe UI', sans-serif";
  ctx.fillText("МАГАЗИН", W / 2, 158);
  ctx.fillStyle = "#e9e6f5";
  ctx.font = uiFont(13);
  ctx.fillText("Монеты: " + game.coins + "     Самоцветы: " + saveData.gems + "     E — выйти", W / 2, 190);

  drawMerchant(256, 182, .8);
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,215,107,.5)";
  ctx.font = uiFont(8, true);
  ctx.fillText("ТОРГОВЕЦ", 256, 210);

  const items = currentRoom().shopItems;
  const buttons = shopButtons();
  const n = saveData.shopSlots === 4 ? 4 : 3;
  for (let i = 0; i < n; i++) {
    const b = buttons[i];
    const item = items[i];
    ctx.fillStyle = item ? (game.coins >= item.price ? "rgba(142,230,255,.12)" : "rgba(255,107,129,.09)") : "rgba(255,255,255,.03)";
    roundRect(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = item ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.05)"; ctx.lineWidth = 1; ctx.stroke();
    if (!item) {
      ctx.fillStyle = "rgba(233,230,245,.35)";
      ctx.font = uiFont(12);
      ctx.fillText("ПРОДАНО", b.x + b.w / 2, b.y + b.h / 2);
      continue;
    }
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff0b8";
    ctx.font = uiFont(14, true);
    ctx.fillText(item.title, b.x + 14, b.y + 15);
    ctx.fillStyle = "rgba(233,230,245,.62)";
    ctx.font = uiFont(11);
    ctx.fillText(item.desc, b.x + 14, b.y + 35);
    ctx.textAlign = "right";
    ctx.fillStyle = game.coins >= item.price ? "#ffd76b" : "#ff6b81";
    ctx.font = uiFont(14, true);

    const isWeapon = WEAPON_IDS.indexOf(item.id) >= 0;
    const preview = isWeapon ? weaponPreview(WEAPONS[item.id]) : [];
    requestTooltip(b.x, b.y, b.w, b.h, item.title,
      [item.desc].concat(preview).concat([

      ]));

    roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = b.i === -3 ? "#b8a1ff" : "rgba(255,255,255,.16)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = b.i === -3 ? "#d6c8ff" : "#e9e6f5";
    ctx.textAlign = "center"; ctx.font = uiFont(11, true);
    const label = b.i === -1 ? "ВЫЙТИ" : b.i === -2 ? "ОБНОВИТЬ · " + rerollPrice() + " ¢" : "4-Й СЛОТ · 45 💎";
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2);
  }
}

function drawWrappedCentered(text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "", yy = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy);
      line = w;
      yy += lineH;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, yy);
}

function rewardButtons() {
  return rewardChoices.map((r, i) => ({ x: 145 + i * 220, y: 176, w: 200, h: 272, i }));
}

function banishButtons() {
  if (!rewardChoices.length || rewardBanished || rewardChoices[0].kind === "statue") return [];
  return rewardChoices.map((r, i) => ({ x: 145 + i * 220, y: 458, w: 200, h: 30, i }));
}

function handleRewardClick() {
  for (const b of rewardButtons()) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
      chooseRelic(b.i);
      return;
    }
  }
  for (const b of banishButtons()) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
      banishRelic(b.i);
      return;
    }
  }
}

function drawReward() {
  ctx.fillStyle = "rgba(5,5,12,.78)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const statuePick = rewardChoices.length && rewardChoices[0].kind === "statue";
  ctx.fillStyle = statuePick ? "#c08cff" : "#ffe27a";
  ctx.font = "bold 30px 'Segoe UI', sans-serif";
  ctx.fillText(statuePick ? "ВЫБЕРИ СТАТУЮ" : "ВЫБЕРИ НАГРАДУ", W / 2, 116);
  ctx.fillStyle = "rgba(233,230,245,.65)";
  ctx.font = uiFont(14);
  ctx.fillText(statuePick
    ? "Статуи действуют весь забег и усиливают билд"

  for (const b of rewardButtons()) {

function fireSettingsButton(id) {
  ensureAudio();
  if (id === "volDown") { settings.volume = clamp(settings.volume - .1, 0, 1); applyVolume(); return; }
  if (id === "volUp") { settings.volume = clamp(settings.volume + .1, 0, 1); applyVolume(); return; }
  if (id === "musDown") { settings.musicVolume = clamp(settings.musicVolume - .1, 0, 1); applyVolume(); return; }
  if (id === "musUp") { settings.musicVolume = clamp(settings.musicVolume + .1, 0, 1); applyVolume(); return; }
  if (id === "sfxDown") { settings.sfxVolume = clamp(settings.sfxVolume - .1, 0, 1); applyVolume(); return; }
  if (id === "sfxUp") { settings.sfxVolume = clamp(settings.sfxVolume + .1, 0, 1); applyVolume(); return; }
  if (id === "sizeDown") { settings.touchSize = Math.max(.8, Math.round((settings.touchSize - .1) * 10) / 10); saveSettings(); return; }
  if (id === "sizeUp") { settings.touchSize = Math.min(1.3, Math.round((settings.touchSize + .1) * 10) / 10); saveSettings(); return; }
  if (id === "controlMode") {
    const list = ["auto", "mouse", "touch"];
    settings.controlMode = list[(list.indexOf(settings.controlMode) + 1) % list.length];
    if (!touchMode()) clearInput();
  } else if (id === "aimPriority") {
    const list = ["near", "danger", "weak"];
    settings.aimPriority = list[(list.indexOf(settings.aimPriority) + 1) % list.length];
  } else if (id === "resetLayout") {
    saveData.touchLayout = {};
    settings.touchSize = 1;
  } else if (id === "fullscreen") { toggleFullscreen(); return; }
  else if (id === "difficulty") {
    const i = DIFFICULTY.findIndex(d => d.id === saveData.difficulty);
    saveData.difficulty = DIFFICULTY[(i + 1) % DIFFICULTY.length].id;
    writeSave(saveData);
    sfx("buy");
    return;
  }
  else if (id === "next") { settingsPage = Math.min(2, settingsPage + 1); sfx("buy"); return; }
  else if (id === "prev") { settingsPage = Math.max(0, settingsPage - 1); sfx("buy"); return; }
  else if (id === "exit") { settingsPage = 0; state = "paused"; sfx("buy"); return; }
  else if (settingsRows().some(r => r.id === id && typeof r.on === "boolean")) {
    settings[id] = !settings[id];
  }
  saveSettings();
  sfx("buy");
  buzz(20);
}

function runGemMultiplier() {
  const curMode = MODES.find(m => m.id === saveData.mode) || MODES[0];
  return curMode.gemMul * saveData.mods.reduce((acc, id) => {
    const m = MODIFIERS.find(v => v.id === id);
    return acc * (m ? m.gemMul : 1);
  }, 1);
}

function isFullscreen() {

}
function toggleFullscreen() {
  const doc = document;
  if (isFullscreen()) {
    const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
    if (exit) { const p = exit.call(doc); if (p && p.catch) p.catch(() => {}); }
  } else {
    const req = doc.documentElement.requestFullscreen || doc.documentElement.webkitRequestFullscreen;
    if (req) { const p = req.call(doc.documentElement); if (p && p.catch) p.catch(() => {}); }
  }
}

function devAction(id) {
  if (!game) return;
  const p = game.player;
  switch (id) {
    case "floor1": case "floor2": case "floor3": case "floor4": case "floor5": {
      const target = clamp(Number(id.slice(5)), 1, FLOORS.length);
      const world = withRng(floorSeed(game.seed, target), () => generateWorld(target, game.mode));
      game.floor = target;
      game.grid = world.grid;
      game.path = world.path;
      game.stageCount = world.stages;
      game.stage = 1;
      game.cx = world.start.x; game.cy = world.start.y;
      game.bossPos = world.boss;
      game.floorRooms = 1;
      game.elitesThisFloor = 0;
      game.roomDamaged = false;
      game.roomCount++;
      game.bullets.length = 0; game.particles.length = 0;
      game.effects.length = 0; game.floaters.length = 0;
      game.transition = 0;
      game.victoryTimer = -1;
      const room = currentRoom();
      room.visited = true;
      room.enterTime = game.time;
      room.spawned = false;
      spawnRoom(room);
      room.spawned = true;
      syncMercenaries(room);
      room.stage = 1;
      ensurePortal(room);
      game.level = (game.floor - 1) * game.stageCount + 1 + (room.type === "boss" ? 1 : 0);
      game.threat = threatLevel();
      p.x = R.x + R.w / 2; p.y = R.y + R.h / 2;
      p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * .25));
      p.shield = p.shieldMax; p.shieldRegenT = 0; p.energy = p.energyMax;
      for (const w of p.weapons) if (Number.isFinite(w.reserve)) w.reserve += w.mag * 2;
      state = "dev";
      logEvent("Тест: глава " + stageLabel(), "#ffb36b");
      break;
    }
    case "stage": {
      if (game.stage >= game.stageCount) { logEvent("Тест: последняя ступень главы", "#ffb36b"); break; }
      const cell = game.path && game.path[game.stage];
      if (cell) {
        game.stage++;
        const dx = cell.x - game.cx, dy = cell.y - game.cy;
        game.transition = 0;
        enterRoom(dx === 0 && dy === 0 ? 0 : Math.sign(dx), dy === 0 && dx === 0 ? 0 : Math.sign(dy), cell);
        p.x = R.x + 44; p.y = R.y + R.h / 2;
        logEvent("Тест: ступень " + stageLabel(), "#ffb36b");
      }
      state = "dev";
      break;
    }
    case "buff": {
      buffChoices = buildBuffChoices();
      if (buffChoices.length) {
        state = "buff";
        clearInput();
      }
      break;
    }
    case "boss":
      if (game.bossPos && game.grid[game.bossPos.y] && game.grid[game.bossPos.y][game.bossPos.x]) {
        game.cx = game.bossPos.x; game.cy = game.bossPos.y;
        game.stage = game.stageCount;
        game.floorRooms = game.stage;
        game.bullets.length = 0;
        game.roomCount++;
        const room = currentRoom();
        room.visited = true;
        room.enterTime = game.time;
        room.props = room.props.filter(o => !o.type);
        room.spawned = false;
        game.level = (game.floor - 1) * game.stageCount + game.stage + 1;
        game.threat = threatLevel();
        spawnRoom(room);
        room.spawned = true;
        syncMercenaries(room);
        p.x = R.x + R.w / 2; p.y = R.y + R.h / 2;
        logEvent("Тест: комната босса", "#ffb36b");
      }
      state = "dev";
      break;
    case "heal":
      p.hp = p.maxHp; p.shield = p.shieldMax || 0; p.energy = p.energyMax; p.shieldRegenT = 0;
      logEvent("Тест: восстановление", "#7cff9b");
      break;
    case "coins": game.coins += 500; logEvent("Тест: +500 монет", "#ffd76b"); break;
    case "gems":
      game.testGems = (game.testGems || 0) + 100;
      logEvent("Тест: +100 самоцветов (не сохраняются)", "#ff9de2");
      break;
    case "level": p.damageMul += .5; game.level++; logEvent("Тест: урон и уровень", "#ffe27a"); break;
    case "relic": {
      const owned = new Set(game.relics.map(r => r.id));
      let r = RELICS.find(v => !owned.has(v.id));
      if (!r) {
        const id = STACKABLE_RELICS.find(v => owned.has(v));
        if (!id) { logEvent("Тест: все реликвии уже получены", "rgba(233,230,245,.6)"); break; }
        const base = RELICS.find(v => v.id === id);
        r = Object.assign({}, base, { stack: true });
      }
      applyRelic(r);
      logEvent("Тест: " + (r.stack ? "стак " : "") + "реликвия " + r.name, r.color);
      break;
    }
    case "weapon": {
      const cur = p.weapons[p.wIndex];
      const id = WEAPON_IDS[(WEAPON_IDS.indexOf(cur && cur.id) + 1) % WEAPON_IDS.length];
      addWeapon(id);
      break;
    }
    case "clear": {
      const room = currentRoom();
      for (const o of room.props) if (o.type && !o.dead) { o.dead = true; o.hp = 0; }
      checkRoomClear();
      logEvent("Тест: комната зачищена", "#7cff9b");
      state = "dev";
      break;
    }
    case "ambush": {
      const room = currentRoom();
      game.bullets.length = 0;
      room.props = room.props.filter(o => !o.type);
      room.type = "ambush";
      room.spawned = false;
      spawnRoom(room);
      room.spawned = true;
      ensurePortal(room);
      logEvent("Тест: комната засады", "#ffb36b");
      state = "dev";
      break;
    }
    case "exit":
      restoreGameFromDev();
      return;
  }
  sfx("buy");
  buzz(20);
}

  if (setupStep <= 0) { state = "menu"; sfx("buy"); return; }
  setupStep--;
  sfx("buy");
  buzz(15);
}
function cycleSetupChar(dir) {
  const pool = CHARACTERS.filter(c => charUnlocked(c.id));
  const i = pool.findIndex(c => c.id === selectedChar);
  selectedChar = pool[(i + dir + pool.length) % pool.length].id;
  saveData.char = selectedChar;
  writeSave(saveData);
  sfx("buy");
  buzz(15);
}

function handleSetupClick() {
  if (inRect(setupBackButton())) { setupPrev(); return true; }
  if (inRect(setupNextButton())) { setupNext(); return true; }
  if (setupStep === 0 && inRect(setupPlayButton())) {
    setupStep = 1; sfx("buy"); buzz(15); return true;
  }
  if (setupStep === 1) {
    for (const b of setupCharCards()) {
      if (!inRect(b)) continue;
      if (!charUnlocked(b.c.id)) { heroReturn = "setup"; state = "heroes"; sfx("buy"); return true; }
      selectedChar = b.c.id;
      saveData.char = selectedChar;
      writeSave(saveData);
      sfx("buy"); buzz(15);
      return true;
    }
  } else if (setupStep === 2) {
    for (const b of modeButtons()) if (inRect(b)) { setMode(b.m.id); return true; }
    for (const b of modButtons()) if (inRect(b)) { toggleMod(b.m.id); return true; }
  } else if (setupStep === 3) {
    for (const b of upgradeCards()) if (inRect(b)) { buyUpgrade(b.u.id); return true; }
    if (!isTouch && inRect(setupAutoButton())) {
      settings.autoAim = !settings.autoAim;
      saveSettings(); sfx("buy"); buzz(15);
      return true;
    }
  }
  return false;
}

function heroCards() {
  return CHARACTERS.map((c, i) => {
    const x = 70 + (i % 3) * 280;
    const y = 126 + Math.floor(i / 3) * 118;
    return { x, y, w: 270, h: 108, c, btn: { x: x + 126, y: y + 70, w: 132, h: 28 } };
  });
}

function upgradeCards() {
  return UPGRADES.map((u, i) => ({
    x: 70 + i * 212, y: 374, w: 202, h: 118, u
  }));
}

function handleHeroesClick() {
  for (const b of heroCards()) {
    const btn = b.btn;
    if (mouse.x < btn.x || mouse.x > btn.x + btn.w || mouse.y < btn.y || mouse.y > btn.y + btn.h) continue;
    if (charUnlocked(b.c.id)) {
      selectedChar = b.c.id;
      saveData.char = selectedChar;
      writeSave(saveData);
      sfx("buy");
      buzz(20);
    } else {
      unlockCharacter(b.c.id);
    }
    return true;
  }
  for (const b of upgradeCards()) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w &&
        mouse.y >= b.y && mouse.y <= b.y + b.h) {
      buyUpgrade(b.u.id);
      return true;
    }
  }
  return false;
}

    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  if (performance.now() < seedToastUntil) {
    ctx.fillStyle = "#ffe27a";
    ctx.font = uiFont(11, true);
    ctx.fillText("СИД СКОПИРОВАН", W / 2, 466);
  }
}

/* ---------- primitive shapes ---------- */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .75);
  ctx.bezierCurveTo(x - s * 1.5, y - s * .2, x - s * .5, y - s * 1.3, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .5, y - s * 1.3, x + s * 1.5, y - s * .2, x, y + s * .75);
  ctx.closePath();
}

/* ---------- input ---------- */
function updateMouse(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (W / rect.width);
  mouse.y = (e.clientY - rect.top) * (H / rect.height);
}

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  ensureAudio();

  if (state === "install") {
    if (e.code === "Escape" || e.code === "Enter" || e.code === "KeyP") state = "menu";
    return;
  }
  if (state === "menu") {
    if (e.code === "ArrowLeft" || e.code === "KeyA" || e.code === "ArrowRight" || e.code === "KeyD") {
      const pool = CHARACTERS.filter(c => charUnlocked(c.id));
      const i = pool.findIndex(c => c.id === selectedChar);
      const dir = (e.code === "ArrowLeft" || e.code === "KeyA") ? -1 : 1;
      selectedChar = pool[(i + dir + pool.length) % pool.length].id;
      saveData.char = selectedChar;
      writeSave(saveData);
      sfx("buy");
      buzz(15);
    } else if (e.code === "KeyH") {
      state = "heroes";
      sfx("buy");
    } else if (e.code === "KeyT") {
      state = "trials";
      sfx("buy");
    } else if (e.code === "Enter" || e.code === "Space") {
      openSetup();
    }
    return;
  }
  if (state === "setup") {
    if (e.code === "Enter" || e.code === "Space") setupNext();
    else if (e.code === "Escape" || e.code === "KeyP") setupPrev();
    else if (setupStep === 1 && (e.code === "KeyA" || e.code === "ArrowLeft")) cycleSetupChar(-1);
    else if (setupStep === 1 && (e.code === "KeyD" || e.code === "ArrowRight")) cycleSetupChar(1);
    return;
  }
  if (state === "achievements") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "Enter") state = "menu";
    return;
  }
  if (state === "heroes") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "Enter" || e.code === "KeyH") {
      state = heroReturn; heroReturn = "menu";
    }
    return;
  }
  if (state === "trials") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "KeyT") state = "menu";
    else if (e.code === "Enter" || e.code === "Space") startGame();
    else if (e.code === "Digit1") setMode("normal");
    else if (e.code === "Digit2") setMode("bossRush");
    else if (e.code === "Digit3") setMode("sprint");
    else if (e.code === "KeyF") toggleMod("fast");
    else if (e.code === "KeyO") toggleMod("overload");
    else if (e.code === "KeyG") toggleMod("fog");
    else if (e.code === "KeyS") toggleMod("scarce");
    else if (e.code === "KeyV") toggleMod("glass");
    return;
  }
  if (state === "gameover" || state === "victory") {
    if (e.code === "KeyR" || e.code === "Enter") startGame();
    else if (e.code === "KeyC") copySeed();
    else if (e.code === "Escape") { state = "menu"; sfx("buy"); }
    return;
  }
  if (state === "reward") {
    if (e.code === "Digit1") chooseRelic(0);
    else if (e.code === "Digit2") chooseRelic(1);
    else if (e.code === "Digit3") chooseRelic(2);
    else if (e.code === "KeyB") banishRelic(0);
    return;
  }
  if (state === "buff") {
    if (e.code === "Digit1") chooseBuff(0);
    else if (e.code === "Digit2") chooseBuff(1);
    else if (e.code === "Digit3") chooseBuff(2);
    return;
  }
  if (state === "weaponChoice") {
    if (e.code === "Digit1") chooseWeaponSlot(0);
    else if (e.code === "Digit2") chooseWeaponSlot(1);
    else if (e.code === "Digit3") chooseWeaponSlot(2);
    else if (e.code === "Digit4") chooseWeaponSlot(3);
    else if (e.code === "Escape" || e.code === "Enter") skipWeaponChoice();
    return;
  }
  if (state === "settings") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "Enter") { settingsPage = 0; state = "paused"; }
    else if (e.code === "ArrowLeft") { fireSettingsButton(settingsPage === 0 ? "volDown" : settingsPage === 2 ? "difficulty" : "prev"); }
    else if (e.code === "ArrowRight") { fireSettingsButton(settingsPage === 0 ? "volUp" : settingsPage === 2 ? "difficulty" : "next"); }
    return;
  }
  if (state === "dev") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "KeyX") restoreGameFromDev();
    else if (e.code === "Digit1") devAction("floor1");
    else if (e.code === "Digit2") devAction("floor2");
    else if (e.code === "Digit3") devAction("floor3");
    else if (e.code === "Digit4") devAction("floor4");
    else if (e.code === "Digit5") devAction("floor5");
    else if (e.code === "Digit6") devAction("coins");
    else if (e.code === "Digit7") devAction("gems");
    else if (e.code === "Digit8") devAction("level");
    else if (e.code === "KeyN") devAction("stage");
    else if (e.code === "KeyB") devAction("boss");
    else if (e.code === "KeyV") devAction("buff");
    else if (e.code === "KeyC") devAction("clear");
    else if (e.code === "KeyH") devAction("heal");
    else if (e.code === "KeyR") devAction("relic");
    else if (e.code === "KeyW") devAction("weapon");
    else if (e.code === "KeyA") devAction("ambush");
    return;
  }
  if (state === "paused" && e.code === "Enter") { togglePause(); return; }
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); return; }
  if (state === "shop") {
    if (e.code === "KeyE" || e.code === "Enter") closeShop();
    return;
  }
  if (state !== "playing") return;

  if (e.code === "KeyM") { mapExpanded = !mapExpanded; if (mapExpanded) clearInput(); return; }
  if (e.code === "Space") tryDash();
  else if (e.code === "KeyQ") useSkill();
  else if (e.code === "KeyF") toggleMelee();
  else if (e.code === "KeyR") startReload();
  else if (e.code === "KeyE") interact();
  else if (e.code === "Digit1") selectWeapon(0);
  else if (e.code === "Digit2") selectWeapon(1);
  else if (e.code === "Digit3") selectWeapon(2);
  else if (e.code === "Digit4") selectWeapon(3);
});

window.addEventListener("keyup", e => { keys[e.code] = false; });

function clearInput() {
  mouse.down = false;
  touch.moveId = null;
  touch.attackId = null;
  touch.interactMode = false;
  touch.drag = null;
  touch.moveVec.x = touch.moveVec.y = 0;
  touch.pointers.clear();
  for (const k in keys) keys[k] = false;
}
window.addEventListener("blur", () => {
  if (state === "playing") state = "paused";
  clearInput();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing") state = "paused";
  if (document.hidden) clearInput();
});

function handleUiClick() {
  if (state === "menu") { handleMenuClick(); return true; }
  if (state === "install") { handleInstallClick(); return true; }
  if (state === "setup") { handleSetupClick(); return true; }
  if (state === "achievements") { state = "menu"; sfx("buy"); return true; }
  if (state === "heroes") {
    if (handleHeroesClick()) return true;
    state = heroReturn; heroReturn = "menu"; sfx("buy"); return true;
  }
  if (state === "trials") { handleTrialsClick(); return true; }
  if (state === "gameover" || state === "victory") {
    for (const b of endButtons()) {
      if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
        if (b.id === "menu") { state = "menu"; sfx("buy"); }
        else if (b.id === "seed") copySeed();
        else startGame();
        return true;
      }
    }
    startGame();
    return true;
  }
  if (state === "shop") { handleShopClick(); return true; }
  if (state === "reward") { handleRewardClick(); return true; }
  if (state === "buff") { handleBuffClick(); return true; }
  if (state === "weaponChoice") { handleWeaponChoiceClick(); return true; }
  if (state === "dev") { handleDevClick(); return true; }
  if (state === "settings") { handleSettingsClick(); return true; }
  if (state === "paused") { if (!handlePauseClick()) togglePause(); return true; }
  return false;
}

canvas.addEventListener("mousemove", updateMouse);
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("mousedown", e => {
  updateMouse(e);
  ensureAudio();
  if (e.button !== 0) return;
  if (handleUiClick()) return;
  if (state === "playing") mouse.down = true;
});
window.addEventListener("mouseup", e => { if (e.button === 0) mouse.down = false; });

/* ---------- touch input ---------- */
function touchButtonAt(x, y) {
  for (const b of TOUCH_BTNS) {
    const pos = touchButtonPos(b);
    if (dist(x, y, pos.x, pos.y) <= pos.r + 10) return b;
  }
  return null;
}

function nearbyInteractable() {
  if (!game || state !== "playing") return false;
  const room = currentRoom();
  const p = game.player;
  const targets = [
    ["portal", 86], ["stairs", 82], ["cage", 86], ["chest", 70], ["crack", 80]
  ];
  for (const [kind, d] of targets) {
    const o = room.props.find(o => o.kind === kind && !o.opened && !o.used);
    if (o && dist(p.x, p.y, o.x, o.y) < d) return true;
  }
  return room.type === "shop";
}

function fireTouchButton(b) {
  if (!game) return;
  if (b.id === "dash") tryDash();
  else if (b.id === "reload") startReload();
  else if (b.id === "weapon") selectWeapon((game.player.wIndex + 1) % game.player.weapons.length);
  else if (b.id === "attack") {
    if (nearbyInteractable()) interact();
    else fireWeapon();
  }
  else if (b.id === "skill") useSkill();
  else if (b.id === "melee") meleeAttack();
  else if (b.id === "pause") togglePause();
}

canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  e.preventDefault();
  ensureAudio();
  updateMouse(e);
  const x = mouse.x, y = mouse.y;

  if (state === "paused" && touchMode()) {
    const btn = touchButtonAt(x, y);
    if (btn) {
      const pos = touchButtonPos(btn);
      touch.drag = { id: btn.id, pointerId: e.pointerId, dx: x - pos.x, dy: y - pos.y };
      touch.pointers.set(e.pointerId, "drag");
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
  }
  if (handleUiClick()) return;
  if (state !== "playing" || !touchMode()) return;

  if (touch.pointers.has(e.pointerId)) return;
  const btn = touchButtonAt(x, y);
  if (btn) {
    if (btn.id === "attack") {
      if (touch.attackId !== null) return;
      touch.attackId = e.pointerId;
      touch.pointers.set(e.pointerId, "attack");
      touch.interactMode = nearbyInteractable();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    fireTouchButton(btn);
    return;
  }

  if (x < W * .45) {
    if (touch.moveId !== null) return;
    touch.moveId = e.pointerId;
    touch.pointers.set(e.pointerId, "move");
    touch.moveOrigin.x = x;
    touch.moveOrigin.y = y;
    touch.moveVec.x = touch.moveVec.y = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }
  // Right side no longer aims manually — the attack button fires at the auto-selected target.
});

canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse") return;
  updateMouse(e);
  const x = mouse.x, y = mouse.y;

  if (touch.drag && e.pointerId === touch.drag.pointerId) {
    const btn = TOUCH_BTNS.find(b => b.id === touch.drag.id);
    if (btn) {
      saveData.touchLayout[btn.id] = {
        x: Math.round(clamp(x - touch.drag.dx, 30, W - 30)),
        y: Math.round(clamp(y - touch.drag.dy, 30, H - 30))
      };
    }
    return;
  }

  if (e.pointerId === touch.moveId && touch.pointers.get(e.pointerId) === "move") {
    const dx = x - touch.moveOrigin.x;
    const dy = y - touch.moveOrigin.y;
    const d = Math.hypot(dx, dy);
    const max = 54;
    if (d > max) {
      touch.moveVec.x = dx / d;
      touch.moveVec.y = dy / d;
      touch.moveOrigin.x = x - touch.moveVec.x * max;
      touch.moveOrigin.y = y - touch.moveVec.y * max;
    } else {
      touch.moveVec.x = dx / max;
      touch.moveVec.y = dy / max;
    }
  }
});

function endTouchPointer(e) {
  if (e.pointerType === "mouse") return;
  const role = touch.pointers.get(e.pointerId);
  if (role === "drag" && touch.drag && e.pointerId === touch.drag.pointerId) {
    writeSave(saveData);
    touch.drag = null;
  }
  if (role === "move" && e.pointerId === touch.moveId) {
    touch.moveId = null;
    touch.moveVec.x = touch.moveVec.y = 0;
  }
  if (role === "attack" && e.pointerId === touch.attackId) {
    touch.attackId = null;
    touch.interactMode = false;
  }
  touch.pointers.delete(e.pointerId);
}
canvas.addEventListener("pointerup", endTouchPointer);
canvas.addEventListener("pointercancel", endTouchPointer);

/* ---------- loop ---------- */
function loop(now) {
  const dt = Math.max(0, Math.min(.033, (now - lastTime) / 1000 || 0));
  if (dt > 0) fpsSmooth += (1 / dt - fpsSmooth) * .08;
  lastTime = now;
  update(dt);
  updateMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

})();
</script>
