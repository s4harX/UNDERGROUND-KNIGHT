function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function dailyKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dailyQuests() {
  const r = mulberry32(hashString("quests-" + dailyKey()));
  const pool = QUEST_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 3);
}

function ensureDaily() {
  if (!saveData.daily || saveData.daily.key !== dailyKey()) {
    saveData.daily = { key: dailyKey(), progress: {}, claimed: [] };
    writeSave(saveData);
  }
  return saveData.daily;
}

function trackQuest(metric, amount) {
  if (!game) return;
  const daily = ensureDaily();
  const quest = dailyQuests().find(q => q.metric === metric && daily.claimed.indexOf(q.id) < 0);
  if (!quest) return;
  daily.progress[metric] = Math.min(quest.target, (daily.progress[metric] || 0) + amount);
  if (daily.progress[metric] >= quest.target) {
    daily.claimed.push(quest.id);
    const bonus = 75;
    game.coins += bonus;
    game.stats.coinsEarned += bonus;
    floater("ЗАДАНИЕ ВЫПОЛНЕНО! +" + bonus, W / 2, R.y + 140, "#ffe27a");
    sfx("buy");
    buzz(40);
  }
  writeSave(saveData);
}

  if (game) {

  }
}
