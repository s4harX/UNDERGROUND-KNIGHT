    if (f.life <= 0) game.effects.splice(i, 1);
  }
  game.flash = Math.max(0, game.flash - dt * 1.4);
  for (let i = game.floaters.length - 1; i >= 0; i--) {
    const f = game.floaters[i];
    f.life -= dt; f.y -= 24 * dt;
    if (f.life <= 0) game.floaters.splice(i, 1);
  }
  capArray(game.particles, 320);
  capArray(game.effects, 120);
  capArray(game.floaters, 60);
  capArray(game.bullets, 480);
  {
    const room = currentRoom();
    const enemies = room.props.filter(o => o.type && !o.dead);
    if (enemies.length > 60) {
      const kill = new Set(enemies.slice(0, enemies.length - 60));
      for (let i = room.props.length - 1; i >= 0; i--) {
        if (kill.has(room.props[i]) && room.props[i].type !== "boss" && room.props[i].type !== "twin") {
          room.props.splice(i, 1);
        }
      }
    }
  }

  if (state !== "playing") return;

  readInput();
  const p = game.player;
  const room = currentRoom();

  p.aim = Math.atan2(input.aimY - p.y, input.aimX - p.x);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.skillCd = Math.max(0, p.skillCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt);
  p.meleeCd = Math.max(0, p.meleeCd - dt);
  p.meleeT = Math.max(0, p.meleeT - dt);

  if (p.energyRegenT > 0) p.energyRegenT = Math.max(0, p.energyRegenT - dt);
  p.energy = Math.min(p.energyMax, p.energy + (p.energyRegenT > 0 ? 4 : 22) * dt);
  if (p.hpRegen > 0) p.hp = Math.min(p.maxHp, p.hp + p.hpRegen * dt);
  if (p.poisonT > 0) {
    p.poisonT = Math.max(0, p.poisonT - dt);
    p.poisonTick = (p.poisonTick || 0) - dt;
    if (p.poisonTick <= 0) {
      p.poisonTick = .6;
      damagePlayer(3 + game.level * .5);
    }
  }

  if (p.shieldRegenT > 0) p.shieldRegenT = Math.max(0, p.shieldRegenT - dt);
  else if (p.shield < p.shieldMax) {
    p.shield = Math.min(p.shieldMax,
      p.shield + (SHIELD_REGEN_BASE + p.shieldMax * SHIELD_REGEN_SCALE) * statueRegenMul() * dt);
  }

  if (p.meleeMode && p.meleeCd <= 0) {
    let near = null, bestD = 46;
    for (const e of room.props) {
      if (e.dead || !e.maxHp || e.hp <= 0) continue;
      const d = dist(p.x, p.y, e.x, e.y);
      if (d < bestD) { bestD = d; near = e; }
    }
    if (near) meleeAttack(Math.atan2(near.y - p.y, near.x - p.x));
  }

  if (p.storm > 0) {
    p.stormTimer -= dt;
    if (p.stormTimer <= 0) {
      p.stormTimer = 3.2;
      let target = null, bestD = 420;
      for (const e of currentRoom().props) {
        if (!e.type || e.dead) continue;
        const d = dist(p.x, p.y, e.x, e.y);
        if (d < bestD) { bestD = d; target = e; }
      }
      if (target) chainFrom(p.x, p.y, 16 * p.damageMul * p.storm * statueDamageMul(), "#c08cff", 2 + p.storm + statueChainBonus());
    }
  }

  for (const w of p.weapons) {
    w.cd = Math.max(0, w.cd - dt);
    if (w.reloadT > 0) {
      w.reloadT -= dt;
      if (w.reloadT <= 0) {
        w.reloadT = 0;
        const need = Math.min(w.mag - w.ammo, w.reserve);
        w.ammo += need;
        if (Number.isFinite(w.reserve)) w.reserve -= need;
      }
    }
  }

  let mx = input.moveX;
  let my = input.moveY;
  if (p.dashBreak > 0) p.dashBreak -= dt;
  if (p.chargeTime > 0) {
    p.chargeTime -= dt;
    p.x += p.chargeVX * dt;
    p.y += p.chargeVY * dt;
    for (const e of currentRoom().props) {
      if (!e.type || e.dead || e.chargeHitId === p.chargeId) continue;
      if (dist(p.x, p.y, e.x, e.y) < p.r + e.r + 12) {
        e.chargeHitId = p.chargeId;
        damageEnemy(e, 30 * p.damageMul * statueDamageMul(), p.chargeVX, p.chargeVY, true);
        burst(e.x, e.y, "#ffd76b", 10, 130);
      }
    }
    if (chance(.7)) game.particles.push({ x: p.x, y: p.y, vx: rand(-40, 40), vy: rand(-40, 40), life: .3, maxLife: .3, color: "#ffd76b", size: 5 });
  } else if (p.dashTime > 0) {
    p.dashTime -= dt;
    p.x += p.dashVX * dt;
    p.y += p.dashVY * dt;
    if (chance(.6)) game.particles.push({ x: p.x, y: p.y, vx: rand(-30,30), vy: rand(-30,30), life: .25, maxLife: .25, color: "#9ad8ff", size: 4 });
  } else {
    const l = Math.hypot(mx, my) || 1;
    p.x += mx / l * p.speed * statueSpeedMul() * dt;
    p.y += my / l * p.speed * statueSpeedMul() * dt;
  }

  const bounds = getPlayerBounds();
  p.x = clamp(p.x, bounds.l, bounds.r);
  p.y = clamp(p.y, bounds.t, bounds.b);
  resolveObstacles(p, p.r, p.dashTime > 0 || p.dashBreak > 0);

  if (game.transition <= 0) {
    const d = room.doors;
    if (d.N && d.N.open && p.y < R.y - 4 && Math.abs(p.x - d.N.x) < 54) enterRoom(0, -1);
    else if (d.S && d.S.open && p.y > R.y + R.h + 4 && Math.abs(p.x - d.S.x) < 54) enterRoom(0, 1);
    else if (d.W && d.W.open && p.x < R.x - 4 && Math.abs(p.y - d.W.y) < 54) enterRoom(-1, 0);
    else if (d.E && d.E.open && p.x > R.x + R.w + 4 && Math.abs(p.y - d.E.y) < 54) enterRoom(1, 0);
  }

  if (input.fire) fireWeapon();

  updateEnemies(dt);
  updateAllies(dt);
  updateTraps(dt);
  updateBullets(dt);
  updatePickups(dt);

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const q = game.particles[i];
    if (q.life <= 0) game.particles.splice(i, 1);
  }

  room.props = room.props.filter(o =>
    !(o.type && o.dead) && !((o.kind === "box" || o.kind === "barrel") && o.dead)
  );
  checkRoomClear();
}

function getPlayerBounds() {
  const p = game.player;
  const doors = currentRoom().doors;
  let l = R.x + 20, r = R.x + R.w - 20;
  let t = R.y + 20, b = R.y + R.h - 20;
  if (doors.N && doors.N.open && Math.abs(p.x - doors.N.x) < 52) t = R.y - 34;
  if (doors.S && doors.S.open && Math.abs(p.x - doors.S.x) < 52) b = R.y + R.h + 34;
  if (doors.W && doors.W.open && Math.abs(p.y - doors.W.y) < 52) l = R.x - 34;
  if (doors.E && doors.E.open && Math.abs(p.y - doors.E.y) < 52) r = R.x + R.w + 34;
  return { l, r, t, b };
}

function updateEnemies(dt) {
  const p = game.player;
  const enemies = currentRoom().props.filter(o => o.type && !o.dead);

  for (const e of enemies) {
    e.flash = Math.max(0, e.flash - dt);
    e.slowT = Math.max(0, (e.slowT || 0) - dt);
    if (e.poisonT > 0) {
      e.poisonT = Math.max(0, e.poisonT - dt);
      if (e.poisonT <= 0) e.poisonDmg = 0;
      e.poisonTick = (e.poisonTick || 0) - dt;
      if (e.poisonTick <= 0) {
        e.poisonTick = .5;
        damageEnemy(e, e.poisonDmg || (3 + game.level * .6), 0, 0, true);
        if (e.dead) continue;
      }
    }
    if (e.stunT > 0) {
      e.stunT = Math.max(0, e.stunT - dt);
      continue;
    }
    const slowStartX = e.x, slowStartY = e.y;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    let sx = 0, sy = 0;
    for (const o of enemies) {
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od = Math.hypot(ox, oy) || 1;
      if (od < e.r + o.r + 8) { sx += ox / od; sy += oy / od; }
    }

    if (e.type === "grunt") {
      e.x += (nx + sx * .5) * e.speed * dt;
      e.y += (ny + sy * .5) * e.speed * dt;
    } else if (e.type === "shooter") {
      if (d > 265) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else if (d < 165) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .7 * dt; e.y += nx * e.speed * .7 * dt; }
      e.x += sx * 30 * dt; e.y += sy * 30 * dt;
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .45;
        e.aimAngle = Math.atan2(dy, dx);
        e.timer = Math.max(.8, 1.8 - game.level * .07) + rand(0, .5);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          enemyBullet(e, e.aimAngle, 300, 9 + game.level, "#e79bff");
          sfx("shoot");
        }
      }
    } else if (e.type === "sniper") {
      if (d < 300) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else if (d > 430) { e.x += nx * e.speed * .6 * dt; e.y += ny * e.speed * .6 * dt; }
      else { e.x += -ny * e.speed * .5 * dt; e.y += nx * e.speed * .5 * dt; }
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .85;
        e.aimAngle = Math.atan2(dy, dx);
        e.timer = rand(1.9, 2.7);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          enemyBullet(e, e.aimAngle, 620, 14 + game.level * 2, "#ff7ce5", 2);
          sfx("laser");
        }
      }
    } else if (e.type === "bomber") {
      e.x += nx * e.speed * dt;
      e.y += ny * e.speed * dt;
      if (d < 70) {
        e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
        if (e.timer <= 0) explodeBomber(e);
      } else {
        e.timer = .55;
      }
    } else if (e.type === "charger") {
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.state === "idle") {
        e.x += (nx * .55 + sx) * e.speed * dt;
        e.y += (ny * .55 + sy) * e.speed * dt;
        if (d < 250 && e.timer <= 0) {
          e.state = "windup"; e.timer = .7; e.dx = nx; e.dy = ny;
        }
      } else if (e.state === "windup") {
        if (e.timer <= 0) {
          e.state = "dash"; e.timer = .38;
          e.vx = e.dx * 360; e.vy = e.dy * 360;
          sfx("dash");
        }
      } else {
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.timer <= 0 || e.x < R.x + 25 || e.x > R.x + R.w - 25 || e.y < R.y + 25 || e.y > R.y + R.h - 25) {
          e.state = "idle"; e.timer = rand(1.1, 2); e.vx = e.vy = 0;
        }
      }
    } else if (e.type === "shielder") {
      e.facing = Math.atan2(dy, dx);
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.state === "bash") {
        e.x += e.bashVX * dt; e.y += e.bashVY * dt;
        if (e.timer <= 0) { e.state = "idle"; e.timer = rand(2.2, 3.2); }
      } else {
        e.x += (nx * .7 + sx) * e.speed * dt;
        e.y += (ny * .7 + sy) * e.speed * dt;
        if (d < 170 && e.timer <= 0) {
          e.state = "bash"; e.timer = .32;
          e.bashVX = nx * 300; e.bashVY = ny * 300;
          sfx("dash");
        }
      }
    } else if (e.type === "reflector") {
      e.facing = Math.atan2(dy, dx);
      e.reflectCd = Math.max(0, (e.reflectCd || 0) - dt);
      if (d > 250) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else if (d < 160) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .65 * dt; e.y += nx * e.speed * .65 * dt; }
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.timer <= 0 && e.reflectCharges > 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .3;
        e.aimAngle = Math.atan2(dy, dx);
        e.timer = rand(2, 3);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          enemyBullet(e, e.aimAngle, 280, 8 + game.level, "#6bd9ff");
          sfx("shoot");
        }
      }
    } else if (e.type === "splitter" || e.type === "spawnling") {
      e.phase += dt * (e.type === "splitter" ? 7 : 11);
      const wobble = Math.sin(e.phase) * (e.type === "splitter" ? .5 : .35);
      e.x += (nx - ny * wobble) * e.speed * dt;
      e.y += (ny + nx * wobble) * e.speed * dt;
    } else if (e.type === "turret") {
      e.facing = Math.atan2(dy, dx);
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .4;
        e.aimAngle = e.facing;
        e.timer = Math.max(1.1, 2.1 - game.level * .08);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          for (let k = -1; k <= 1; k++) {
            enemyBullet(e, e.aimAngle + k * .12, 330, 8 + game.level, "#ffe27a");
          }
          sfx("shoot");
          shockwave(e.x, e.y, 44, "#ffd76b");
        }
      }
    } else if (e.type === "laser") {
      if (d > 360) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else if (d < 250) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .6 * dt; e.y += nx * e.speed * .6 * dt; }
      e.aimAngle = e.beam > 0 || e.telegraph > 0 ? e.aimAngle : Math.atan2(dy, dx);
      e.beamHitCd = Math.max(0, e.beamHitCd - dt);
      if (e.beam > 0) {
        e.beam -= dt;
        const bx = Math.cos(e.aimAngle), by = Math.sin(e.aimAngle);
        const proj = (p.x - e.x) * bx + (p.y - e.y) * by;
        const perp = Math.abs((p.x - e.x) * by - (p.y - e.y) * bx);
        if (proj > 0 && proj < 900 && perp < p.r + 7 && e.beamHitCd <= 0) {
          damagePlayer(10 + game.level * 2);
          e.beamHitCd = .22;
        }
      } else {
        e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
        if (e.timer <= 0 && e.telegraph <= 0) {
          e.telegraph = e.telegraphMax = .9;
          e.aimAngle = Math.atan2(dy, dx);
          e.timer = rand(2.2, 3.2);
        }
        if (e.telegraph > 0) {
          e.telegraph -= dt;
          if (e.telegraph <= 0) { e.beam = .6; sfx("laser"); buzz(35); }
        }
      }
    } else if (e.type === "miner") {
      e.x += (nx * .7 + sx) * e.speed * dt;
      e.y += (ny * .7 + sy) * e.speed * dt;
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.timer <= 0) {
        e.timer = rand(2.2, 3.4);
        currentRoom().props.push({
          kind: "mine", x: e.x, y: e.y, r: 16,
          arm: 1, life: 13, damage: 12 + game.level * 2, blink: 0
        });
        burst(e.x, e.y, "#c8a06a", 6, 60);
      }
    } else if (e.type === "phantom") {
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      e.phase += dt * 5;
      e.x += (nx * .5 + sx + Math.sin(e.phase) * .5) * e.speed * dt;
      e.y += (ny * .5 + sy + Math.cos(e.phase) * .5) * e.speed * dt;
      if (e.timer <= 0) {
        e.timer = rand(2.4, 3.4);
        burst(e.x, e.y, e.color, 14, 130);
        const a = rand(0, Math.PI * 2), rr = rand(150, 220);
        e.x = clamp(p.x + Math.cos(a) * rr, R.x + 40, R.x + R.w - 40);
        e.y = clamp(p.y + Math.sin(a) * rr, R.y + 40, R.y + R.h - 40);
        burst(e.x, e.y, e.color, 14, 130);
        enemyBullet(e, Math.atan2(p.y - e.y, p.x - e.x), 190, 10 + game.level, "#d8b8ff");
        sfx("laser");
      }
    } else if (e.type === "boss" || e.type === "twin") {
      if (d > 190) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .6 * dt; e.y += nx * e.speed * .6 * dt; }
      if (!e.enraged && e.hp < e.maxHp * .55) {
        e.enraged = true;
        e.speed *= 1.2;
        e.timer = .3;
        floater((e.isTwin ? "БЛИЗНЕЦ" : floorData(game.floor).bossName) + " ЗЛИТСЯ!", e.x, e.y - 60, "#ffd76b");
        sfx("boss");
        buzz(80);
      }
      if (!e.frenzied && e.hp < e.maxHp * .25) {
        e.frenzied = true;
        e.speed *= 1.18;
        e.timer = .15;
        shockwave(e.x, e.y, 100, e.color);
        floater("ПРЕДЕЛЬНАЯ ЯРОСТЬ!", e.x, e.y - 74, "#ff6b81");
        sfx("boss");
        buzz(100);
      }
      if (!e.collapsed && e.hp < e.maxHp * .1) {
        e.collapsed = true;
        e.speed *= 1.15;
        e.timer = .1;
        shockwave(e.x, e.y, 150, "#ffffff");
        floater("ФИНАЛЬНАЯ ФАЗА!", e.x, e.y - 88, "#ffffff");
        sfx("boss");
        buzz(120);
      }
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.3 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = e.collapsed ? .24 : e.frenzied ? .3 : e.enraged ? .38 : .55;
        e.nextPattern = e.pattern++ % (e.collapsed ? 4 : 3);
        e.timer = Math.max(.55, 1.9 - game.level * .06) * (e.collapsed ? .45 : e.frenzied ? .55 : e.enraged ? .72 : 1);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) fireBossPattern(e, e.nextPattern);
      }
    }

    if (e.slowT > 0) {
      e.x = slowStartX + (e.x - slowStartX) * .5;
      e.y = slowStartY + (e.y - slowStartY) * .5;
    }
    e.x = clamp(e.x, R.x + e.r + 6, R.x + R.w - e.r - 6);
    e.y = clamp(e.y, R.y + e.r + 6, R.y + R.h - e.r - 6);
    resolveObstacles(e, e.r);

    const cd = dist(p.x, p.y, e.x, e.y);
    if (cd < e.r + p.r && p.invuln <= 0 && p.dashTime <= 0) {
      damagePlayer(e.type === "boss" || e.type === "twin" ? Math.round(e.contact * (e.damageScale || 1)) : e.contact, e);
      const cdx = p.x - e.x, cdy = p.y - e.y;
      const cl = Math.hypot(cdx, cdy) || 1;
      const push = 18;
      e.x -= cdx / cl * push; e.y -= cdy / cl * push;
    }
  }
}

function explodeBomber(e) {
  if (e.exploded) return;
  e.exploded = true;
  e.dead = true;
  burst(e.x, e.y, "#ffb36b", 26, 220);
  if (settings.shake) shake = Math.max(shake, 7);
  sfx("shotgun");
  buzz(60);
  const p = game.player;
  if (dist(p.x, p.y, e.x, e.y) < 100) damagePlayer(14 + game.level * 3);
}

function fireBossPattern(e, pattern) {
  const enraged = !!e.enraged;
  const frenzied = !!e.frenzied;
  const ds = e.damageScale || 1;
  const lv = game.level;
  const p = game.player;
  const color = e.color;

  if (pattern === 3) {
    finalBossPattern(e, ds, lv, p);
    if (settings.shake) shake = Math.max(shake, 8);
    sfx("rail");
    return;
  }

  if (e.bossType === "frost") {
    if (pattern === 0) {
      const n = (enraged ? 24 : 16) + (frenzied ? 8 : 0);
      const off = e.pattern * .13;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + off;
        enemyBullet(e, a, 185 + (i % 2) * 45, Math.round((9 + lv) * ds), i % 2 ? "#8ee6ff" : "#d8f7ff");
      }
    } else if (pattern === 1) {
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      const arms = enraged ? 6 : 4;
      const steps = enraged ? 3 : 2;
      for (let arm = 0; arm < arms; arm++) {
        for (let k = 0; k < steps; k++) {
          enemyBullet(e, a0 + arm * Math.PI * 2 / arms + k * .09, 235 + k * 32, Math.round((10 + lv) * ds), "#b8f0ff");
        }
      }
    } else {
      const count = enraged ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const q = randomSpawnPoint(60);
        currentRoom().props.push(makeEnemy(i % 3 === 0 ? "laser" : i % 3 === 1 ? "shielder" : "sniper", q.x, q.y));
      }
      const spikes = (enraged ? 4 : 3) + (frenzied ? 2 : 0);
      for (let i = 0; i < spikes; i++) {
        const a = i / spikes * Math.PI * 2 + game.time;
        currentRoom().props.push({
          kind: "trap",
          x: clamp(p.x + Math.cos(a) * 100, R.x + 55, R.x + R.w - 55),
          y: clamp(p.y + Math.sin(a) * 100, R.y + 55, R.y + R.h - 55),
          r: 24, damage: Math.round((10 + lv) * ds),
          color: "#b8f0ff", timer: .7 + i * .06, active: 0
        });
      }
      floater("Ледяные шипы!", e.x, e.y - 48, "#b8f0ff");
    }
  } else if (e.bossType === "magma") {
    if (pattern === 0) {
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      const n = (enraged ? 13 : 9) + (frenzied ? 5 : 0);
      for (let i = 0; i < n; i++) {
        const spread = (i - (n - 1) / 2) * .12;
        enemyBullet(e, a0 + spread, 255 + (i % 3) * 35, Math.round((12 + lv) * ds), i % 2 ? "#ff9d4d" : "#ffd76b");
      }
    } else if (pattern === 1) {
      const n = (enraged ? 6 : 4) + (frenzied ? 3 : 0);
      for (let i = 0; i < n; i++) {
        const q = randomSpawnPoint(40);
        currentRoom().props.push({
          kind: "trap", x: q.x, y: q.y, r: 30,
          damage: Math.round((15 + lv * 2) * ds), color: "#ffb36b",
          timer: .75 + i * .07, active: 0
        });
      }
      floater("Метеоры!", e.x, e.y - 48, "#ff9d4d");
    } else {
      const count = enraged ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const q = randomSpawnPoint(60);
        currentRoom().props.push(makeEnemy(i % 3 === 0 ? "miner" : i % 3 === 1 ? "bomber" : "splitter", q.x, q.y));
      }
      const n = (enraged ? 20 : 14) + (frenzied ? 8 : 0);
      for (let i = 0; i < n; i++) {
        enemyBullet(e, i / n * Math.PI * 2 + rand(-.04, .04), 210, Math.round((11 + lv) * ds), "#ff7a45");
      }
      floater("Извержение!", e.x, e.y - 48, "#ffb36b");
    }
  } else if (e.bossType === "swamp") {
    if (pattern === 0) {
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      const n = (enraged ? 11 : 7) + (frenzied ? 4 : 0);
      for (let i = 0; i < n; i++) {
        const spread = (i - (n - 1) / 2) * .16;
        enemyBullet(e, a0 + spread, 175 + (i % 2) * 35, Math.round((8 + lv) * ds), i % 2 ? "#9ade7a" : "#c6ff9e");
      }
    } else if (pattern === 1) {
      const n = (enraged ? 6 : 4) + (frenzied ? 2 : 0);
      for (let i = 0; i < n; i++) {
        const q = randomSpawnPoint(45);
        currentRoom().props.push({
          kind: "trap", x: q.x, y: q.y, r: 28,
          damage: Math.round((9 + lv * 1.5) * ds), color: "#9ade7a",
          timer: .9 + i * .08, active: 0
        });
      }
      floater("Ядовитые лужи!", e.x, e.y - 48, "#9ade7a");
    } else {
      const count = (enraged ? 3 : 2) + (frenzied ? 1 : 0);
      for (let i = 0; i < count; i++) {
        const q = randomSpawnPoint(60);
        currentRoom().props.push(makeEnemy(i % 2 ? "splitter" : "spawnling", q.x, q.y));
      }
      const n = (enraged ? 16 : 10) + (frenzied ? 6 : 0);
      for (let i = 0; i < n; i++) {
        enemyBullet(e, i / n * Math.PI * 2 + game.time, 165, Math.round((7 + lv) * ds), "#9ade7a");
      }
      floater("Споровый рой!", e.x, e.y - 48, "#c6ff9e");
    }
  } else if (e.bossType === "void") {
    if (pattern === 0) {
      const n = (enraged ? 22 : 14) + (frenzied ? 8 : 0);
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + e.pattern * .21;
        enemyBullet(e, a, 195 + (i % 3) * 30, Math.round((10 + lv) * ds), i % 2 ? "#c08cff" : "#e0b6ff");
      }
      const q = randomSpawnPoint(110);
      e.x = q.x; e.y = q.y;
      shockwave(e.x, e.y, 70, "#c08cff");
      floater("Прыжок в тень", e.x, e.y - 52, "#c08cff");
    } else if (pattern === 1) {
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      for (let arm = 0; arm < (enraged ? 4 : 3); arm++) {
        for (let k = 0; k < (frenzied ? 4 : 3); k++) {
          enemyBullet(e, a0 + arm * Math.PI * 2 / (enraged ? 4 : 3) + k * .11,
                      260 + k * 28, Math.round((11 + lv) * ds), "#c08cff");
        }
      }
      const count = (enraged ? 3 : 2) + (frenzied ? 1 : 0);
      for (let i = 0; i < count; i++) {
        const q = randomSpawnPoint(70);
        currentRoom().props.push(makeEnemy("phantom", q.x, q.y));
      }
    } else {
      const n = (enraged ? 18 : 12) + (frenzied ? 6 : 0);
      for (let i = 0; i < n; i++) {
        const t = i / n;
        const a = t * Math.PI * 6 + game.time;
        const d = 90 + t * 260;
        const x = clamp(e.x + Math.cos(a) * d, R.x + 50, R.x + R.w - 50);
        const y = clamp(e.y + Math.sin(a) * d, R.y + 50, R.y + R.h - 50);
        currentRoom().props.push({
          kind: "trap", x, y, r: 18, damage: Math.round((12 + lv) * ds),
          color: "#c08cff", timer: .7 + t * .7, active: 0
        });
      }
      floater("Схлопывание бездны!", e.x, e.y - 48, "#c08cff");
    }
  } else {
    if (pattern === 0) {
      const n = (enraged ? 18 : 12) + Math.min(6, lv) + (frenzied ? 8 : 0);
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + rand(-.05, .05);
        enemyBullet(e, a, enraged ? 280 : 230, Math.round((10 + lv) * ds), color);
      }
    } else if (pattern === 1) {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      const arms = enraged ? 3 : 2;
      for (let i = -arms; i <= arms; i++) {
        enemyBullet(e, a + i * .15, 340 + i * 15, Math.round((11 + lv) * ds), "#ffd36b");
      }
    } else {
      const count = enraged ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const q = randomSpawnPoint(60);
        currentRoom().props.push(makeEnemy(
          i % 4 === 0 ? "turret" : i % 4 === 1 ? "shielder" : i % 4 === 2 ? "phantom" : "splitter", q.x, q.y));
      }
      floater("Призыв!", e.x, e.y - 48, "#ff9de2");
    }
  }
  if (settings.shake) shake = Math.max(shake, enraged ? 6 : 4);
  sfx("rail");
}

/* Unique attack unlocked below 10% HP — phase three of every boss. */
function finalBossPattern(e, ds, lv, p) {
  const type = e.bossType;
  const color = e.color || floorData(game.floor).accent;
  const room = currentRoom();
  const ring = (count, speed, damage, col, offset) => {
    for (let i = 0; i < count; i++) {
      enemyBullet(e, i / count * Math.PI * 2 + (offset || 0) + game.time * .25,
                  speed, Math.round(damage * ds), col);
    }
  };
  const summon = (types) => {
    for (const t of types) {
      const q = randomSpawnPoint(70);
      room.props.push(makeEnemy(t, q.x, q.y));
    }
  };
  if (type === "frost") {
    ring(14, 200, 11 + lv, "#8ee6ff", 0);
    ring(14, 275, 10 + lv, "#d8f7ff", .11);
    summon(["shielder", "sniper", "spawnling", "spawnling"]);
    floater("Ледяной круг!", e.x, e.y - 48, "#b8f0ff");
  } else if (type === "magma") {
    ring(18, 240, 12 + lv, "#ff9d4d", 0);
    for (let i = 0; i < 6; i++) {
      const q = randomSpawnPoint(40);
      room.props.push({
        kind: "trap", x: q.x, y: q.y, r: 34,
        damage: Math.round((16 + lv * 2) * ds), color: "#ffb36b", timer: .6 + i * .05, active: 0
      });
    }
    summon(["miner", "bomber", "splitter"]);
    floater("Огненный шторм!", e.x, e.y - 48, "#ff9d4d");
  } else if (type === "swamp") {
    ring(16, 190, 10 + lv, "#9ade7a", 0);
    for (let i = 0; i < 4; i++) {
      const q = randomSpawnPoint(45);
      room.props.push({
        kind: "trap", x: q.x, y: q.y, r: 30,
        damage: Math.round((11 + lv * 1.6) * ds), color: "#9ade7a", timer: .8 + i * .06, active: 0
      });
    }
    summon(["splitter", "splitter", "bomber"]);
    floater("Болотный рой!", e.x, e.y - 48, "#9ade7a");
  } else if (type === "void") {
    for (let i = 0; i < 28; i++) {
      const t = i / 28;
      enemyBullet(e, t * Math.PI * 4 + game.time, 180 + t * 160,
                  Math.round((11 + lv) * ds), "#c08cff");
    }
    summon(["phantom", "phantom", "laser"]);
    shockwave(e.x, e.y, 120, "#c08cff");
    floater("Разрыв реальности!", e.x, e.y - 48, "#c08cff");
  } else {
    ring(20, 260, 11 + lv, color, 0);
    summon(["charger", "shielder", "splitter"]);
    floater("Последний рубеж!", e.x, e.y - 48, color);
  }
}

function updateTraps(dt) {
  const p = game.player;
  const props = currentRoom().props;
  for (const o of props) {
    if (o.kind !== "trap") continue;
    o.timer -= dt;
    if (o.timer <= 0 && o.active <= 0) {
      o.timer = 1.4;
      o.active = .5;
      sfx("trap");
    }
    if (o.active > 0) {
      o.active -= dt;
      if (dist(p.x, p.y, o.x, o.y) < o.r + p.r * .6) damagePlayer(o.damage);
    }
  }

  for (let i = props.length - 1; i >= 0; i--) {
    const h = props[i];
    if (h.kind === "fire") {
      h.life -= dt;
      h.tick -= dt;
      if (h.tick <= 0) {
        h.tick = .4;
        for (const e of props) {
          if (!e.type || e.dead) continue;
          if (dist(h.x, h.y, e.x, e.y) < h.r + e.r) {
            damageEnemy(e, h.damage, e.x - h.x, e.y - h.y, true);
            if (chance(.5)) game.particles.push({
              x: e.x + rand(-10, 10), y: e.y + rand(-10, 10),
              vx: rand(-20, 20), vy: rand(-60, -20), life: .4, maxLife: .4,
              color: "#ff9d4d", size: 5
            });
          }
        }
      }
      if (h.life <= 0) props.splice(i, 1);
      continue;
    }
    if (h.kind !== "mine") continue;
    h.life -= dt;
    h.arm = Math.max(0, h.arm - dt);
    h.blink += dt;
    let blow = h.life <= 0;
    let detonated = false;
    if (h.fromPlayer) {
      if (h.arm <= 0) {
        for (const e of props) {
          if (!e.type || e.dead) continue;
          if (dist(h.x, h.y, e.x, e.y) < h.r + e.r + 10) {
            explodeAt(h.x, h.y, 58, h.damage, h.color);
            if (h.split) spawnShards(h.x, h.y, h.color, h.damage, h.split,
                                      game.syn.electricRain ? 2 : 0);
            burst(h.x, h.y, h.color, 16, 150);
            detonated = true;
            blow = true;
            break;
          }
        }
      }
    } else if (h.arm <= 0 && dist(p.x, p.y, h.x, h.y) < 42 + p.r) blow = true;
    if (blow) {
      if (!h.fromPlayer) explodeAt(h.x, h.y, 82, h.damage, "#ffb36b");
      else if (!detonated) explodeAt(h.x, h.y, 50, h.damage, h.color);
      props.splice(i, 1);
    }
  }
}

function enemyBullet(e, angle, speed, damage, color, pierce = 0) {
  game.bullets.push({
    owner: "enemy",
    x: e.x + Math.cos(angle) * (e.r + 4),
    y: e.y + Math.sin(angle) * (e.r + 4),
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: 5, damage, color, life: 3, pierce
  });
}

function updateBullets(dt) {
  const p = game.player;
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    const prevX = b.x, prevY = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.orbit && b.owner === "player") {
      const o = b.orbit;
      o.angle += o.spin * dt;
      b.x = p.x + Math.cos(o.angle) * o.radius;
      b.y = p.y + Math.sin(o.angle) * o.radius;
      b.vx = -Math.sin(o.angle) * o.speed;
      b.vy = Math.cos(o.angle) * o.speed;
      o.t = (o.t || 0) + dt;
      if (o.t >= .45) { o.t = 0; if (b.hit) b.hit.length = 0; }
    } else if (b.owner === "player" && b.homing > 0 && !b.returning) {
      const t = nearestEnemy(b.x, b.y, 380);
      if (t) {
        const cur = Math.atan2(b.vy, b.vx);
        const want = Math.atan2(t.y - b.y, t.x - b.x);
        const delta = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        const na = cur + clamp(delta, -b.homing * dt, b.homing * dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    b.life -= dt;
    let remove = b.life <= 0 || b.remove;

    if (b.boomerang && !b.returning && b.life <= b.maxLife * .45) {
      b.returning = true;
      if (b.hit) b.hit.length = 0;
    }
    if (b.boomerang && b.returning) {
      const ang = Math.atan2(p.y - b.y, p.x - b.x);
      const sp = Math.hypot(b.vx, b.vy) || 520;
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
      if (game.syn.returnBolt && !b.boosted) {
        b.boosted = true;
        b.pierce += 2;
        b.damage *= 1.5;
      }
      if (dist(b.x, b.y, p.x, p.y) < p.r + b.r) remove = true;
    }

    const outX = b.x < R.x + 5 || b.x > R.x + R.w - 5;
    const outY = b.y < R.y + 5 || b.y > R.y + R.h - 5;
    if ((outX || outY) && !(b.orbit && b.owner === "player")) {
      if (b.boomerang) {
        b.returning = true;
        if (b.hit) b.hit.length = 0;
        b.x = clamp(b.x, R.x + 7, R.x + R.w - 7);
        b.y = clamp(b.y, R.y + 7, R.y + R.h - 7);
      } else if (b.owner === "player" && b.bounce > 0 && !b.returning) {
        if (outX) b.vx = -b.vx;
        if (outY) b.vy = -b.vy;
        b.x = clamp(b.x, R.x + 7, R.x + R.w - 7);
        b.y = clamp(b.y, R.y + 7, R.y + R.h - 7);
        b.bounce--;
        burst(b.x, b.y, b.color, 5, 90);
        if (game.syn.lightningBounce) chainFrom(b.x, b.y, b.damage * .7, b.color, 2);
      } else {
        // Explosive rounds should detonate on the room edge instead of vanishing.
        if (b.owner === "player" && b.explosive && b.explodeOnWall && !b.exploded) {
          b.exploded = true;
          explodeAt(clamp(b.x, R.x + 6, R.x + R.w - 6), clamp(b.y, R.y + 6, R.y + R.h - 6),
                    b.explosive, b.damage, b.color);
        }
        remove = true;
      }
    }

    if (!remove && !b.orbit) {
      for (const o of activeObstacles()) {
        if (segmentDist(o.x, o.y, prevX, prevY, b.x, b.y) < b.r + o.r) {
          if (b.owner === "player" && b.bounce > 0) {
            const bx = b.x - o.x, by = b.y - o.y;
            const bn = Math.hypot(bx, by) || 1;
            const dot = (b.vx * bx + b.vy * by) / bn;
            b.vx -= 2 * dot * bx / bn;
            b.vy -= 2 * dot * by / bn;
            b.x += b.vx * .03; b.y += b.vy * .03;
            b.bounce--;
            burst(b.x, b.y, b.color, 5, 90);
            if (game.syn.lightningBounce) chainFrom(b.x, b.y, b.damage * .7, b.color, 2);
          } else {
            if (o.kind !== "pillar") {
              if (b.owner === "player") damageObstacle(o, b.damage, b.vx, b.vy);
              else burst(b.x, b.y, o.color, 3, 60);
            } else burst(b.x, b.y, o.color, 4, 70);
            if (b.explosive) {
              b.exploded = true;
              explodeAt(b.x, b.y, b.explosive, b.damage, b.color);
            }
            remove = true;
          }
          break;
        }
      }
    }

    if (!remove && b.owner === "player") {
      for (const e of currentRoom().props) {
        if (!e.type || e.dead || (b.hit && b.hit.indexOf(e) >= 0)) continue;
        if (segmentDist(e.x, e.y, prevX, prevY, b.x, b.y) < b.r + e.r) {
          if (e.type === "reflector" && (e.reflectCharges || 0) > 0 && (e.reflectCd || 0) <= 0) {
            const incoming = Math.atan2(b.vy, b.vx) + Math.PI;
            if (angleDelta(incoming, e.facing) < 1.5) {
              e.reflectCharges--;
              e.reflectCd = .15;
              b.owner = "enemy";
              b.vx = -b.vx * .9; b.vy = -b.vy * .9;
              b.damage = Math.round(b.damage * .8);
              b.color = "#6bd9ff";
              b.life = 2;
              if (b.hit) b.hit.length = 0;
              burst(b.x, b.y, "#6bd9ff", 10, 120);
              floater("ОТРАЖЕНО", b.x, b.y - 16, "#6bd9ff");
              sfx("block");
              if (game.syn.cutBullets) game.cutBullets++;
              if (e.reflectCharges <= 0) {
                floater("ЩИТ РАЗБИТ", e.x, e.y - e.r - 16, "#ff9de2");
                burst(e.x, e.y, "#6bd9ff", 20, 180);
                sfx("shatter");
              }
              continue;
            }
          }
          if (b.hit) b.hit.push(e);
          damageEnemy(e, b.damage, b.vx, b.vy);
          if (b.slow) e.slowT = Math.max(e.slowT || 0, b.slow);
          if (b.poison) {
            e.poisonT = Math.max(e.poisonT || 0, 3);
            e.poisonDmg = Math.max(e.poisonDmg || 0, b.poison);
          }
          if (b.stun) {
            e.stunT = Math.max(e.stunT || 0, b.stun);
            burst(e.x, e.y, "#8ee6ff", 8, 90);
          }
          if (b.healOnHit) {
            const before = p.hp;
            p.hp = Math.min(p.maxHp, p.hp + b.healOnHit);
            if (p.hp > before) floater("+" + Math.round(p.hp - before), p.x, p.y - 46, "#7cff9b");
          }
          if (b.shock && !b.explosive) {
            explodeAt(b.x, b.y, b.shock, b.damage * .5, b.color, e);
          }
          if (b.fire && e.slowT > 0 && game.syn.thermal) {
            e.slowT = 0;
            explodeAt(b.x, b.y, 48, b.damage * 1.7, b.color, e);
            floater("ТЕРМОУДАР", b.x, b.y - 24, "#ff9d4d");
          }
          if (game.syn.iceBolt && b.pierce > 0 && e.slowT > 0) {
            damageEnemy(e, b.damage * .8, b.vx, b.vy, true);
            e.slowT = 0;
            floater("РАЗМОРОЗКА!", b.x, b.y - 24, "#8ee6ff");
          }
          burst(b.x, b.y, b.color, 4, 80);
          if (b.chain) chainFrom(b.x, b.y, b.damage, b.color, b.chain, e);
          if (b.split) {
            spawnShards(b.x, b.y, b.color, b.damage, b.split, game.syn.electricRain ? 2 : 0);
            remove = true;
          } else if (b.explosive) {
            b.exploded = true;
            explodeAt(b.x, b.y, b.explosive, b.damage, b.color, e);
            remove = true;
          } else if (b.pierce > 0) b.pierce--;
          else if (!b.boomerang) remove = true;
          break;
        }
      }
    } else if (!remove && b.owner === "enemy") {
      if (dist(b.x, b.y, p.x, p.y) < b.r + p.r) {
        damagePlayer(b.damage);
        remove = true;
      }
    }
    if (b.life <= 0 && !remove) {
      if (b.split) {
        spawnShards(b.x, b.y, b.color, b.damage, b.split, game.syn.electricRain ? 2 : 0);
        remove = true;
      } else if (b.explosive && !b.exploded) {
        b.exploded = true;
        explodeAt(b.x, b.y, b.explosive, b.damage, b.color);
      }
    }
    if (remove) game.bullets.splice(i, 1);
  }
}

function damageEnemy(e, amount, vx, vy, ignoreShield) {
  if (e.dead) return;
  const p = game.player;
  if (e.type === "shielder" && !ignoreShield && (e.shieldHp || 0) > 0) {
    const incoming = Math.atan2(vy, vx) + Math.PI;
    const diff = Math.abs(((incoming - e.facing + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (diff < 1.2) {
      e.shieldHp -= amount;
      amount *= .18;
      const sx = e.x + Math.cos(e.facing) * e.r, sy = e.y + Math.sin(e.facing) * e.r;
      burst(sx, sy, "#8ee6ff", 7, 90);
      floater("БЛОК", sx, sy - 14, "#8ee6ff");
      sfx("block");
      if (e.shieldHp <= 0) {
        floater("ЩИТ РАЗБИТ!", e.x, e.y - e.r - 26, "#ff9de2");
        burst(e.x, e.y, "#8ee6ff", 20, 180);
        sfx("shatter");
      }
    }
  }
  const crit = rng() < p.critChance;
  const dealt = amount * (crit ? (p.critMul || 2) : 1);
  e.hp -= dealt;
  if (p.execute > 0 && e.hp > 0 && e.type !== "boss" && e.maxHp && e.hp / e.maxHp < .22) {
    e.hp = 0;
    floater("ДОБИВАНИЕ", e.x, e.y - e.r - 22, "#ff6b81");
  }
  e.flash = .08;
  const l = Math.hypot(vx, vy) || 1;
  e.x += vx / l * 3;
  e.y += vy / l * 3;
  if (settings.damageNumbers && (crit || dealt >= 14 || chance(.35))) {
    floater((crit ? "✦ " : "") + Math.round(dealt), e.x + rand(-10, 10), e.y - e.r - 8,
            crit ? "#ffe27a" : "#e9e6f5");
  }
  if (e.hp <= 0) {
    e.dead = true;
    if (e.type === "bomber") explodeBomber(e);
    if (e.type === "splitter") {
      for (let i = 0; i < 2; i++) {
        const a = rand(0, Math.PI * 2);
        currentRoom().props.push(makeEnemy("spawnling", e.x + Math.cos(a) * 22, e.y + Math.sin(a) * 22));
      }
      burst(e.x, e.y, "#b6ffc4", 14, 150);
    }
    game.killCount++;
    game.stats.kills++;
    saveData.stats.kills++;
    trackQuest("kills", 1);
    if (saveData.stats.kills >= 100) unlockAchievement("hunter");
    unlockAchievement("first_blood");
    if (game.killCount % 6 === 0) earnGems(1);
    if (e.type === "turret") {
      saveData.stats.turrets++;
      if (saveData.stats.turrets >= 5) unlockAchievement("turrets");
    }
    if (e.type === "boss" || e.type === "twin") {
      if (e.type === "boss") {
        saveData.stats.bosses++;
        trackQuest("bosses", 1);
        earnGems(8);
        logEvent("Босс повержен!", "#ff9d4d");
        if (!game.roomDamaged) unlockAchievement("flawless");
      } else {
        earnGems(4);
        logEvent("Босс-близнец повержен", "#b8a1ff");
      }
    }
    if (e.elite) {
      game.eliteKills++;
      saveData.stats.elites++;
      earnCoins(8);
      earnGems(1);
      logEvent("Элитный враг уничтожен", "#ffd76b");
      if (saveData.stats.elites >= 10) unlockAchievement("elite");
    }
    if (e.mini) {
      game.miniKills++;
      saveData.stats.minis++;
      earnGems(3);
      floater("МИНИ-БОСС ПОВЕРЖЕН!", e.x, e.y - 50, "#ffd76b");
      logEvent("Мини-босс повержен", "#ffd76b");
      if (saveData.stats.minis >= 3) unlockAchievement("mini");
    }
    const big = e.mini || e.type === "boss" || e.type === "twin";
    burst(e.x, e.y, e.color, big ? 60 : 16, big ? 260 : 160);
    if (settings.shake) shake = Math.max(shake, e.type === "boss" ? 16 : big ? 8 : 3);
    earnCoins((e.type === "boss" ? 90 : big ? 30 : randi(1, 4)) + (p.coinsOnKill || 0));
    if (chance(.2)) addPickup("heart", e.x, e.y, 12);
    else if (chance(.3)) addPickup("ammo", e.x, e.y, 15);
    if (chance(.34)) addPickup("energy", e.x + rand(-12, 12), e.y - 10, e.type === "boss" ? 30 : 7);
    if (p.energyOnKill > 0) {
      p.energy = Math.min(p.energyMax, p.energy + p.energyOnKill);
    }
    const steal = p.lifesteal + (hasStatue("vampire") ? 2 : 0);
    if (steal > 0) {
      const heal = Math.min(steal, p.maxHp - p.hp);
      if (heal > 0) {
        p.hp += heal;
        floater("+" + heal, p.x, p.y - 44, "#7cff9b");
      }
    }
    sfx(e.type === "boss" ? "boss" : "pickup");
  }
}

function damagePlayer(amount, source) {
  const p = game.player;
  if (p.invuln > 0 || p.dashTime > 0 || state !== "playing" || game.victoryTimer > 0) return;
  if (game.mods.indexOf("glass") >= 0) amount *= 1.75;
  amount *= difficultyCfg().dmg;
  const dealt = Math.max(1, Math.round(amount * p.armor));
  let rest = dealt;
  if (p.shield > 0) {
    const absorbed = Math.min(p.shield, rest);
    p.shield -= absorbed;
    rest -= absorbed;
    floater("ЩИТ −" + absorbed, p.x, p.y - 40, "#ffe27a");
    shockwave(p.x, p.y, 46, "#ffe27a");
  }
  p.hp -= rest;
  // Any hit that touches the shield delays regeneration; HP damage also breaks "no hit".
  p.shieldRegenT = SHIELD_REGEN_DELAY;
  if (rest > 0) game.roomDamaged = true;
  p.invuln = .55;
  p.hitFlash = .18;
  if (settings.shake) shake = Math.max(shake, 8);
  burst(p.x, p.y, "#ff5577", 10, 120);
  if (rest > 0) floater("-" + rest, p.x, p.y - 26, "#ff6b81");
  sfx("hurt");
  buzz(70);
  if (p.thorns > 0 && source && source.type && !source.dead) {
    damageEnemy(source, dealt * p.thorns, source.x - p.x, source.y - p.y, true);
    burst(source.x, source.y, "#ff9d4d", 6, 80);
  }
  if (p.hp <= 0 && p.phoenix > 0) {
    p.phoenix--;
    p.hp = Math.round(p.maxHp * .45);
    p.invuln = 2;
    shockwave(p.x, p.y, 110, "#ff9d4d");
    burst(p.x, p.y, "#ffb36b", 36, 220);
    floater("ФЕНИКС!", p.x, p.y - 56, "#ff9d4d");
    sfx("clear");
    buzz(80);
  } else if (p.hp <= 0) {
    p.hp = 0;
    finishRun(false);
    state = "gameover";
  }
}

function updatePickups(dt) {
  const p = game.player;
  const list = currentRoom().pickups;
  for (let i = list.length - 1; i >= 0; i--) {
    const it = list[i];
    it.bob += dt * 4;
    it.life -= dt;
    if (it.life <= 0) { list.splice(i, 1); continue; }
    const d = dist(p.x, p.y, it.x, it.y);
    if (d < (p.pickupRange || 95) && d > 1) {
      it.x += (p.x - it.x) / d * 210 * dt;
      it.y += (p.y - it.y) / d * 210 * dt;
    }
    if (d < p.r + 14) {
      if (it.kind === "heart") {
        p.hp = Math.min(p.maxHp, p.hp + it.value);
        floater("+" + it.value + " HP", it.x, it.y - 20, "#7cff9b");
      } else if (it.kind === "coin") {
        earnCoins(it.value);
        floater("+" + it.value, it.x, it.y - 20, "#ffd76b");
        sfx("coin");
      } else if (it.kind === "ammo") {
        for (const w of p.weapons) if (Number.isFinite(w.reserve)) w.reserve += it.value;
        floater("+Патроны", it.x, it.y - 20, "#8ee6ff");
      } else if (it.kind === "energy") {
        p.energy = Math.min(p.energyMax, p.energy + it.value);
        floater("+" + it.value + " ЭНЕРГИИ", it.x, it.y - 20, "#8ee6ff");
      } else if (it.kind === "weapon") {
        addWeapon(it.weaponId);
      }
      burst(it.x, it.y, it.kind === "coin" ? "#ffd76b" : "#ffffff", 8, 90);
      sfx("pickup");
      list.splice(i, 1);
    }
  }
}

/* ---------- drawing ---------- */
function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  tooltip = null;
  drawBackdrop();

  if (state === "menu") { drawMenu(); ctx.restore(); return; }
  if (state === "install") { drawInstallGuide(); ctx.restore(); return; }
  if (state === "setup") { drawSetup(); ctx.restore(); return; }
  if (state === "achievements") { drawAchievements(); ctx.restore(); return; }
  if (state === "heroes") { drawHeroes(); ctx.restore(); return; }
  if (state === "trials") { drawTrials(); ctx.restore(); return; }

  ctx.save();
  ctx.translate(shakeX, shakeY);
  drawRoom();
  drawTraps();
  drawProps();
  drawPickups();
  drawBullets();
  drawEnemies();
  drawPlayer();
  drawEffects();
  drawParticles();
  drawFloaters();
  drawVignette();
  if (game.flash > 0) {
    ctx.fillStyle = `rgba(255,190,120,${game.flash * .55})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (state === "playing" || state === "paused") {
    drawHUD();
    if (touchMode() || touch.moveId !== null || touch.attackId !== null || touch.drag) drawTouchControls();
  }
  if (state === "playing" && mapExpanded) drawMapOverlay();
  if (state === "shop") drawShop();
  if (state === "reward") drawReward();
  if (state === "buff") drawBuffChoice();
  if (state === "weaponChoice") drawWeaponChoice();
  if (state === "settings") drawSettings();
  if (state === "paused") drawCenterPanel("ПАУЗА", isTouch ? "Коснись экрана, чтобы продолжить" : "Нажмите P или Esc, чтобы продолжить", "#8ee6ff");
  if (state === "gameover") drawEnd(false);
  if (state === "victory") drawEnd(true);
  if (state === "dev") drawDevTools();
  drawTooltip();
  ctx.restore();
}

function drawBackdrop() {
  const theme = game ? roomTheme(currentRoom()) : FLOORS[0];
  const g = ctx.createRadialGradient(W / 2, 40, 40, W / 2, H, 620);
  g.addColorStop(0, theme.glow);
  g.addColorStop(1, "#0b0b13");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.035)";
  for (let i = 0; i < 40; i++) {
    const x = (i * 197 + 43) % W;
    const y = (i * 89 + 121) % H;
    ctx.fillRect(x, y, 2, 2);
  }
}

function drawRoom() {
  const room = currentRoom();
  const theme = roomTheme(room);
  ctx.fillStyle = room.type === "combat" || room.type === "boss" || room.type === "arena" ? theme.floorAlt : theme.floor;
  ctx.fillRect(R.x, R.y, R.w, R.h);

  const tile = 40;
  for (let y = R.y; y < R.y + R.h; y += tile) {
    for (let x = R.x; x < R.x + R.w; x += tile) {
      const h = ((x * 13 + y * 7 + room.seed) | 0) % 11;
      ctx.fillStyle = h % 3 === 0
        ? (theme.id === "magma" ? "rgba(255,180,100,.035)" : "rgba(255,255,255,.028)")
        : "rgba(0,0,0,.05)";
      ctx.fillRect(x + 2, y + 2, tile - 4, tile - 4);
      if (h === 5) {
        ctx.strokeStyle = theme.decor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (theme.id === "magma") {
          ctx.moveTo(x + 5, y + 26); ctx.lineTo(x + 16, y + 18);
          ctx.lineTo(x + 24, y + 24); ctx.lineTo(x + 35, y + 10);
        } else if (theme.id === "frost") {
          ctx.moveTo(x + 20, y + 6); ctx.lineTo(x + 27, y + 18);
          ctx.lineTo(x + 20, y + 30); ctx.lineTo(x + 13, y + 18);
          ctx.closePath();
        } else {
          ctx.moveTo(x + 8, y + 12); ctx.lineTo(x + 18, y + 20); ctx.lineTo(x + 14, y + 32);
        }
        ctx.stroke();
      }
    }
  }

  ctx.strokeStyle = "rgba(255,255,255,.04)";
  ctx.lineWidth = 1;
  ctx.strokeRect(R.x + .5, R.y + .5, R.w - 1, R.h - 1);

  // walls with door gaps
  const TH = 16, GAP = 45;
  const wallSeg = (x, y, w, h) => {
    ctx.fillStyle = theme.wall;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = theme.accent;
    ctx.globalAlpha = .16;
    if (w > h) ctx.fillRect(x, y, w, 3);
    else ctx.fillRect(x, y, 3, h);
    ctx.globalAlpha = 1;
  };

  const d = room.doors;
  if (d.N) {
    wallSeg(R.x, R.y - TH, d.N.x - GAP - R.x, TH);
    wallSeg(d.N.x + GAP, R.y - TH, R.x + R.w - d.N.x - GAP, TH);
  } else wallSeg(R.x, R.y - TH, R.w, TH);

  if (d.S) {
    wallSeg(R.x, R.y + R.h, d.S.x - GAP - R.x, TH);
    wallSeg(d.S.x + GAP, R.y + R.h, R.x + R.w - d.S.x - GAP, TH);
  } else wallSeg(R.x, R.y + R.h, R.w, TH);

  if (d.W) {
    wallSeg(R.x - TH, R.y, TH, d.W.y - GAP - R.y);
    wallSeg(R.x - TH, d.W.y + GAP, TH, R.y + R.h - d.W.y - GAP);
  } else wallSeg(R.x - TH, R.y, TH, R.h);

  if (d.E) {
    wallSeg(R.x + R.w, R.y, TH, d.E.y - GAP - R.y);
    wallSeg(R.x + R.w, d.E.y + GAP, TH, R.y + R.h - d.E.y - GAP);
  } else wallSeg(R.x + R.w, R.y, TH, R.h);

  for (const key of Object.keys(d)) {
    const door = d[key];
    const horizontal = key === "N" || key === "S";
    const x = horizontal ? door.x - GAP : door.x - 9;
    const y = horizontal ? door.y - 9 : door.y - GAP;
    const w = horizontal ? GAP * 2 : 18;
    const h = horizontal ? 18 : GAP * 2;
    ctx.fillStyle = door.open ? theme.wall : theme.door;
    ctx.fillRect(x, y, w, h);
    if (door.open) {
      ctx.fillStyle = "rgba(126,230,170,.28)";
      ctx.fillRect(x, y, horizontal ? w : 4, horizontal ? 4 : h);
      ctx.fillStyle = "rgba(126,230,170,.12)";
      ctx.fillRect(horizontal ? x : x + w - 4, horizontal ? y + h - 4 : y, horizontal ? w : 4, horizontal ? 4 : h);
    } else {
      ctx.strokeStyle = theme.accent;
      ctx.lineWidth = 3;
      for (let i = 1; i < 5; i++) {
        ctx.beginPath();
        if (horizontal) { ctx.moveTo(x + i * w / 5, y + 2); ctx.lineTo(x + i * w / 5, y + h - 2); }
        else { ctx.moveTo(x + 2, y + i * h / 5); ctx.lineTo(x + w - 2, y + i * h / 5); }
        ctx.stroke();
      }
    }
  }
}

function drawTraps() {
  const theme = roomTheme(currentRoom());
  for (const o of currentRoom().props) {
    if (o.kind !== "trap") continue;
    const color = o.color || theme.trap;
    const warning = o.timer < .38 && o.active <= 0;
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.arc(0, 0, o.r, 0, 7); ctx.fill();
    if (warning) {
      ctx.strokeStyle = hexA(color, .45 + Math.sin(game.time * 22) * .25);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, o.r - 3, 0, 7); ctx.stroke();
    } else if (o.active > 0) {
      ctx.fillStyle = hexA(color, .35);
      ctx.beginPath(); ctx.arc(0, 0, o.r, 0, 7); ctx.fill();
      ctx.fillStyle = color;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 5, Math.sin(a) * 5);
        ctx.lineTo(Math.cos(a + .18) * (o.r - 4), Math.sin(a + .18) * (o.r - 4));
        ctx.lineTo(Math.cos(a - .18) * (o.r - 4), Math.sin(a - .18) * (o.r - 4));
        ctx.closePath(); ctx.fill();
      }
    } else {
      ctx.strokeStyle = hexA(color, .2);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, o.r - 5, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawVignette() {
  const p = game.player;
  if (game.mods.indexOf("fog") >= 0) {
    const fog = ctx.createRadialGradient(W / 2, H / 2, H * .12, W / 2, H / 2, H * .72);
    fog.addColorStop(0, "rgba(5,6,14,0)");
    fog.addColorStop(1, "rgba(5,6,14,.72)");
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, W, H);
  }
  const danger = 1 - clamp(p.hp / p.maxHp, 0, 1);
  if (danger < .55) return;
  const a = (danger - .55) / .45;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .28, W / 2, H / 2, H * .78);
  g.addColorStop(0, "rgba(255,40,70,0)");
  g.addColorStop(1, `rgba(255,40,70,${.12 + a * .28 + Math.sin(game.time * 6) * .03})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawMerchant(x, y, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(0, 24, 22, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#2f6b57";
  ctx.beginPath();
  ctx.moveTo(-20, 22); ctx.lineTo(-14, -10); ctx.lineTo(0, -20); ctx.lineTo(14, -10); ctx.lineTo(20, 22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#245446";
  ctx.beginPath(); ctx.arc(0, -14, 15, Math.PI, 0); ctx.lineTo(15, -2); ctx.lineTo(-15, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#12241f";
  ctx.beginPath(); ctx.ellipse(0, -12, 10, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffe27a";
  ctx.fillRect(-6, -14, 4, 3); ctx.fillRect(2, -14, 4, 3);
  ctx.fillStyle = "#ffd76b";
  ctx.beginPath(); ctx.arc(24, 4, 4, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,215,107,.35)";
  ctx.beginPath(); ctx.arc(24, 4, 10, 0, 7); ctx.fill();
  ctx.restore();
}

function drawProps() {
  for (const o of currentRoom().props) {
    if (o.dead && o.kind !== "chest") continue;
    if (o.kind === "merchant") {
      drawMerchant(o.x, o.y, 1);
      ctx.fillStyle = "rgba(255,215,107,.65)";
      ctx.font = uiFont(10, true);
      ctx.textAlign = "center";
      ctx.fillText("ТОРГОВЕЦ", o.x, o.y + 44);
    } else if (o.kind === "mine") {
      const blink = Math.sin(o.blink * (o.arm > 0 ? 9 : 18)) > 0;
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + 7, 14, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#5c4630";
      ctx.beginPath(); ctx.arc(o.x, o.y, 13, 0, 7); ctx.fill();
      ctx.fillStyle = blink ? "#ff6b81" : "#6b3a3a";
      ctx.beginPath(); ctx.arc(o.x, o.y, 5, 0, 7); ctx.fill();
      if (o.arm <= 0) {
        ctx.strokeStyle = hexA("#ff6b81", .4);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(o.x, o.y, 20 + Math.sin(o.blink * 8) * 3, 0, 7); ctx.stroke();
      }
    } else if (o.kind === "ally") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.globalAlpha = o.life < 2 && Math.floor(game.time * 12) % 2 === 0 ? .45 : 1;
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(0, o.r * .7, o.r, 5, 0, 0, 7); ctx.fill();
      if (o.allyType === "turret") {
        ctx.fillStyle = "#2d5a70";
        roundRect(-14, -12, 28, 24, 5); ctx.fill();
        ctx.strokeStyle = o.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.save(); ctx.rotate(o.facing || 0);
        ctx.fillStyle = o.color;
        roundRect(0, -4, 22, 8, 3); ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#e9f7ff";
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = hexA(o.color, .55);
        ctx.beginPath(); ctx.arc(0, Math.sin(o.phase || 0) * 4, o.r, 0, 7); ctx.fill();
        ctx.fillStyle = "#f0e9ff";
        ctx.beginPath(); ctx.arc(-3, -3, 2.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -3, 2.5, 0, 7); ctx.fill();
        if (o.fromCage) {
          ctx.save();
          ctx.rotate(o.facing || 0);
          ctx.fillStyle = "#8ee6ff";
          roundRect(o.r - 2, -2, 13, 4, 2); ctx.fill();
          ctx.restore();
        }
      }
      ctx.restore();
    } else if (o.kind === "box") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(0, 21, 25, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#7a5a38";
      roundRect(-23, -23, 46, 46, 5); ctx.fill();
      ctx.strokeStyle = o.color || "#c8a06a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-20, -20); ctx.lineTo(20, 20);
      ctx.moveTo(20, -20); ctx.lineTo(-20, 20);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.09)";
      roundRect(-18, -18, 36, 9, 2); ctx.fill();
      if (o.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${clamp(o.flash / .12, 0, 1) * .65})`;
        roundRect(-23, -23, 46, 46, 5); ctx.fill();
      }
      ctx.restore();
    } else if (o.kind === "barrel") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(0, 20, 22, 8, 0, 0, 7); ctx.fill();
      const glow = .35 + Math.sin(game.time * 8 + o.x) * .12;
      const toxicBarrel = o.subtype === "toxic", frostBarrel = o.subtype === "frost";
      ctx.fillStyle = toxicBarrel ? `rgba(140,220,120,${glow})`
                    : frostBarrel ? `rgba(160,230,255,${glow})`
                    : `rgba(255,120,60,${glow})`;
      ctx.beginPath(); ctx.arc(0, 0, 31, 0, 7); ctx.fill();
      ctx.fillStyle = toxicBarrel ? "#2a6b3c" : frostBarrel ? "#2a5870" : "#a8431f";
      roundRect(-19, -21, 38, 42, 7); ctx.fill();
      ctx.fillStyle = toxicBarrel ? "#8edf7a" : frostBarrel ? "#b8f0ff" : "#ffb15c";
      ctx.fillRect(-19, -9, 38, 5); ctx.fillRect(-19, 8, 38, 5);
      ctx.fillStyle = "#4d2412";
      ctx.beginPath(); ctx.arc(0, -3, 5, 0, 7); ctx.fill();
      ctx.fillStyle = toxicBarrel ? "#b6ffb0" : frostBarrel ? "#e0f8ff" : "#ffe27a";
      ctx.font = uiFont(10, true);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(toxicBarrel ? "☣" : frostBarrel ? "❄" : "!", 0, -3);
      if (o.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${clamp(o.flash / .12, 0, 1) * .55})`;
        roundRect(-19, -21, 38, 42, 7); ctx.fill();
      }
      ctx.restore();
    } else if (o.kind === "barrier") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.beginPath(); ctx.ellipse(0, 23, 27, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#123b34";
      roundRect(-25, -26, 50, 50, 7); ctx.fill();
      ctx.strokeStyle = o.color || SECRET_THEME.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-18, -18); ctx.lineTo(18, 18);
      ctx.moveTo(18, -18); ctx.lineTo(-18, 18);
      ctx.stroke();
      ctx.fillStyle = hexA(o.color || SECRET_THEME.accent, .15);
      roundRect(-19, -20, 38, 40, 4); ctx.fill();
      if (o.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${clamp(o.flash / .12, 0, 1) * .6})`;
        roundRect(-25, -26, 50, 50, 7); ctx.fill();
      }
      ctx.restore();
    } else if (o.kind === "cage") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.beginPath(); ctx.ellipse(0, 26, 30, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = o.opened ? "#234034" : "#132d2a";
      roundRect(-28, -28, 56, 56, 8); ctx.fill();
      ctx.strokeStyle = o.opened ? "#4b7d6a" : SECRET_THEME.accent;
      ctx.lineWidth = 3;
      if (o.opened) {
        ctx.beginPath(); ctx.moveTo(-28, -28); ctx.lineTo(-28, 28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-8, -28); ctx.lineTo(28, -28); ctx.stroke();
      } else {
        for (let i = -20; i <= 20; i += 10) {
          ctx.beginPath(); ctx.moveTo(i, -28); ctx.lineTo(i, 28); ctx.stroke();
        }
      }
      ctx.fillStyle = o.opened ? "#7cffcf" : "#e9e6f5";
      ctx.beginPath(); ctx.arc(0, -6, 9, 0, 7); ctx.fill();
      ctx.fillStyle = "#123b34";
      ctx.font = uiFont(13, true);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(o.opened ? "✓" : "?", 0, -6);
      ctx.fillStyle = hexA(o.opened ? "#7cffcf" : "#e9e6f5", .8);
      ctx.font = uiFont(10, true);
      ctx.fillText(o.opened ? "НАЁМНИК В КОМАНДЕ" : (isTouch ? "⊕ · ОСВОБОДИТЬ" : "E · ОСВОБОДИТЬ"), 0, 44);
      ctx.restore();
    } else if (o.kind === "pillar") {
      const theme = roomTheme(currentRoom());
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.beginPath(); ctx.ellipse(0, 25, 29, 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = theme.wall;
      roundRect(-25, -27, 50, 54, 7); ctx.fill();
      ctx.fillStyle = hexA(theme.accent, .35);
      roundRect(-25, -27, 50, 8, 3); ctx.fill();
      roundRect(-25, 18, 50, 8, 3); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-11, -19); ctx.lineTo(-11, 17); ctx.moveTo(11, -19); ctx.lineTo(11, 17); ctx.stroke();
      ctx.restore();
    } else if (o.kind === "chest") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(0, 14, 22, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = o.opened ? "#5c4a35" : "#8a6a3d";
      roundRect(-20, -12, 40, 27, 5); ctx.fill();
      ctx.fillStyle = o.opened ? "#7a6346" : "#b58a4c";
      roundRect(-20, -18, 40, 15, 5); ctx.fill();
      ctx.fillStyle = "#ffd76b";
      ctx.fillRect(-4, -6, 8, 12);
      if (!o.opened) {
        ctx.fillStyle = "rgba(255,215,107,.16)";
        ctx.beginPath(); ctx.arc(0, 0, 32 + Math.sin(game.time * 4) * 3, 0, 7); ctx.fill();
      }
      ctx.restore();
    } else if (o.kind === "crack") {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.strokeStyle = o.used ? "rgba(255,255,255,.12)" : "#ff9de2";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-4, -18); ctx.lineTo(6, -8); ctx.lineTo(-2, 0);
      ctx.lineTo(8, 9); ctx.lineTo(-3, 19);
      ctx.stroke();
      if (!o.used) {
        ctx.fillStyle = "rgba(255,157,226,.12)";
        ctx.beginPath(); ctx.arc(0, 0, 26 + Math.sin(game.time * 4) * 3, 0, 7); ctx.fill();
        ctx.fillStyle = "#ff9de2";
        ctx.font = uiFont(10, true);
        ctx.textAlign = "center";
        ctx.fillText(isTouch ? "E" : "E · СЕКРЕТ", 0, -30);
      }
      ctx.restore();
    } else if (o.kind === "fire") {
      const fa = clamp(o.life / 2.6, 0, 1);
      ctx.save();
      ctx.globalAlpha = .22 + .3 * fa;
      ctx.fillStyle = "#ff9d4d";
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
      ctx.globalAlpha = .35 + .4 * fa;
      ctx.fillStyle = "#ffe27a";
      for (let i = 0; i < 4; i++) {
        const fx = o.x + Math.sin(game.time * 7 + i * 2) * o.r * .5;
        const fy = o.y + Math.cos(game.time * 6 + i * 1.7) * o.r * .35;
        ctx.beginPath(); ctx.arc(fx, fy, 6 + Math.sin(game.time * 9 + i) * 3, 0, 7); ctx.fill();
      }
      ctx.restore();
    } else if (o.kind === "portal") {
      const theme = roomTheme(currentRoom());
      const t = game.time * 2.6 + (o.phase || 0);
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = hexA(theme.accent, .12 + Math.sin(t) * .04);
      ctx.beginPath(); ctx.arc(0, 0, 48 + Math.sin(t) * 5, 0, 7); ctx.fill();
      ctx.strokeStyle = hexA(theme.accent, .75);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(0, 0, 26 + Math.sin(t) * 2, 36, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.7)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 17, 26, Math.sin(t) * .4, 0, 7); ctx.stroke();
      ctx.fillStyle = hexA("#ffffff", .18 + Math.sin(t * 1.4) * .08);
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 22, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff0c4";
      ctx.font = uiFont(11, true);
      ctx.textAlign = "center";
      ctx.fillText(isTouch ? "E" : "E · ПОРТАЛ " + stageLabel(game.floor, game.stage + 1), 0, -52);
      ctx.restore();
    } else if (o.kind === "stairs") {
      const theme = roomTheme(currentRoom());
      const pulse = .5 + Math.sin(game.time * 5) * .2;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = hexA(theme.accent, .18 * pulse);
      ctx.beginPath(); ctx.arc(0, 0, 42 + Math.sin(game.time * 4) * 4, 0, 7); ctx.fill();
      ctx.fillStyle = theme.wall;
      roundRect(-24, 18, 48, 8, 3); ctx.fill();
      ctx.fillStyle = theme.accent;
      ctx.globalAlpha = .55;
      for (let i = 0; i < 4; i++) {
        roundRect(-20 + i * 2, -18 + i * 10, 40 - i * 4, 8, 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff0c4";
      ctx.font = uiFont(11, true);
      ctx.textAlign = "center";
      ctx.fillText(isTouch ? "E" : "E · ВНИЗ", 0, -34);
      ctx.restore();
    }
  }
}

function drawPickups() {
  for (const it of currentRoom().pickups) {
    const yy = it.y + Math.sin(it.bob) * 4;
    ctx.save();
    ctx.translate(it.x, yy);
    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.beginPath(); ctx.ellipse(0, 12, 12, 5, 0, 0, 7); ctx.fill();
    if (it.kind === "heart") {
      ctx.fillStyle = "#ff5d7d";
      heartPath(0, -2, 11); ctx.fill();
      ctx.fillStyle = "#ffc2d1";
      heartPath(-3, -6, 4); ctx.fill();
    } else if (it.kind === "coin") {
      ctx.fillStyle = "#ffd76b";
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 11, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "#b98a2e"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#b98a2e"; ctx.font = uiFont(11, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("¢", 0, 1);
    } else if (it.kind === "ammo") {
      ctx.fillStyle = "#8ee6ff";
      roundRect(-10, -8, 20, 16, 3); ctx.fill();
      ctx.fillStyle = "#24586b";
      ctx.fillRect(-6, -4, 4, 8); ctx.fillRect(0, -4, 4, 8); ctx.fillRect(6, -4, 2, 8);
    } else if (it.kind === "energy") {
      ctx.fillStyle = "#8ee6ff";
      roundRect(-9, -11, 18, 22, 4); ctx.fill();
      ctx.fillStyle = "#e9fbff";
      ctx.fillRect(-2, -8, 4, 16);
      ctx.fillStyle = "#24586b";
      ctx.fillRect(-6, -14, 12, 3);
    } else if (it.kind === "weapon") {
      ctx.fillStyle = "#ff9de2";
      roundRect(-14, -6, 28, 12, 4); ctx.fill();
      ctx.fillStyle = "#6b3b66";
      ctx.fillRect(-10, -2, 16, 4);
      ctx.fillStyle = "rgba(255,157,226,.2)";
      ctx.beginPath(); ctx.arc(0, 0, 22 + Math.sin(game.time * 5) * 3, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of game.bullets) {
    ctx.save();
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawEnemies() {
  const enemies = currentRoom().props.filter(o => o.type);
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(0, e.r * .75, e.r * .9, e.r * .35, 0, 0, 7); ctx.fill();

    if (e.elite || e.mini) {
      const aura = e.mini ? "#ffd76b" : "#ffe27a";
      ctx.strokeStyle = hexA(aura, e.mini ? .7 : .5);
      ctx.lineWidth = e.mini ? 3 : 2;
      ctx.beginPath();
      ctx.arc(0, 0, e.r + (e.mini ? 15 : 8) + Math.sin(game.time * 5) * 2, 0, 7);
      ctx.stroke();
    }
    if (e.slowT > 0) {
      ctx.fillStyle = "rgba(142,230,255,.18)";
      ctx.beginPath(); ctx.arc(0, 0, e.r + 4, 0, 7); ctx.fill();
    }

    if (e.type === "charger" && e.state === "windup") {
      ctx.strokeStyle = "rgba(255,120,90,.7)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 10 + Math.sin(game.time * 25) * 2, 0, 7); ctx.stroke();
    }

    if (e.telegraph > 0 && (e.type === "shooter" || e.type === "sniper" || e.type === "laser")) {
      ctx.save();
      ctx.rotate(e.aimAngle);
      const t = 1 - clamp(e.telegraph / (e.telegraphMax || 1), 0, 1);
      ctx.strokeStyle = e.type === "laser" ? `rgba(255,107,129,${.2 + t * .65})` : `rgba(255,110,180,${.22 + t * .55})`;
      ctx.lineWidth = e.type === "sniper" ? 2 : e.type === "laser" ? 3 : 4;
      ctx.setLineDash(e.type === "sniper" ? [16, 10] : e.type === "laser" ? [] : [10, 8]);
      ctx.beginPath();
      ctx.moveTo(e.r + 6, 0);
      ctx.lineTo(e.type === "sniper" || e.type === "laser" ? 900 : 520, 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    if (e.beam > 0) {
      ctx.save();
      ctx.rotate(e.aimAngle);
      const a = clamp(e.beam / .6, 0, 1);
      ctx.strokeStyle = hexA("#ff6b81", .25 * a);
      ctx.lineWidth = 22;
      ctx.beginPath(); ctx.moveTo(e.r, 0); ctx.lineTo(900, 0); ctx.stroke();
      ctx.strokeStyle = hexA("#ffd8de", .9 * a);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(e.r, 0); ctx.lineTo(900, 0); ctx.stroke();
      ctx.restore();
    }

    if ((e.type === "boss" || e.type === "twin") && e.telegraph > 0) {
      const t = 1 - clamp(e.telegraph / (e.telegraphMax || 1), 0, 1);
      ctx.strokeStyle = `rgba(255,90,120,${.3 + t * .6})`;
      ctx.lineWidth = 3 + t * 3;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 18 + t * 26, 0, 7); ctx.stroke();
    }

    if (e.type === "bomber" && e.timer < .3 && !e.dead) {
      ctx.fillStyle = `rgba(255,90,90,${.35 + Math.sin(game.time * 30) * .25})`;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 12, 0, 7); ctx.fill();
    }

    if (e.type === "boss" || e.type === "twin") {
      const dark = e.bossType === "frost" ? "#1b4a63" : e.bossType === "magma" ? "#6b2d18"
                 : e.bossType === "swamp" ? "#25402a" : e.bossType === "void" ? "#2e1b47" : "#7c2440";
      ctx.fillStyle = dark;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + Math.PI / 8;
        const rr = e.r + (i % 2 ? 5 : -2);
        i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      if (e.bossType === "frost") {
        ctx.strokeStyle = hexA("#b8f0ff", .75);
        ctx.lineWidth = 3;
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (e.r - 2), Math.sin(a) * (e.r - 2));
          ctx.lineTo(Math.cos(a) * (e.r + 12), Math.sin(a) * (e.r + 12));
          ctx.stroke();
        }
      } else if (e.bossType === "magma") {
        ctx.strokeStyle = "#ffd76b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-20, 8); ctx.lineTo(-7, 0); ctx.lineTo(-12, -12);
        ctx.moveTo(20, 6); ctx.lineTo(8, -2); ctx.lineTo(14, -14);
        ctx.stroke();
      }
      ctx.fillStyle = e.flash > 0 ? "#ffffff" : e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r - 4, 0, 7); ctx.fill();
      if (e.bossType === "warden") {
        ctx.fillStyle = "#ffd76b";
        ctx.beginPath();
        ctx.moveTo(-18, -22); ctx.lineTo(-9, -40); ctx.lineTo(0, -25); ctx.lineTo(9, -40); ctx.lineTo(18, -22);
        ctx.closePath(); ctx.fill();
      } else if (e.bossType === "frost") {
        ctx.fillStyle = "#d8f7ff";
        ctx.beginPath();
        ctx.moveTo(-16, -20); ctx.lineTo(-8, -42); ctx.lineTo(0, -24); ctx.lineTo(8, -42); ctx.lineTo(16, -20);
        ctx.closePath(); ctx.fill();
      } else if (e.bossType === "swamp") {
        ctx.fillStyle = "#b6ffc4";
        ctx.beginPath(); ctx.ellipse(0, -26, 25, 12, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = "#2c5a32";
        ctx.beginPath(); ctx.arc(-9, -30, 4, 0, 7); ctx.arc(8, -33, 3, 0, 7); ctx.fill();
      } else if (e.bossType === "void") {
        ctx.strokeStyle = "#c08cff";
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(0, -26 - i * 7, 9 + i * 7, Math.PI * 1.05, Math.PI * 1.95);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#4a1e10";
        ctx.beginPath();
        ctx.moveTo(-19, -18); ctx.lineTo(-24, -40); ctx.lineTo(-8, -25);
        ctx.moveTo(19, -18); ctx.lineTo(24, -40); ctx.lineTo(8, -25);
        ctx.fill();
      }
      ctx.fillStyle = e.bossType === "frost" ? "#123b52"
                    : e.bossType === "swamp" ? "#1c3b22"
                    : e.bossType === "void" ? "#180f28" : "#3a1020";
      ctx.fillRect(-13, -5, 8, 6); ctx.fillRect(5, -5, 8, 6);
      ctx.fillStyle = e.bossType === "frost" ? "#e6fbff"
                    : e.bossType === "swamp" ? "#d9ffb0"
                    : e.bossType === "void" ? "#e0b6ff" : "#ffd76b";
      ctx.fillRect(-11, -3, 4, 3); ctx.fillRect(7, -3, 4, 3);
    } else {
      ctx.fillStyle = e.flash > 0 ? "#ffffff" : e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.arc(0, e.r * .25, e.r * .75, 0, Math.PI); ctx.fill();
      ctx.fillStyle = e.type === "shooter" ? "#c8ffef" : e.type === "sniper" ? "#ff9de2" : "#fff3c4";
      ctx.fillRect(-8, -5, 5, 5); ctx.fillRect(3, -5, 5, 5);
      if (e.type === "sniper") {
        ctx.strokeStyle = "#ff7ce5";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, e.r + 5, 0, 7); ctx.stroke();
      }
      if (e.type === "bomber") {
        ctx.fillStyle = "#5c3218";
        ctx.beginPath(); ctx.arc(0, 2, 6, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff3c4";
        ctx.fillRect(-2, -e.r - 6, 4, 7);
      }
      if (e.type === "charger") {
        ctx.fillStyle = "#7a4320";
        ctx.beginPath();
        ctx.moveTo(-e.r, -e.r + 2); ctx.lineTo(-e.r - 8, -e.r - 8); ctx.lineTo(-3, -e.r + 4);
        ctx.moveTo(e.r, -e.r + 2); ctx.lineTo(e.r + 8, -e.r - 8); ctx.lineTo(3, -e.r + 4);
        ctx.fill();
      }
      if (e.type === "shielder") {
        if ((e.shieldHp || 0) > 0) {
          ctx.save();
          ctx.rotate(e.facing || 0);
          const sp = clamp(e.shieldHp / (e.maxShieldHp || 1), 0, 1);
          ctx.fillStyle = hexA("#8ee6ff", .12 + sp * .16);
          ctx.beginPath(); ctx.arc(0, 0, e.r + 9, -1.25, 1.25); ctx.lineTo(0, 0); ctx.fill();
          ctx.strokeStyle = e.state === "bash" ? "#ffe27a" : sp < .35 ? "#ff9de2" : "#8ee6ff";
          ctx.lineWidth = 2 + sp * 3;
          ctx.beginPath(); ctx.arc(0, 0, e.r + 9, -1.25, 1.25); ctx.stroke();
          ctx.restore();
        } else {
          ctx.strokeStyle = "rgba(255,107,129,.6)";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, e.r + 2, .5, 2.6); ctx.stroke();
        }
      }
      if (e.type === "reflector") {
        ctx.save();
        ctx.rotate(e.aimAngle || 0);
        const active = (e.reflectCharges || 0) > 0;
        ctx.fillStyle = active ? hexA("#6bd9ff", .25 + Math.sin(game.time * 8) * .08) : "rgba(120,130,150,.2)";
        ctx.beginPath();
        ctx.moveTo(e.r - 2, -e.r - 4); ctx.lineTo(e.r + 14, 0); ctx.lineTo(e.r - 2, e.r + 4);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = active ? "#6bd9ff" : "rgba(255,255,255,.3)";
        ctx.lineWidth = 2.5; ctx.stroke();
        ctx.restore();
        ctx.fillStyle = active ? "#e6fbff" : "#5a6b7a";
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
      }
      if (e.type === "splitter" || e.type === "spawnling") {
        ctx.fillStyle = "#2f8f55";
        ctx.beginPath(); ctx.arc(-e.r * .35, -e.r * .25, e.r * .24, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(e.r * .35, e.r * .1, e.r * .18, 0, 7); ctx.fill();
      }
      if (e.type === "turret") {
        ctx.fillStyle = "#6b5324";
        roundRect(-e.r - 2, -e.r - 2, (e.r + 2) * 2, (e.r + 2) * 2, 5); ctx.fill();
        ctx.strokeStyle = e.telegraph > 0 ? "#ffffff" : "#ffd76b";
        ctx.lineWidth = 2; ctx.stroke();
        ctx.save(); ctx.rotate(e.facing || 0);
        ctx.fillStyle = e.telegraph > 0 ? "#ffffff" : "#ffd76b";
        roundRect(0, -5, e.r + 14, 10, 3); ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#3a2a12";
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
      }
      if (e.type === "laser") {
        ctx.fillStyle = "#7a2338";
        ctx.beginPath();
        ctx.moveTo(0, -e.r - 8); ctx.lineTo(e.r + 4, e.r); ctx.lineTo(-e.r - 4, e.r);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = e.beam > 0 || e.telegraph > 0 ? "#ffffff" : "#ffb3bd";
        ctx.beginPath(); ctx.arc(0, -2, 5 + Math.sin(game.time * 8) * 1.2, 0, 7); ctx.fill();
      }
      if (e.type === "miner") {
        ctx.fillStyle = "#5c4028";
        roundRect(-e.r - 6, -8, 12, 16, 3); ctx.fill();
        ctx.fillStyle = "#e9c37a";
        ctx.fillRect(-e.r - 4, -4, 4, 8);
        ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, e.r + 4, 0, Math.PI * 2 * clamp(e.timer / 3, 0, 1)); ctx.stroke();
      }
      if (e.type === "phantom") {
        ctx.globalAlpha = .62;
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(0, Math.sin(e.phase) * 3, e.r + 4, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#e0d4ff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, e.r + 8, 0, 7); ctx.stroke();
      }
    }

    ctx.restore();

    if (e.hp < e.maxHp || e.type === "boss") {
      const w = e.type === "boss" ? 74 : 34;
      const x = e.x - w / 2, y = e.y - e.r - (e.type === "boss" ? 52 : 14);
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.fillRect(x, y, w, 5);
      ctx.fillStyle = e.type === "boss" ? e.color : "#7cff9b";
      ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 5);
    }
  }
}

function drawPlayer() {
  const p = game.player;
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.invuln > 0 && Math.floor(game.time * 20) % 2 === 0) ctx.globalAlpha = .55;

  ctx.fillStyle = "rgba(0,0,0,.4)";
  ctx.beginPath(); ctx.ellipse(0, 12, 15, 6, 0, 0, 7); ctx.fill();

  ctx.save();
  ctx.rotate(p.aim);
  ctx.fillStyle = p.hitFlash > 0 ? "#ffffff" : "#4d6fa8";
  roundRect(4, -5, 24, 10, 3); ctx.fill();
  ctx.fillStyle = "#2c3f63";
  ctx.fillRect(18, -3, 12, 6);
  ctx.restore();

  ctx.fillStyle = p.hitFlash > 0 ? "#ffffff" : p.color;
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#bcd7ff"; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = "#e8c9a0";
  ctx.beginPath(); ctx.arc(0, -2, 9, 0, 7); ctx.fill();
  ctx.fillStyle = "#3c2e2a";
  ctx.fillRect(-6, -5, 4, 3); ctx.fillRect(2, -5, 4, 3);

  ctx.fillStyle = "#9db8e8";
  ctx.beginPath();
  ctx.moveTo(-11, -8); ctx.lineTo(0, -20); ctx.lineTo(11, -8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffd76b";
  ctx.fillRect(-2, -15, 4, 5);

  if (p.dashCd <= 0) {
    ctx.strokeStyle = "rgba(154,216,255,.5)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 6 + Math.sin(game.time * 6) * 2, 0, 7); ctx.stroke();
  }
  ctx.restore();

  const w = currentWeapon();
  if (w && w.reloadT > 0) {
    const pct = 1 - w.reloadT / w.reload;
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(p.x - 22, p.y - 34, 44, 6);
    ctx.fillStyle = "#8ee6ff";
    ctx.fillRect(p.x - 22, p.y - 34, 44 * pct, 6);
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawEffects() {
  for (const f of game.effects) {
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    if (f.kind === "line") {
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 2 + a * 5;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.8)";
      ctx.lineWidth = 1 + a * 2;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.restore();
      continue;
    }
    if (f.kind === "slash") {
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 4 + a * 8;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (.55 + a * .45), f.angle - .9, f.angle + .9);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (.48 + a * .38), f.angle - .75, f.angle + .75);
      ctx.stroke();
      ctx.restore();
      continue;
    }
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 3 + a * 6;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.stroke();
    ctx.fillStyle = hexA(f.color, .2 * a);
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * .72, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawFloaters() {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = uiFont(15, true);
  for (const f of game.floaters) {
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const p = game.player;
  const compact = settings.compactHud === true;
  if (settings.fps) {
    ctx.font = uiFont(11, true);
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillStyle = fpsSmooth >= 50 ? "#7cff9b" : fpsSmooth >= 30 ? "#ffd76b" : "#ff6b81";
    ctx.fillText(Math.round(fpsSmooth) + " FPS", W - 18, 18);
  }
  ctx.fillStyle = "rgba(8,8,16,.82)";
  roundRect(18, 14, 320, 58, 10); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.stroke();

  ctx.fillStyle = "rgba(0,0,0,.6)";
  roundRect(32, 25, 190, 14, 7); ctx.fill();
  ctx.fillStyle = p.hp / p.maxHp > .3 ? "#7cff9b" : "#ff6b81";
  roundRect(32, 25, 190 * clamp(p.hp / p.maxHp, 0, 1), 14, 7); ctx.fill();
  ctx.fillStyle = "#e9e6f5";
  ctx.font = uiFont(12, true);
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(Math.ceil(p.hp) + " / " + p.maxHp, 40, 32);

  ctx.fillStyle = "#ffd76b";
  ctx.beginPath(); ctx.arc(248, 32, 9, 0, 7); ctx.fill();
  ctx.fillStyle = "#2b2110"; ctx.font = uiFont(12, true); ctx.textAlign = "center";
  ctx.fillText("¢", 248, 33);
  ctx.fillStyle = "#fff0b8"; ctx.textAlign = "left"; ctx.font = uiFont(16, true);
  ctx.fillText(String(game.coins), 264, 32);
