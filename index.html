/* ---------- primitive shapes ---------- */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .75);
  ctx.bezierCurveTo(x - s * 1.5, y - s * .2, x - s * .5, y - s * 1.3, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .5, y - s * 1.3, x + s * 1.5, y - s * .2, x, y + s * .75);
  ctx.closePath();
}

/* ---------- input ---------- */
function updateMouse(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (W / rect.width);
  mouse.y = (e.clientY - rect.top) * (H / rect.height);
}

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  ensureAudio();

  if (state === "menu") {
    if (e.code === "ArrowLeft" || e.code === "KeyA" || e.code === "ArrowRight" || e.code === "KeyD") {
      const i = CHARACTERS.findIndex(c => c.id === selectedChar);
      const dir = (e.code === "ArrowLeft" || e.code === "KeyA") ? -1 : 1;
      selectedChar = CHARACTERS[(i + dir + CHARACTERS.length) % CHARACTERS.length].id;
      saveData.char = selectedChar;
      writeSave(saveData);
      sfx("buy");
      buzz(15);
    } else if (e.code === "Enter" || e.code === "Space") {
      startGame();
    }
    return;
  }
  if (state === "achievements") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "Enter") state = "menu";
    return;
  }
  if (state === "gameover" || state === "victory") {
    if (e.code === "KeyR" || e.code === "Enter") startGame();
    return;
  }
  if (state === "reward") {
    if (e.code === "Digit1") chooseRelic(0);
    else if (e.code === "Digit2") chooseRelic(1);
    else if (e.code === "Digit3") chooseRelic(2);
    return;
  }
  if (state === "settings") {
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "Enter") state = "paused";
    else if (e.code === "ArrowLeft") { settings.volume = clamp(settings.volume - .1, 0, 1); applyVolume(); }
    else if (e.code === "ArrowRight") { settings.volume = clamp(settings.volume + .1, 0, 1); applyVolume(); }
    return;
  }
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); return; }
  if (state === "shop") {
    if (e.code === "KeyE" || e.code === "Enter") closeShop();
    return;
  }
  if (state !== "playing") return;

  if (e.code === "Space") tryDash();
  else if (e.code === "KeyR") startReload();
  else if (e.code === "KeyE") interact();
  else if (e.code === "Digit1") selectWeapon(0);
  else if (e.code === "Digit2") selectWeapon(1);
  else if (e.code === "Digit3") selectWeapon(2);
  else if (e.code === "Digit4") selectWeapon(3);
});

window.addEventListener("keyup", e => { keys[e.code] = false; });

function clearInput() {
  mouse.down = false;
  touch.moveId = null;
  touch.aimId = null;
  touch.moveVec.x = touch.moveVec.y = 0;
  for (const k in keys) keys[k] = false;
}
window.addEventListener("blur", clearInput);
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing") state = "paused";
  if (document.hidden) clearInput();
});

function handleUiClick() {
  if (state === "menu") { handleMenuClick(); return true; }
  if (state === "achievements") { state = "menu"; sfx("buy"); return true; }
  if (state === "gameover" || state === "victory") { startGame(); return true; }
  if (state === "shop") { handleShopClick(); return true; }
  if (state === "reward") { handleRewardClick(); return true; }
  if (state === "settings") { handleSettingsClick(); return true; }
  if (state === "paused") { if (!handlePauseClick()) togglePause(); return true; }
  return false;
}

canvas.addEventListener("mousemove", updateMouse);
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("mousedown", e => {
  updateMouse(e);
  ensureAudio();
  if (e.button !== 0) return;
  if (handleUiClick()) return;
  if (state === "playing") mouse.down = true;
});
window.addEventListener("mouseup", e => { if (e.button === 0) mouse.down = false; });

/* ---------- touch input ---------- */
function touchButtonAt(x, y) {
  return TOUCH_BTNS.find(b => dist(x, y, b.x, b.y) <= b.r + 10);
}

function fireTouchButton(b) {
  if (!game) return;
  if (b.id === "dash") tryDash();
  else if (b.id === "reload") startReload();
  else if (b.id === "weapon") selectWeapon((game.player.wIndex + 1) % game.player.weapons.length);
  else if (b.id === "interact") interact();
  else if (b.id === "pause") togglePause();
}

canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  e.preventDefault();
  ensureAudio();
  updateMouse(e);
  const x = mouse.x, y = mouse.y;

  if (handleUiClick()) return;
  if (state !== "playing") return;

  const btn = touchButtonAt(x, y);
  if (btn) { fireTouchButton(btn); return; }

  if (x < W * .45) {
    touch.moveId = e.pointerId;
    touch.moveOrigin.x = x;
    touch.moveOrigin.y = y;
    touch.moveVec.x = touch.moveVec.y = 0;
  } else {
    touch.aimId = e.pointerId;
    touch.aimPoint.x = x;
    touch.aimPoint.y = y;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});

canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse") return;
  updateMouse(e);
  const x = mouse.x, y = mouse.y;

  if (e.pointerId === touch.moveId) {
    const dx = x - touch.moveOrigin.x;
    const dy = y - touch.moveOrigin.y;
    const d = Math.hypot(dx, dy);
    const max = 54;
    if (d > max) {
      touch.moveVec.x = dx / d;
      touch.moveVec.y = dy / d;
      touch.moveOrigin.x = x - touch.moveVec.x * max;
      touch.moveOrigin.y = y - touch.moveVec.y * max;
    } else {
      touch.moveVec.x = dx / max;
      touch.moveVec.y = dy / max;
    }
  }
  if (e.pointerId === touch.aimId) {
    touch.aimPoint.x = x;
    touch.aimPoint.y = y;
  }
});

function endTouchPointer(e) {
  if (e.pointerType === "mouse") return;
  if (e.pointerId === touch.moveId) {
    touch.moveId = null;
    touch.moveVec.x = touch.moveVec.y = 0;
  }
  if (e.pointerId === touch.aimId) touch.aimId = null;
}
canvas.addEventListener("pointerup", endTouchPointer);
canvas.addEventListener("pointercancel", endTouchPointer);

/* ---------- loop ---------- */
function loop(now) {
  const dt = Math.min(.033, (now - lastTime) / 1000 || 0);
  lastTime = now;
  update(dt);
  updateMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

})();
</script>
</body>
