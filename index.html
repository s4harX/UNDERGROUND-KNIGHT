    margin: 0;

    color: #e9e6f5;

    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #wrap { width: min(1600px, 100%); }
  canvas {
    display: block;
    width: 100%;
    max-width: calc((100vh - 64px) * 1.6);
    max-width: calc((100dvh - 64px) * 1.6);
    height: auto;
    border-radius: 14px;
    background: #0d0d16;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
    cursor: crosshair;
    touch-action: none;
  }
  #hint {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    opacity: .55;
    letter-spacing: .02em;
  }
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    background: rgba(9,9,16,.94);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
  }
  @media (pointer: coarse) {
    html, body { padding: 0; overflow: hidden; background: #090910; width: 100%; height: 100%; }
    #wrap {
      position: fixed;
      left: 0; top: 0;
      width: var(--app-w, 100vw);
      height: var(--app-h, 100dvh);
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      width: min(var(--app-w, 100vw), calc(var(--app-h, 100dvh) * 1.6));
      height: auto;
      max-width: none;
      max-height: var(--app-h, 100dvh);
      border-radius: 0;
      box-shadow: none;
    }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate { display: flex; }
  }

function hasStatue(id) {
  return !!(game && game.statues && game.statues.indexOf(id) >= 0);
}
function weaponName(w) {
  return w && w.name ? w.name : (w && WEAPONS[w.id] ? WEAPONS[w.id].name : "");
}
function statueDamageMul() {
  let m = 1;
  if (hasStatue("warrior")) m *= 1.25;
  if (hasStatue("berserk") && game.player.hp < game.player.maxHp * .5) m *= 1.35;
  return m;
}

  let m = 1;
  if (hasStatue("swift")) m *= 1.18;
  if (hasStatue("berserk") && game.player.hp < game.player.maxHp * .5) m *= 1.15;
  return m;
}

}

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function dailyKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dailyQuests() {
  const r = mulberry32(hashString("quests-" + dailyKey()));
  const pool = QUEST_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 3);
}

function ensureDaily() {
  const key = dailyKey();
  const raw = saveData.daily;
  if (!raw || raw.key !== key || !raw.progress || typeof raw.progress !== "object" ||
      Array.isArray(raw.progress) || !Array.isArray(raw.claimed)) {
    saveData.daily = {
      key,
      progress: raw && raw.progress && typeof raw.progress === "object" && !Array.isArray(raw.progress) ? raw.progress : {},
      claimed: Array.isArray(raw && raw.claimed) ? raw.claimed.filter(id => typeof id === "string") : []
    };
    writeSave(saveData);
  }
  const daily = saveData.daily;
  for (const k of Object.keys(daily.progress)) {
    if (!Number.isFinite(daily.progress[k])) delete daily.progress[k];
    else daily.progress[k] = Math.max(0, Math.round(daily.progress[k]));
  }
  return daily;
}

function trackQuest(metric, amount) {
  if (!game) return;
  const daily = ensureDaily();
  const quest = dailyQuests().find(q => q.metric === metric && daily.claimed.indexOf(q.id) < 0);
  if (!quest) return;
  daily.progress[metric] = Math.min(quest.target, (daily.progress[metric] || 0) + amount);
  if (daily.progress[metric] >= quest.target) {
    daily.claimed.push(quest.id);
    const bonus = 75;
    game.coins += bonus;
    game.stats.coinsEarned += bonus;
    saveData.stats.coinsEarned += bonus;
    if (saveData.stats.coinsEarned >= 500) unlockAchievement("rich");
    floater("ЗАДАНИЕ ВЫПОЛНЕНО! +" + bonus, W / 2, R.y + 140, "#ffe27a");
    sfx("buy");
    buzz(40);
  }
  writeSave(saveData);
}

function getMoveVector() {

function angleDelta(a, b) {

function aimThreat(e) {
  if (e.type === "boss" || e.mini) return .1;
  if (e.elite || e.type === "reflector" || e.type === "laser") return .3;
  if (["shooter", "sniper", "turret", "bomber", "shielder", "reflector"].indexOf(e.type) >= 0) return .5;

function autoAimPoint(rawX, rawY) {
  const manual = touchMode();
  if (!game || (settings.autoAim === false && !manual) || state !== "playing") return { x: rawX, y: rawY, target: null };
  const p = game.player;
  const rawDist = Math.hypot(rawX - p.x, rawY - p.y);
  const rawAngle = Math.atan2(rawY - p.y, rawX - p.x);
  const maxCone = manual ? .8 : .38;
  const priority = settings.aimPriority;
  let best = null, bestScore = Infinity;
  for (const e of currentRoom().props) {
    if (!e.type || e.dead) continue;
    const d = dist(p.x, p.y, e.x, e.y);
    if (d > 620) continue;
    let diff = rawDist < 50 ? 0 : angleDelta(Math.atan2(e.y - p.y, e.x - p.x), rawAngle);
    if (diff > maxCone) continue;
    let score = d + diff * 260;
    if (priority === "danger") score = d * aimThreat(e) + diff * 200;
    else if (priority === "weak") score = d * .35 + (e.hp / (e.maxHp || 1)) * 420 + diff * 160;
    if (e === game.aimTarget) score *= .75;
    if (score < bestScore) { bestScore = score; best = e; }
  }
  game.aimTarget = best;
  return best ? { x: best.x, y: best.y, target: best } : { x: rawX, y: rawY, target: null };
}

function ensureAudio() {

function tone(freq, dur, type = "square", vol = .035, endFreq = 0) {
  if (!audioCtx || !sfxGain) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t + dur);
  } catch (_) {}
}

function musicNote(freq, when, dur, vol, type = "triangle") {
  if (!audioCtx || !musicGain) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + .02);
    g.gain.exponentialRampToValueAtTime(.0001, when + dur);
    o.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when + dur + .02);
  } catch (_) {}
}

function updateMusic() {
  if (state !== "playing") {
    if (audioCtx) musicNextTime = audioCtx.currentTime + .05;
    return;
  }
  if (!audioCtx || audioCtx.state !== "running" || settings.volume <= 0 || settings.musicVolume <= 0) return;
  const boss = !!(game && state === "playing" && currentRoom().type === "boss");
  const beat = boss ? .145 : .225;
  const now = audioCtx.currentTime;
  if (musicNextTime < now) musicNextTime = now + .05;
  let guard = 0;
  while (musicNextTime < now + .25 && guard++ < 8) {
    const s = musicStep % 16;
    const scale = [0, 3, 5, 7, 10, 12, 10, 7, 5, 3, 0, 3, 5, 7, 10, 12];
    const root = floorData(game ? game.floor : 1).musicRoot * (boss ? .75 : 1);
    const f = root * Math.pow(2, scale[s] / 12);
    musicNote(f, musicNextTime, beat * .72, boss ? .026 : .017, boss ? "sawtooth" : "triangle");
    if (s % 4 === 0) musicNote(root / 2, musicNextTime, beat * 1.8, .03, "sine");
    if (boss && s % 2 === 1) musicNote(f * 2, musicNextTime, beat * .35, .011, "square");
    musicNextTime += beat;
    musicStep++;
  }
}

    case "boss":    tone(110, .5, "sawtooth", .05, 70); break;
    case "relic":   tone(520, .22, "sine", .04, 1040); break;
    case "trap":    tone(140, .12, "sawtooth", .03, 80); break;
    case "block":   tone(240, .09, "square", .03, 420); break;
    case "shatter": tone(1200, .14, "square", .028, 320); tone(1800, .08, "triangle", .016, 640); break;
  }
}

/* ---------- world ---------- */
const SIZE = 5;
const STAGES_PER_FLOOR = 10;
/* A buff is offered after every third stage: 3 per chapter, 15 per run. */
const BUFF_EVERY = 3;

/* Ten rooms do not fit in one row of the 5x5 minimap grid — snake through two. */
function buildStagePath(stages, horizontal) {
  const path = [];
  const half = Math.ceil(stages / 2);
  for (let i = 0; i < stages; i++) {
    const first = i < half;
    const idx = first ? i : stages - 1 - i;
    if (horizontal) path.push({ x: idx % SIZE, y: first ? 2 : 3 });
    else path.push({ x: first ? 2 : 3, y: idx % SIZE });
  }
  return path;
}

/* Rising danger: more HP, damage and elites on deeper stages. */
function threatLevel() {
  if (!game) return 1;
  return 1 + (game.floor - 1) * 2 + Math.floor((game.stage - 1) / 2);
}
function threatLevelMax() {
  return 1 + (FLOORS.length - 1) * 2 + Math.floor((STAGES_PER_FLOOR - 1) / 2);
}

function makeRoom(x, y, type, floor = 1, stage = 1) {
  return {
    x, y, type, stage,
    theme: floorData(floor).id,
    seed: randi(1, 999999),
    visited: false,
    spawned: false,
    cleared: type !== "combat" && type !== "boss" && type !== "arena" &&
             type !== "mini" && type !== "secret" && type !== "ambush",
    wave: 0,
    maxWaves: 3,
    doors: {},
    pickups: [],
    props: [],
    shopItems: []
  };
}

/* A chapter is a snaking chain of ten rooms. The last one is always the boss.
   Portals replace the old 5x5 door maze; the grid is kept for the minimap. */
function generateWorld(floor = 1, mode = "normal") {
  const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  const stages = mode === "bossRush" ? 1 : STAGES_PER_FLOOR;
  const path = buildStagePath(stages, floor % 2 === 1);
  const types = stages === 1 ? ["boss"] : (() => {
    const t = [];
    for (let i = 0; i < stages - 1; i++) {
      if (i === 0) t.push("combat");
      else if (i === 3) t.push("shop");
      else if (i === 6) t.push("treasure");
      else t.push(pick(["combat", "combat", "arena", "mini", "ambush"]));
    }
    t.push("boss");
    return t;
  })();
  path.forEach((c, i) => {
    const room = makeRoom(c.x, c.y, types[i], floor, i + 1);
    grid[c.y][c.x] = room;
  });
  // A hidden biome can replace one of the middle combat rooms.
  const biomeStage = stages > 6 && chance(.3)
    ? types.findIndex((t, i) => i > 2 && i < stages - 3 && t === "combat") : -1;
  if (biomeStage >= 0) {
    const c = path[biomeStage];
    const room = grid[c.y][c.x];
    room.secretBiome = true;
    room.type = "secret";
    room.secret = true;
    room.name = "ПОЛОЕ ДНО";
  }
  return {
    grid, path, stages,
    start: { x: path[0].x, y: path[0].y },
    boss: { x: path[path.length - 1].x, y: path[path.length - 1].y }
  };
}

function currentRoom() {
  return game.grid[game.cy][game.cx];
}

function refreshDoors(room = currentRoom()) {
  for (const d of Object.keys(room.doors)) room.doors[d].open = room.cleared;
}

function stageLabel(floor = game.floor, stage = game.stage) {
  const f = game && game.mode === "bossRush" ? "B" : Math.max(1, floor || 1);
  return f + "-" + Math.max(1, stage || 1);
}

/* Cleared rooms (and shops/treasures) get a portal to the next stage. */
function ensurePortal(room = currentRoom()) {
  if (!game || !room || room.type === "boss") return;
  if (!game.stageCount || game.stage >= game.stageCount) return;
  if (!room.cleared || room.props.some(o => o.kind === "portal")) return;
  room.props.push({
    kind: "portal",
    x: R.x + R.w - 92,
    y: R.y + R.h / 2,
    r: 30,
    phase: rng() * 6
  });
}

function makeWeapon(id) {
  const b = WEAPONS[id];
  const bonus = game && game.player ? game.player.magBonus || 0 : 0;
  const mag = Math.max(1, Math.round(b.mag * (1 + bonus)));
  const reserve = Number.isFinite(b.reserve) ? Math.round(b.reserve * (1 + bonus * .5)) : b.reserve;
  return { id, name: b.name, ...b, mag, reserve, ammo: mag, cd: 0, reloadT: 0 };
}

function makeGame() {
  const c = currentChar();
  const mode = MODES.find(m => m.id === saveData.mode) || MODES[0];
  const mods = saveData.mods.map(id => MODIFIERS.find(m => m.id === id)).filter(Boolean);
  const world = withRng(floorSeed(runSeed, 1), () => generateWorld(1, mode.id));
  let gemMul = mode.gemMul * (1 + upgradeBonus("gem") / 100);
  for (const m of mods) gemMul *= m.gemMul;
  const hp = c.hp + upgradeBonus("hp");
  const startShield = Math.max(15, Math.round(hp * .25));
  return {
    seed: runSeed,
    mode: mode.id,
    mods: mods.map(m => m.id),
    gemMul,
    syn: {},
    synergyIds: [],
    statues: [],
    statuePendingFloor: 0,
    mergedIds: [],
    weaponCopies: {},
    cutBullets: 0,
    aimTarget: null,
    eliteKills: 0,
    miniKills: 0,
    secretFound: 0,
    elitesThisFloor: 0,
    gemsCollected: 0,
    floor: 1,
    stage: 1,
    stageCount: world.stages,
    path: world.path,
    threat: 1,
    floorRooms: 1,
    grid: world.grid,
    cx: world.start.x,
    cy: world.start.y,
    bossPos: world.boss,
    buffs: [],
    pierceBonus: 0,
    bounceBonus: 0,
    explosiveBonus: 0,
    homingBonus: 0,
    level: 1,
    coins: 20,
    relics: [],
    banished: [],
    bullets: [],
    particles: [],
    effects: [],
    floaters: [],
    log: [],
    mercenaries: [],
    testGems: 0,
    flash: 0,
    transition: 0,
    victoryTimer: -1,
    killCount: 0,
    roomCount: 1,
    roomDamaged: false,
    stats: { kills: 0, coinsEarned: 0, chests: 0, boxes: 0, barrels: 0, bosses: 0 },
    time: 0,
    player: {
      x: R.x + R.w / 2, y: R.y + R.h / 2,
      r: 14,
      color: c.color,
      hp, maxHp: hp,
      armor: c.armor,
      speed: c.speed,
      dashCdMax: c.dashCd,
      dashStartMax: c.dashCd,
      dashCd: 0,
      dashTime: 0,
      dashBreak: 0,
      dashVX: 0, dashVY: 0,
      invuln: 0,
      hitFlash: 0,
      skillCd: 0,
      skillCdMax: SKILLS[c.skill].cd * (1 - upgradeBonus("skill") / 100),
      chargeVX: 0, chargeVY: 0, chargeTime: 0, chargeId: 0,
      fireRate: 1,
      damageMul: c.damage * (1 + upgradeBonus("damage") / 100),
      critChance: .05,
      critMul: 2,
      lifesteal: 0,
      pickupRange: 95,
      magBonus: 0,
      chainBonus: 0,
      shield: startShield, shieldMax: startShield, shieldRegenT: 0,
      thorns: 0, execute: 0, phoenix: 0, storm: 0, stormTimer: 3.2,
      energy: 60, energyMax: 60, energyRegenT: 0, energyCostMul: 1, energyOnKill: 0,
      hpRegen: 0, coinsOnKill: 0, slowBonus: 0, poisonBonus: 0, reloadMul: 1,
      meleeCd: 0, meleeT: 0, meleeAngle: 0, meleeMode: false, meleeCount: 0, meleeReflect: 0,
      weapons: [makeWeapon(c.weapon)],
      wIndex: 0,
      aim: 0
    }
  };
}

/* ---------- obstacles ---------- */
function activeObstacles() {
  return currentRoom().props.filter(o =>
    (o.kind === "box" || o.kind === "barrel" || o.kind === "pillar" || o.kind === "barrier") && !o.dead);
}

function overlapsObstacle(x, y, r) {
  return activeObstacles().some(o => dist(x, y, o.x, o.y) < r + o.r + 6);
}

function spawnObstacles(room, count) {
  for (let i = 0; i < count; i++) {
    let x, y, ok = false;
    for (let tries = 0; tries < 30 && !ok; tries++) {
      x = rand(R.x + 80, R.x + R.w - 80);
      y = rand(R.y + 80, R.y + R.h - 80);
      ok = dist(x, y, R.x + R.w / 2, R.y + R.h / 2) > 170 && !overlapsObstacle(x, y, 34);
    }
    if (!ok) continue;
    const roll = rng();
    const secret = currentRoom().secretBiome;
    const kind = secret
      ? (roll < .45 ? "barrier" : roll < .8 ? "barrel" : "pillar")
      : (roll < .42 ? "box" : roll < .74 ? "barrel" : "pillar");
    const base = {
      kind, x, y,
      r: kind === "pillar" ? 27 : kind === "barrel" ? 22 : kind === "barrier" ? 26 : 24,
      dead: false
    };
    if (kind === "box") {
      base.hp = 24;
      base.color = roomTheme(currentRoom()).accent;
    } else if (kind === "barrel") {
      base.color = secret ? (chance(.5) ? "#9ade7a" : "#b8f0ff")
                          : "#ff8a4d";
      if (secret) base.subtype = base.color === "#9ade7a" ? "toxic" : "frost";
    } else if (kind === "barrier") {
      base.hp = 36;
      base.color = SECRET_THEME.accent;
    }
    room.props.push(base);
  }
}

function resolveObstacles(entity, radius, breaker = false) {
  for (const o of activeObstacles()) {
    const d = dist(entity.x, entity.y, o.x, o.y);
    const min = radius + o.r;
    if (d >= min) continue;
    if (breaker && (o.kind === "box" || o.kind === "barrel" || o.kind === "barrier")) {
      if (o.kind === "barrel") explodeBarrel(o);
      else if (o.kind === "barrier") breakBarrier(o);
      else breakBox(o);
      continue;
    }
    const nx = d > .01 ? (entity.x - o.x) / d : 1;
    const ny = d > .01 ? (entity.y - o.y) / d : 0;
    entity.x = o.x + nx * min;
    entity.y = o.y + ny * min;
  }
}

function breakBox(o) {
  if (o.dead) return;
  o.dead = true;
  game.stats.boxes++;
  saveData.stats.boxes++;
  trackQuest("boxes", 1);
  if (saveData.stats.boxes >= 20) unlockAchievement("boxes");
  writeSave(saveData);
  burst(o.x, o.y, o.color, 16, 170);
  shockwave(o.x, o.y, 58, o.color || "#c8a06a");
  if (chance(.12)) addPickup("coin", o.x, o.y, randi(2, 5));
}

function breakBarrier(o) {
  if (o.dead) return;
  o.dead = true;
  burst(o.x, o.y, o.color || SECRET_THEME.accent, 20, 180);
  shockwave(o.x, o.y, 62, o.color || SECRET_THEME.accent);
  if (chance(.5)) addPickup("energy", o.x, o.y, 6);
  sfx("block");
}

function explodeBarrel(o) {
  if (o.exploded) return;
  o.exploded = true;
  o.dead = true;
  game.stats.barrels++;
  saveData.stats.barrels++;
  trackQuest("barrels", 1);
  if (saveData.stats.barrels >= 15) unlockAchievement("barrels");
  writeSave(saveData);
  const radius = 96;
  const toxic = o.subtype === "toxic", frost = o.subtype === "frost";
  const col = toxic ? "#9ade7a" : frost ? "#b8f0ff" : "#ffb36b";
  burst(o.x, o.y, col, 28, 230);
  shockwave(o.x, o.y, 120, col);
  if (settings.shake) shake = Math.max(shake, 9);
  sfx("shotgun");
  buzz(60);
  const p = game.player;
  if (dist(p.x, p.y, o.x, o.y) < radius) damagePlayer(18 + game.level * 3);
  for (const e of currentRoom().props) {
    if (!e.type || e.dead) continue;
    if (dist(e.x, e.y, o.x, o.y) >= radius) continue;
    damageEnemy(e, 28 + game.level * 4, e.x - o.x, e.y - o.y, true);
    if (toxic) {
      e.slowT = Math.max(e.slowT || 0, 1.8);
      if ((e.poisonT || 0) <= 0) e.poisonTick = .5;
      e.poisonT = Math.max(e.poisonT || 0, 3);
    } else if (frost) {
      e.slowT = Math.max(e.slowT || 0, 3.2);
    }
  }
  if (toxic && dist(p.x, p.y, o.x, o.y) < radius) {
    if ((p.poisonT || 0) <= 0) p.poisonTick = .6;
    p.poisonT = Math.max(p.poisonT || 0, 2.5);
  }
  for (const other of activeObstacles()) {
    if (other === o || dist(other.x, other.y, o.x, o.y) >= radius) continue;
    if (other.kind === "barrel") explodeBarrel(other);
    else if (other.kind === "box") breakBox(other);
    else if (other.kind === "barrier") breakBarrier(other);
  }
}

function damageObstacle(o, amount, vx, vy) {
  if (o.dead) return;
  if (o.kind === "barrel") { explodeBarrel(o); return; }
  if (o.kind === "barrier") {
    o.hp -= amount;
    o.flash = .12;
    burst(o.x, o.y, o.color, 5, 90);
    if (o.hp <= 0) breakBarrier(o);
    return;
  }
  if (o.kind !== "box") return;
  o.hp -= amount;
  o.flash = .12;
  burst(o.x, o.y, o.color, 5, 90);
  if (o.hp <= 0) breakBox(o);
}

/* ---------- spawning ---------- */
function enemyTypeForRoll(roll) {
  if (game.floor === 2) {
    return roll < .16 ? "grunt" : roll < .29 ? "shooter" : roll < .40 ? "charger"
         : roll < .49 ? "sniper" : roll < .58 ? "bomber" : roll < .69 ? "shielder"
         : roll < .76 ? "splitter" : roll < .83 ? "turret" : roll < .89 ? "laser"
         : roll < .95 ? "miner" : "reflector";
  }
  if (game.floor === 3) {
    return roll < .10 ? "grunt" : roll < .22 ? "shooter" : roll < .32 ? "charger"
         : roll < .41 ? "sniper" : roll < .49 ? "bomber" : roll < .58 ? "shielder"
         : roll < .66 ? "splitter" : roll < .73 ? "turret" : roll < .80 ? "laser"
         : roll < .86 ? "miner" : roll < .93 ? "phantom" : "reflector";
  }
  if (game.floor >= 4) {
    return roll < .08 ? "grunt" : roll < .18 ? "shooter" : roll < .27 ? "charger"
         : roll < .36 ? "sniper" : roll < .44 ? "bomber" : roll < .53 ? "shielder"
         : roll < .61 ? "splitter" : roll < .68 ? "turret" : roll < .75 ? "laser"
         : roll < .82 ? "miner" : roll < .90 ? "phantom" : "reflector";
  }
  return roll < .30 ? "grunt" : roll < .48 ? "shooter" : roll < .63 ? "charger"
       : roll < .74 ? "sniper" : roll < .83 ? "bomber" : roll < .90 ? "turret"
       : roll < .96 ? "miner" : "splitter";
}

function arenaSpawnPoint() {
  for (let i = 0; i < 40; i++) {
    const p = randomSpawnPoint(90);
    if (dist(p.x, p.y, game.player.x, game.player.y) > 150) return p;
  }
  return randomSpawnPoint(90);
}

function spawnArenaWave(room) {
  const threat = Math.max(1, game.threat || threatLevel());
  const n = Math.min(16, 3 + room.wave * 2 + Math.floor((threat - 1) / 2));
  const elite = (room.wave === 1 || threat >= 6) && game.elitesThisFloor < 3 && chance(.7);
  for (let i = 0; i < n; i++) {
    const p = arenaSpawnPoint();
    room.props.push(makeEnemy(enemyTypeForRoll(rng()), p.x, p.y, elite && i === 0));
  }
  if (elite) game.elitesThisFloor++;
  if (room.wave >= 1) {
    const p = arenaSpawnPoint();
    room.props.push({
      kind: "trap", x: p.x, y: p.y, r: 26,
      damage: Math.min(46, 8 + game.level * 2),
      color: floorData(game.floor).trap,
      timer: rand(1, 1.8), active: 0
    });
  }
  floater("ВОЛНА " + (room.wave + 1) + " / " + room.maxWaves, W / 2, R.y + 90, "#ffb36b");
  sfx("clear");
}

function spawnAmbush(room) {
  const threat = Math.max(1, game.threat || threatLevel());
  const n = Math.min(12, 4 + Math.floor(threat * .8) + randi(0, 2));
  room.armed = true;
  for (let i = 0; i < n; i++) {
    const p = arenaSpawnPoint();
    room.props.push(makeEnemy(enemyTypeForRoll(rng()), p.x, p.y, i === 0 && threat >= 4));
  }
  sfx("boss");
  buzz(40);
  floater("ЗАСАДА! ЗАЩИЩАЙ СУНДУК", W / 2, R.y + 92, "#ff6b81");
  logEvent("Засада: " + n + " врагов", "#ff6b81");
}

function generateShopItems(count) {
  const n = count || (saveData.shopSlots === 4 ? 4 : 3);
  const pool = shuffle(SHOP_POOL.slice()).slice(0, n);
  const priceMul = 1 + (game.floor - 1) * .3;
  return pool.map(it => ({ ...it, price: Math.round(it.price * priceMul) }));
}

function rerollPrice() {
  const room = currentRoom();
  return 20 + game.floor * 15 + (room.rerolls || 0) * 15;
}

function rerollShop() {
  const room = currentRoom();
  const price = rerollPrice();
  if (game.coins < price) {
    floater("Не хватает монет", W / 2, R.y + 50, "#ff6b81");
    tone(160, .12, "square", .03, 100);
    return;
  }
  game.coins -= price;
  room.rerolls = (room.rerolls || 0) + 1;
  room.shopItems = generateShopItems();
  logEvent("Магазин обновлён (−" + price + " ¢)", "#8ee6ff");
  sfx("buy");
  floater("Товары обновлены", W / 2, R.y + 50, "#8ee6ff");
}

function buyShopSlot() {
  if (saveData.shopSlots === 4) return;
  const cost = 45;
  if (saveData.gems < cost) {
    floater("Не хватает самоцветов", W / 2, R.y + 50, "#ff6b81");
    tone(160, .12, "square", .03, 100);
    return;
  }
  saveData.gems -= cost;
  saveData.shopSlots = 4;
  writeSave(saveData);
  const room = currentRoom();
  const used = new Set(room.shopItems.filter(Boolean).map(it => it.id));
  const extra = shuffle(SHOP_POOL.filter(it => !used.has(it.id)))[0];
  if (extra) room.shopItems.push({ ...extra, price: Math.round(extra.price * (1 + (game.floor - 1) * .3)) });
  logEvent("Открыт 4-й слот магазина", "#b8a1ff");
  sfx("buy");
  floater("4-й слот открыт!", W / 2, R.y + 50, "#7cff9b");
}

function spawnRoom(room) {
  if (room.type === "combat") {
    spawnObstacles(room, 2 + randi(0, 2) + (game.level > 4 ? 1 : 0));
    const threat = Math.max(1, game.threat || threatLevel());
    const n = Math.min(14, 3 + Math.min(4, Math.floor(game.level * .8)) + randi(0, 2) + Math.floor((threat - 1) / 3));
    const elite = chance(clamp(.18 + threat * .05, .18, .6)) &&
                  game.elitesThisFloor < Math.ceil(threat / 3) && game.floorRooms > 1;
    for (let i = 0; i < n; i++) {
      const p = randomSpawnPoint(90);
      room.props.push(makeEnemy(enemyTypeForRoll(rng()), p.x, p.y, elite && i === 0));
    }
    if (elite) game.elitesThisFloor++;
    const trapCount = game.level > 1 && chance(.55) ? randi(2, 4) : 0;
    for (let i = 0; i < trapCount; i++) {
      const p = randomSpawnPoint(110);
      room.props.push({
        kind: "trap", x: p.x, y: p.y, r: 26,
        damage: Math.min(46, 8 + game.level * 2),
        color: floorData(game.floor).trap,
        timer: rand(.8, 1.6), active: 0
      });
    }
    if (room.secret) {
      room.props.push({
        kind: "crack", x: R.x + R.w - 26, y: R.y + R.h / 2,
        r: 20, used: false
      });
    }
    room.cleared = false;
  } else if (room.type === "ambush") {
    /* Looks like a treasure room until the chest is touched. */
    spawnObstacles(room, 2 + randi(0, 1));
    room.props.push({ kind: "chest", x: R.x + R.w / 2, y: R.y + R.h / 2, opened: false, ambush: true });
    room.armed = false;
    room.cleared = false;
  } else if (room.type === "arena") {
    spawnObstacles(room, 2 + randi(0, 1));
    room.wave = 0;
    spawnArenaWave(room);
    room.cleared = false;
  } else if (room.type === "mini") {
    spawnObstacles(room, 1 + randi(0, 1));
    const e = makeEnemy(pick(["shooter", "charger", "turret", "laser", "phantom"]),
                        R.x + R.w / 2, R.y + 140, true);
    e.mini = true;
    e.maxHp = e.hp = Math.round(e.hp * 2.2);
    e.color = "#ffd76b";
    e.contact = Math.round(e.contact * 1.1);
    room.props.push(e);
    room.cleared = false;
    floater("КОМНАТА ИСПЫТАНИЯ", W / 2, R.y + 90, "#ffd76b");
  } else if (room.type === "boss") {
    spawnObstacles(room, 2 + randi(0, 2));
    room.props.push(makeEnemy("boss", R.x + R.w / 2, R.y + 130));
    if (game.floor >= 3 && chance(.55)) {
      room.props.push(makeEnemy("twin", R.x + 110, R.y + 240));
      floater("БОСС-БЛИЗНЕЦ!", R.x + 110, R.y + 200, "#b8a1ff");
    }
    room.cleared = false;
    sfx("boss");
  } else if (room.type === "secret") {
    spawnObstacles(room, 3 + randi(0, 2));
    for (let i = 0; i < 3; i++) {
      const pt = randomSpawnPoint(100);
      room.props.push({
        kind: "barrel", subtype: i % 2 ? "toxic" : "frost",
        x: pt.x, y: pt.y, r: 22, dead: false,
        color: i % 2 ? "#9ade7a" : "#b8f0ff"
      });
    }
    const cage = randomSpawnPoint(130);
    room.props.push({ kind: "cage", x: cage.x, y: cage.y, r: 30, opened: false });
    const n = 4 + game.floor + randi(0, 2);
    for (let i = 0; i < n; i++) {
      const pt = randomSpawnPoint(110);
      room.props.push(makeEnemy(pick(["phantom", "bomber", "charger", "shooter"]), pt.x, pt.y));
    }
    room.cleared = false;
    floater("СКРЫТЫЙ БИОМ · ПОЛОЕ ДНО", W / 2, R.y + 90, SECRET_THEME.accent);
    sfx("boss");
  } else if (room.type === "treasure") {
    room.props.push({ kind: "chest", x: R.x + R.w / 2, y: R.y + R.h / 2, opened: false });
    room.cleared = true;
  } else if (room.type === "shop") {
    room.shopItems = generateShopItems();
    room.props.push({ kind: "merchant", x: R.x + R.w / 2, y: R.y + 118, r: 24 });
    room.cleared = true;
  } else {
    room.cleared = true;
  }
  refreshDoors(room);
}

function randomSpawnPoint(minFromCenter = 70) {
  for (let i = 0; i < 40; i++) {
    const x = rand(R.x + 55, R.x + R.w - 55);
    const y = rand(R.y + 55, R.y + R.h - 55);
    if (dist(x, y, R.x + R.w / 2, R.y + R.h / 2) > minFromCenter && !overlapsObstacle(x, y, 20)) {
      return { x, y };
    }
  }
  return { x: R.x + 90, y: R.y + 90 };
}

function makeEnemy(type, x, y, elite = false) {
  const lv = game.level;
  const base = {
    type, x, y,
    vx: 0, vy: 0,
    flash: 0,
    dead: false,
    r: 14,
    contact: 9 + lv,
    hp: 20, maxHp: 20,
    speed: 70,
    color: "#e06a6a",
    timer: rand(.4, 1.4),
    angle: 0,
    telegraph: 0,
    telegraphMax: 0,
    aimAngle: 0,
    facing: 0,
    exploded: false
  };
  if (type === "grunt") {
    base.hp = base.maxHp = 22 + lv * 6;
    base.speed = 76 + lv * 2;
    base.color = "#e56b6b";
  } else if (type === "shooter") {
    base.hp = base.maxHp = 17 + lv * 5;
    base.speed = 58;
    base.r = 13;
    base.color = "#d78ce8";
    base.timer = rand(.7, 1.6);
  } else if (type === "charger") {
    base.hp = base.maxHp = 36 + lv * 9;
    base.speed = 42;
    base.r = 17;
    base.color = "#e8a04a";
    base.state = "idle";
    base.timer = rand(1, 1.8);
    base.dx = 0; base.dy = 0;
  } else if (type === "sniper") {
    base.hp = base.maxHp = 16 + lv * 4;
    base.speed = 34;
    base.r = 12;
    base.color = "#ff7ce5";
    base.contact = 7 + lv;
    base.timer = rand(1.4, 2.4);
  } else if (type === "bomber") {
    base.hp = base.maxHp = 26 + lv * 6;
    base.speed = 96 + lv * 2;
    base.r = 15;
    base.color = "#ffb36b";
    base.contact = 6 + lv;
    base.timer = .55;
  } else if (type === "shielder") {
    base.hp = base.maxHp = 46 + lv * 12;
    base.speed = 44;
    base.r = 19;
    base.color = "#9a86e0";
    base.contact = 11 + lv;
    base.timer = rand(2.2, 3.2);
    base.state = "idle";
    base.shieldHp = base.maxShieldHp = 48 + lv * 10;
  } else if (type === "reflector") {
    base.hp = base.maxHp = 38 + lv * 9;
    base.speed = 52;
    base.r = 16;
    base.color = "#6bd9ff";
    base.contact = 9 + lv;
    base.timer = rand(.9, 1.6);
    base.reflectCharges = 6;
    base.reflectCd = 0;
  } else if (type === "splitter") {
    base.hp = base.maxHp = 30 + lv * 8;
    base.speed = 66;
    base.r = 17;
    base.color = "#7cff9b";
    base.contact = 8 + lv;
    base.phase = rand(0, Math.PI * 2);
  } else if (type === "spawnling") {
    base.hp = base.maxHp = 10 + lv * 3;
    base.speed = 112;
    base.r = 9;
    base.color = "#b6ffc4";
    base.contact = 5 + lv;
    base.phase = rand(0, Math.PI * 2);
  } else if (type === "turret") {
    base.hp = base.maxHp = 44 + lv * 11;
    base.speed = 0;
    base.r = 18;
    base.color = "#ffd76b";
    base.contact = 8 + lv;
    base.timer = rand(1, 1.8);
    base.state = "idle";
  } else if (type === "laser") {
    base.hp = base.maxHp = 30 + lv * 8;
    base.speed = 52;
    base.r = 14;
    base.color = "#ff6b81";
    base.contact = 8 + lv;
    base.timer = rand(1.6, 2.6);
    base.beam = 0;
    base.beamHitCd = 0;
  } else if (type === "miner") {
    base.hp = base.maxHp = 32 + lv * 8;
    base.speed = 62;
    base.r = 15;
    base.color = "#c8a06a";
    base.contact = 7 + lv;
    base.timer = rand(1.2, 2);
  } else if (type === "phantom") {
    base.hp = base.maxHp = 26 + lv * 7;
    base.speed = 70;
    base.r = 13;
    base.color = "#b8a1ff";
    base.contact = 9 + lv;
    base.timer = rand(1.4, 2.4);
    base.phase = rand(0, Math.PI * 2);
  } else if (type === "boss") {
    const theme = floorData(game.floor);
    base.bossType = theme.boss;
    base.color = theme.accent;
    base.timer = 1.4;
    base.pattern = 0;
    base.nextPattern = 0;
    base.enraged = false;
    if (base.bossType === "frost") {
      base.hp = base.maxHp = 210 + lv * 36;
      base.speed = 42;
      base.r = 30;
      base.contact = 16 + lv * 2;
    } else if (base.bossType === "magma") {
      base.hp = base.maxHp = 250 + lv * 42;
      base.speed = 55;
      base.r = 33;
      base.contact = 22 + lv * 2;
    } else if (base.bossType === "swamp") {
      base.hp = base.maxHp = 230 + lv * 38;
      base.speed = 46;
      base.r = 32;
      base.contact = 18 + lv * 2;
    } else if (base.bossType === "void") {
      base.hp = base.maxHp = 260 + lv * 44;
      base.speed = 52;
      base.r = 32;
      base.contact = 20 + lv * 2;
    } else {
      base.hp = base.maxHp = 130 + lv * 26;
      base.speed = 48;
      base.r = 31;
      base.contact = 18 + lv * 2;
    }
    const power = playerPower();
    const hpMult = clamp(.85 + (power - 1) * .16, .85, 2.2);
    base.maxHp = base.hp = Math.round(base.hp * hpMult);
    base.contact = Math.round(base.contact * clamp(1 + (power - 1) * .12, 1, 1.4));
    base.damageScale = clamp(1 + (power - 1) * .12, 1, 1.4);
    base.hpMult = hpMult;
    base.frenzied = false;
    base.collapsed = false;
  }
  if (type === "twin") {
    const theme = floorData(game.floor);
    base.bossType = theme.boss;
    base.color = "#b8a1ff";
    base.hp = base.maxHp = Math.round((88 + lv * 16) * clamp(.9 + (playerPower() - 1) * .12, .9, 1.6));
    base.speed = 58;
    base.r = 20;
    base.contact = 11 + lv;
    base.timer = rand(1, 1.6);
    base.pattern = randi(0, 2);
    base.nextPattern = 0;
    base.enraged = false;
    base.frenzied = false;
    base.collapsed = false;
    base.damageScale = .85;
    base.isTwin = true;
    base.mini = true;
  }
  if (game.mods.indexOf("fast") >= 0) base.speed *= 1.25;
  if (elite && type !== "boss") {
    base.elite = true;
    base.maxHp = base.hp = Math.round(base.hp * 2);
    base.contact = Math.round(base.contact * 1.25);
    base.speed *= 1.08;
    base.r = Math.round(base.r * 1.15);
    if (base.timer) base.timer *= .8;
  }
  const diff = difficultyCfg();
  const threat = Math.max(1, game.threat || threatLevel());
  const hpMul = 1 + (threat - 1) * .055;
  const dmgMul = 1 + (threat - 1) * .03;
  base.maxHp = base.hp = Math.max(1, Math.round(base.hp * diff.hp * hpMul));
  /* Contact damage is capped so deep stages stay dangerous, not unavoidable. */
  base.contact = clamp(Math.round(base.contact * diff.dmg * dmgMul), 1, 56);
  base.speed *= 1 + Math.min(.18, (threat - 1) * .008);
  if (base.maxShieldHp) base.maxShieldHp = base.shieldHp = Math.round(base.shieldHp * diff.hp * hpMul);
  return base;
}

function addPickup(kind, x, y, value, weaponId) {
  if (game && game.mods.indexOf("scarce") >= 0 && Number.isFinite(value)) {
    if (kind === "heart") value = Math.max(1, Math.round(value * .5));
    else if (kind === "ammo") value = Math.max(1, Math.round(value * .75));
  }
  currentRoom().pickups.push({ kind, x, y, value, weaponId, bob: rand(0, Math.PI * 2), life: 18 });
}

function shockwave(x, y, maxR, color) {
  game.effects.push({ x, y, r: 8, maxR, life: .42, maxLife: .42, color });
  game.flash = Math.max(game.flash, .22);
}

function explodeAt(x, y, radius, damage, color, skip) {
  burst(x, y, color, 22, 210);
  shockwave(x, y, radius + 24, color);
  if (settings.shake) shake = Math.max(shake, 6);
  sfx("shotgun");
  for (const e of currentRoom().props) {
    if (!e.type || e.dead || e === skip) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < radius + e.r) {
      const falloff = 1 - d / (radius + e.r) * .45;
      damageEnemy(e, damage * falloff, e.x - x, e.y - y, true);
    }
  }
  for (const o of activeObstacles()) {
    if ((o.kind === "box" || o.kind === "barrel") && dist(x, y, o.x, o.y) < radius + o.r) {
      if (o.kind === "barrel") explodeBarrel(o);
      else damageObstacle(o, damage, o.x - x, o.y - y);
    }
  }
  if (game.syn && game.syn.napalm) {
    currentRoom().props.push({
      kind: "fire", x, y, r: radius * .85, life: 2.6,
      damage: Math.max(5, Math.round(damage * .14)), tick: 0
    });
  }
}

function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
}

function burst(x, y, color, count = 10, power = 140) {
  if (!settings.particles) return;
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), s = rand(power * .3, power);
    game.particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(.25, .6), maxLife: .6,
      color, size: rand(2, 5)
    });
  }
}

function floater(text, x, y, color = "#ffffff") {
  if (!game) return;
  game.floaters.push({ text, x, y, life: 1, color });
}

/* Short combat log: only notable events, newest first. */
function logEvent(text, color = "#cfd6ff") {
  if (!game || !settings.combatLog) return;
  if (!game.log) game.log = [];
  // Real time keeps the log expiring even while the game is paused.
  game.log.unshift({ text, color, time: performance.now() });
  if (game.log.length > 8) game.log.length = 8;
}

function checkFloorAchievements() {
  if (!game) return;
  if (game.floor >= 2) unlockAchievement("floor2");
  if (game.floor >= 3) unlockAchievement("floor3");
  if (game.floor >= 4) unlockAchievement("floor4");
  if (game.floor >= 5) unlockAchievement("floor5");
}

function earnCoins(n) {
  const amount = Math.max(1, Math.round(n * difficultyCfg().coins));
  n = amount;
  game.coins += n;
  game.stats.coinsEarned += n;
  saveData.stats.coinsEarned += n;
  if (saveData.stats.coinsEarned >= 500) unlockAchievement("rich");
  trackQuest("coins", n);
  writeSave(saveData);
}

function earnGems(n) {
  if (!n) return;
  const amount = game ? Math.max(1, Math.round(n * game.gemMul * difficultyCfg().gems)) : n;
  saveData.gems += amount;
  saveData.gemsEarned += amount;
  if (game) game.gemsCollected = (game.gemsCollected || 0) + amount;
  if (saveData.gemsEarned >= 100) unlockAchievement("gems");
  writeSave(saveData);
  if (game) floater("+" + amount + " самоцвет", game.player.x, game.player.y - 56, "#ff9de2");
}

function charUnlocked(id) {
  return saveData.unlockedChars.indexOf(id) >= 0;
}

function unlockCharacter(id) {
  const c = CHARACTERS.find(v => v.id === id);
  if (!c || charUnlocked(id)) return false;
  if (saveData.gems < c.cost) {
    floater("Не хватает самоцветов", W / 2, H - 120, "#ff6b81");
    sfx("hurt");
    return false;
  }
  saveData.gems -= c.cost;
  saveData.unlockedChars.push(id);
  saveData.char = id;
  selectedChar = id;
  writeSave(saveData);
  const bought = CHARACTERS.filter(v => v.cost).filter(v => charUnlocked(v.id)).length;
  if (bought >= 3) unlockAchievement("heroes");
  sfx("buy");
  buzz(40);
  return true;
}

/* ---------- transitions / room logic ---------- */
function startGame(seedOverride, opts = {}) {
  ensureAudio();

  let s = seedOverride != null ? seedOverride : sharedSeed;
  sharedSeed = null;
  if (!Number.isFinite(s) || s <= 0) s = Math.floor(Math.random() * 999999) + 1;
  runSeed = s >>> 0;
  rng = mulberry32(runSeed);
  musicStep = 0;
  musicNextTime = audioCtx ? audioCtx.currentTime + .05 : 0;
  // A test run must not consume the shared seed or overwrite the run URL.
  if (!opts.test) {
    try {
      const u = new URL(location.href);
      u.searchParams.set("seed", String(runSeed));
      history.replaceState(null, "", u);
    } catch (_) {}
  }

  game = makeGame();
  if (opts.test) {
    game.test = true;
    logEvent("ТЕСТОВЫЙ ЗАБЕГ — прогресс не сохраняется", "#ffb36b");
  }
  refreshSynergies();
  ensureDaily();
  checkFloorAchievements();
  const room = currentRoom();
  game.level = 1 + (room.type === "boss" ? 1 : 0);
  room.visited = true;
  room.enterTime = game.time;
  if (room.type === "boss") { spawnRoom(room); room.spawned = true; }
  else room.spawned = true;
  syncMercenaries(room);
  state = "playing";
  shake = 0;
  clearInput();
  if (!opts.skipFullscreen) enterFullscreenOnStart();
  readInput();
  floater("Сид " + runSeed, W / 2, R.y + 60, "#ffe27a");
}

function finishRun(win) {
  if (!game || game.saved) return;
  game.saved = true;
  if (game.test) return;
  saveData.runs = (saveData.runs || 0) + 1;
  saveData.wins = (saveData.wins || 0) + (win ? 1 : 0);
  saveData.bestRooms = Math.max(saveData.bestRooms || 0, game.roomCount);
  saveData.bestFloor = Math.max(saveData.bestFloor || 0, game.floor);
  saveData.bestKills = Math.max(saveData.bestKills || 0, game.killCount);
  saveData.bestCoins = Math.max(saveData.bestCoins || 0, game.coins);
  saveData.lastSeed = game.seed;
  if (win) {
    unlockAchievement("win");
    if (game.mode === "bossRush") {
      unlockAchievement("rush");
      const rt = Math.round(game.time);
      if (!saveData.records.rushBest || rt < saveData.records.rushBest) {
        saveData.records.rushBest = rt;
      }
    }
    if (game.mode === "sprint") {
      const t = Math.round(game.time);
      if (!saveData.records.sprintBest || t < saveData.records.sprintBest) {
        saveData.records.sprintBest = t;
      }
      if (t < 720) unlockAchievement("sprint");
    }
    earnGems(15);
    const t = Math.round(game.time);
    saveData.bestWinTime = saveData.bestWinTime ? Math.min(saveData.bestWinTime, t) : t;
  }
  saveData.records.mostGems = Math.max(saveData.records.mostGems || 0, game.gemsCollected || 0);
  writeSave(saveData);
}

function togglePause() {
  if (state === "playing") { mapExpanded = false; state = "paused"; }
  else if (state === "paused") state = "playing";
  else if (state === "shop") closeShop();
}

function enterRoom(dx, dy, target = null) {
  if (game.transition > 0) return;
  const nx = target ? target.x : game.cx + dx, ny = target ? target.y : game.cy + dy;
  if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || !game.grid[ny][nx]) return;
  game.cx = nx; game.cy = ny;
  game.bullets.length = 0;
  game.roomDamaged = false;
  const room = currentRoom();
  game.stage = room.stage || game.stage;
  game.floorRooms = game.stage;
  room.visited = true;
  room.enterTime = game.time;
  game.roomCount++;
  game.level = (game.floor - 1) * game.stageCount + game.stage + (room.type === "boss" ? 1 : 0);
  game.threat = threatLevel();
  if (!room.spawned) {
    spawnRoom(room);
    room.spawned = true;
  }
  syncMercenaries(room);
  refreshDoors(room);
  ensurePortal(room);

  const p = game.player;
  if (target) { p.x = R.x + 44; p.y = R.y + R.h / 2; }
  if (dy === -1) { p.y = R.y + R.h - 36; p.x = clamp(p.x, R.x + 60, R.x + R.w - 60); }
  if (dy === 1)  { p.y = R.y + 36;       p.x = clamp(p.x, R.x + 60, R.x + R.w - 60); }
  if (dx === -1) { p.x = R.x + R.w - 36; p.y = clamp(p.y, R.y + 60, R.y + R.h - 60); }
  if (dx === 1)  { p.x = R.x + 36;       p.y = clamp(p.y, R.y + 60, R.y + R.h - 60); }

  game.transition = .32;
  floater(room.type === "boss" ? floorData(game.floor).bossName.toUpperCase() + " · УГРОЗА " + game.threat
          : "СТУПЕНЬ " + stageLabel() + " · УГРОЗА " + game.threat + (room.type === "shop" ? " · МАГАЗИН"
          : room.type === "treasure" ? " · СОКРОВИЩЕ"
          : room.type === "arena" ? " · АРЕНА"
          : room.type === "mini" ? " · ИСПЫТАНИЕ"
          : room.type === "secret" ? " · ПОЛОЕ ДНО" : ""),
          W / 2, R.y + 58, room.type === "boss" ? floorData(game.floor).accent : "#ffe27a");
}

function nextFloor() {
  if (!game || game.floor >= FLOORS.length) return;
  game.floor++;
  logEvent("Глава " + game.floor + " · " + floorData(game.floor).name, floorData(game.floor).accent);
  checkFloorAchievements();
  const world = withRng(floorSeed(game.seed, game.floor), () => generateWorld(game.floor, game.mode));
  game.grid = world.grid;
  game.path = world.path;
  game.stageCount = world.stages;
  game.stage = 1;
  game.elitesThisFloor = 0;
  game.cx = world.start.x;
  game.cy = world.start.y;
  game.bossPos = world.boss;
  game.floorRooms = 1;
  game.roomDamaged = false;
  game.bullets.length = 0;
  game.particles.length = 0;
  game.floaters.length = 0;
  const room = currentRoom();
  room.stage = 1;
  game.level = (game.floor - 1) * game.stageCount + 1 + (room.type === "boss" ? 1 : 0);
  game.threat = threatLevel();
  room.visited = true;
  room.enterTime = game.time;
  /* Always spawn the first room of a new chapter: it used to be granted free. */
  if (!room.spawned) { spawnRoom(room); room.spawned = true; }
  ensurePortal(room);
  syncMercenaries(room);
  const p = game.player;
  p.x = R.x + R.w / 2;
  p.y = R.y + R.h / 2;
  p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * .25));
  for (const w of p.weapons) {
    if (Number.isFinite(w.reserve)) w.reserve += w.mag * 2;
  }
  game.transition = .6;
  state = "playing";
  clearInput();
  const theme = floorData(game.floor);
  floater("ГЛАВА " + stageLabel() + " · " + theme.name, W / 2, R.y + 60, theme.accent);
  sfx("clear");
  buzz(50);
}

/* Soul Knight style: every third portal offers one of three run buffs. */
function nextStage() {
  if (!game || game.stage >= game.stageCount || game.transition > 0) return;
  game.pendingStage = game.stage + 1;
  if (state === "buff") return;
  if (game.stage % BUFF_EVERY !== 0) { finishNextStage(); return; }
  buffChoices = buildBuffChoices();
  if (!buffChoices.length) { finishNextStage(); return; }
  state = "buff";
  clearInput();
  sfx("relic");
  buzz(20);
}

function finishNextStage() {
  if (!game) return;
  const next = game.pendingStage || game.stage + 1;
  game.pendingStage = 0;
  buffChoices = [];
  state = "playing";
  if (next > game.stageCount) { nextFloor(); return; }
  const cell = game.path && game.path[next - 1];
  if (!cell) { nextFloor(); return; }
  enterRoom(0, 0, cell);
}

function checkRoomClear() {
  const room = currentRoom();
  if (room.cleared || (room.type !== "combat" && room.type !== "boss" &&
      room.type !== "arena" && room.type !== "mini" && room.type !== "secret" &&
      room.type !== "ambush")) return;
  if (room.type === "ambush" && !room.armed) return;
  if (room.props.some(o => o.type && !o.dead)) return;
  if (room.type === "arena" && room.wave < room.maxWaves - 1) {
    room.wave++;
    const h = randomSpawnPoint(40);
    addPickup("heart", h.x, h.y, 16);
    const a = randomSpawnPoint(40);
    addPickup("ammo", a.x, a.y, 30);
    spawnArenaWave(room);
    return;
  }
  room.cleared = true;
  if (game.player.shieldMax > 0 && game.player.shield < game.player.shieldMax) {
    const before = game.player.shield;
    game.player.shield = Math.min(game.player.shieldMax, before + Math.ceil((game.player.shieldMax - before) * .5));
    floater("Щит восстановлен", game.player.x, game.player.y - 44, "#ffe27a");
  }
  trackQuest("rooms", 1);
  if (!game.roomDamaged) unlockAchievement("noHit");
  if (room.type === "arena") unlockAchievement("arena");
  if (room.secretBiome) {
    unlockAchievement("secretBiome");
    earnGems(4);
    addPickup("energy", R.x + R.w / 2, R.y + R.h / 2, 30);
    floater("БИОМ ОТКРЫТ · +4 самоцвета", W / 2, R.y + 112, SECRET_THEME.accent);
  }
  if (game.mode === "sprint" && game.time - (room.enterTime || 0) < 28) {
    earnGems(1);
    floater("СПРИНТ · +1 самоцвет", W / 2, R.y + 96, "#8ee6ff");
  }
  if (room.secret && room.type === "combat") {
    floater("Трещина в стене! Нажми E", W / 2, R.y + 120, "#ff9de2");
  }
  refreshDoors(room);
  ensurePortal(room);
  sfx("clear");
  floater(room.type === "arena" ? "АРЕНА ПРОЙДЕНА!"
        : room.type === "mini" ? "ИСПЫТАНИЕ ПРОЙДЕНО!"
        : room.type === "ambush" ? "ЗАСАДА ОТРАЖЕНА!"
        : "Комната зачищена!", W / 2, R.y + 70, "#7cff9b");
  if (room.type === "ambush") {
    earnCoins(18 + game.threat * 4);
    floater("+" + (18 + game.threat * 4) + " монет за засаду", W / 2, R.y + 94, "#ffd76b");
  }
  if ((room.type === "combat" || room.type === "arena" || room.type === "mini" ||
       room.type === "secret" || room.type === "ambush") && !room.rewardTaken) openReward(room);

  const rewards = room.type === "boss" || room.type === "arena" ? 5 : randi(1, 3);
  for (let i = 0; i < rewards; i++) {
    const p = randomSpawnPoint(40);
    const roll = rng();
    if (roll < .34) addPickup("heart", p.x, p.y, 18);
    else if (roll < .72) addPickup("coin", p.x, p.y, randi(8, 16));
    else addPickup("ammo", p.x, p.y, 30);
  }
  if (room.type === "boss") {
    addPickup("weapon", R.x + R.w / 2 - 40, R.y + R.h / 2, 0,
              pick(BOSS_WEAPON_IDS));
    if (game.floor >= FLOORS.length) {
      game.victoryTimer = 1.6;
    } else {
      room.props.push({
        kind: "stairs",
        x: R.x + R.w / 2 + 40,
        y: R.y + R.h / 2,
        r: 30
      });
      floater("Лестница вниз открыта!", R.x + R.w / 2 + 40, R.y + R.h / 2 - 52, "#ffe27a");
      buzz(50);
    }
    if ((game.floor === 2 || game.floor === 4) && game.statuePendingFloor < game.floor) {
      game.statuePendingFloor = game.floor;
      openStatue();
    }
  }
  earnCoins(8 + game.level * 2);
}

/* ---------- actions ---------- */
function currentWeapon() {
  return game.player.weapons[game.player.wIndex];
}

function playerPower() {
  const p = game && game.player;
  if (!p) return 1;
  const w = p.weapons[p.wIndex];
  const dmg = (w ? w.damage * (w.count || 1) : 10) * p.damageMul;
  const rate = w ? w.rate * p.fireRate : .3;
  const dps = dmg / Math.max(.04, rate) * (1 + p.critChance);
  return clamp(dps / 60, .7, 4.5);
}

function tryDash() {
  const p = game.player;
  if (p.dashCd > 0 || p.dashTime > 0) return;
  let { x: dx, y: dy } = getMoveVector();
  if (!dx && !dy) { dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
  const l = Math.hypot(dx, dy) || 1;
  p.dashVX = dx / l * 720;
  p.dashVY = dy / l * 720;
  p.dashTime = .2;
  p.dashBreak = .55;
  p.dashStartMax = p.dashCdMax * (hasStatue("swift") ? .8 : 1);
  p.dashCd = p.dashStartMax;
  p.invuln = Math.max(p.invuln, .3);
  burst(p.x, p.y, "#9ad8ff", 9, 100);
  sfx("dash");
  buzz(25);
}

function meleeAttack(forcedAngle) {
  if (!game) return;
  const p = game.player;
  if (state !== "playing" || p.meleeCd > 0) return;
  const a = Number.isFinite(forcedAngle)
    ? forcedAngle
    : Math.atan2(input.aimY - p.y, input.aimX - p.x);
  const reach = 68;
  p.meleeCd = .34;
  p.meleeT = .16;
  p.meleeAngle = a;
  game.effects.push({
    kind: "slash", x: p.x, y: p.y, angle: a, r: reach,
    life: .18, maxLife: .18, color: "#e9e6f5"
  });
  let hit = 0;
  for (const e of currentRoom().props) {
    if (e.dead || !e.maxHp || e.hp <= 0) continue;
    const d = dist(p.x, p.y, e.x, e.y);
    if (d > reach + (e.r || 0)) continue;
    if (angleDelta(Math.atan2(e.y - p.y, e.x - p.x), a) > 1.05) continue;
    let blocked = false;
    for (const o of activeObstacles()) {
      if (segmentDist(o.x, o.y, p.x, p.y, e.x, e.y) < o.r + 4) { blocked = true; break; }
    }
    if (blocked) continue;
    const dmg = 26 * p.damageMul * statueDamageMul();
    damageEnemy(e, dmg, Math.cos(a), Math.sin(a), true);
    hit++;
  }
  let cut = 0;
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    if (b.owner !== "enemy") continue;
    const d = dist(p.x, p.y, b.x, b.y);
    if (d > reach + b.r) continue;
    if (angleDelta(Math.atan2(b.y - p.y, b.x - p.x), a) > .9) continue;
    if (p.meleeReflect > 0 || hasStatue("warrior")) {
      const speed = Math.hypot(b.vx, b.vy) * 1.15;
      b.owner = "player";
      b.vx = Math.cos(a) * speed;
      b.vy = Math.sin(a) * speed;
      b.damage = (b.damage || 8) * 1.6 * p.damageMul * statueDamageMul();
      b.color = "#ffe27a";
      b.hit = [];
      b.life = Math.max(b.life, 1.4);
    } else {
      game.bullets.splice(i, 1);
    }
    cut++;
  }
  if (cut) {
    game.cutBullets += cut;
    burst(p.x + Math.cos(a) * 40, p.y + Math.sin(a) * 40, "#ffe27a", 8 + cut * 2, 130);
    floater("СРУБЛЕНО " + cut, p.x, p.y - 48, "#ffe27a");
    if (game.cutBullets >= 20) unlockAchievement("blade");
  }
  if (hit) floater("УДАР", p.x, p.y - 36, "#b8a1ff");
  p.meleeCount++;
  sfx(hit || cut ? "block" : "dash");
  buzz(cut ? 30 : 12);
}

function toggleMelee() {
  const p = game.player;
  p.meleeMode = !p.meleeMode;
  floater(p.meleeMode ? "КЛИНОК ВКЛЮЧЁН" : "КЛИНОК ВЫКЛЮЧЕН", p.x, p.y - 54, "#b8a1ff");
  sfx("reload");
}

function useSkill() {
  const p = game.player;
  const char = currentChar();
  const sk = SKILLS[char.skill];
  if (p.skillCd > 0 || state !== "playing") return;
  p.skillCd = p.skillCdMax;
  const base = Math.atan2(input.aimY - p.y, input.aimX - p.x);

  if (char.skill === "wave") {
    explodeAt(p.x, p.y, 130, 34 * p.damageMul * statueDamageMul(), "#9ad8ff");
    for (const e of currentRoom().props) {
      if (!e.type || e.dead) continue;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.x += Math.cos(a) * 46; e.y += Math.sin(a) * 46;
    }
  } else if (char.skill === "volley") {
    for (let i = -4; i <= 4; i++) {
      const a = base + i * .075;
      game.bullets.push({
        owner: "player", x: p.x + Math.cos(a) * 20, y: p.y + Math.sin(a) * 20,
        vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
        r: 4, damage: 11 * p.damageMul * statueDamageMul(), color: "#7cff9b", life: 1.1, pierce: 0
      });
    }
    sfx("shoot");
  } else if (char.skill === "charge") {
    p.chargeId++;
    p.chargeTime = .34;
    p.chargeVX = Math.cos(base) * 620;
    p.chargeVY = Math.sin(base) * 620;
    p.invuln = Math.max(p.invuln, .45);
    sfx("dash");
  } else if (char.skill === "flask") {
    const tx = clamp(input.aimX, R.x + 40, R.x + R.w - 40);
    const ty = clamp(input.aimY, R.y + 40, R.y + R.h - 40);
    explodeAt(tx, ty, 105, 58 * p.damageMul * statueDamageMul(), "#ff9de2");
  } else if (char.skill === "turret") {
    currentRoom().props.push({
      kind: "ally", allyType: "turret", x: p.x + Math.cos(base) * 46, y: p.y + Math.sin(base) * 46,
      r: 16, life: 9, cd: 0, color: "#8ee6ff", facing: base
    });
    floater("Турель развёрнута!", p.x, p.y - 42, "#8ee6ff");
  } else if (char.skill === "minions") {
    for (let i = 0; i < 2; i++) {
      const a = base + (i ? .9 : -.9);
      currentRoom().props.push({
        kind: "ally", allyType: "minion", x: p.x + Math.cos(a) * 44, y: p.y + Math.sin(a) * 44,
        r: 11, life: 10, cd: 0, phase: rand(0, 7), color: "#b8a1ff"
      });
    }
    floater("Духи призваны!", p.x, p.y - 42, "#b8a1ff");
  }
  burst(p.x, p.y, sk.color, 14, 130);
  buzz(25);
}

function nearestEnemy(x, y, maxD = 400) {
  let best = null, bestD = maxD;
  for (const e of currentRoom().props) {
    if (!e.type || e.dead) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/* Cage mercenaries are permanent companions: one instance is kept in the current room. */
function makeMercenary(i, p) {
  const a = -Math.PI / 2 + i * .8;
  return {
    kind: "ally", allyType: "minion", fromCage: true,
    x: clamp(p.x + Math.cos(a) * 52, R.x + 20, R.x + R.w - 20),
    y: clamp(p.y + Math.sin(a) * 52, R.y + 20, R.y + R.h - 20),
    r: 13, life: 1e9, cd: 0, phase: rand(0, 7), facing: a,
    color: SECRET_THEME.accent
  };
}

function syncMercenaries(room) {
  if (!game || !game.grid || !room) return;
  for (const row of game.grid) {
    if (!row) continue;
    for (const r of row) {
      if (!r || !r.props || r === room) continue;
      r.props = r.props.filter(o => !(o.kind === "ally" && o.fromCage));
    }
  }
  room.props = (room.props || []).filter(o => !(o.kind === "ally" && o.fromCage));
  for (let i = 0; i < game.mercenaries.length; i++) room.props.push(makeMercenary(i, game.player));
}

function updateAllies(dt) {
  const props = currentRoom().props;
  for (let i = props.length - 1; i >= 0; i--) {
    const a = props[i];
    if (a.kind !== "ally") continue;
    a.life -= dt;
    a.cd = Math.max(0, a.cd - dt);
    if (a.life <= 0) { props.splice(i, 1); continue; }
    const target = nearestEnemy(a.x, a.y, a.allyType === "turret" ? 420 : 600);
    if (a.allyType === "turret") {
      if (target) {
        a.facing = Math.atan2(target.y - a.y, target.x - a.x);
        if (a.cd <= 0) {
          a.cd = .22;
          game.bullets.push({
            owner: "player", x: a.x + Math.cos(a.facing) * 18, y: a.y + Math.sin(a.facing) * 18,
            vx: Math.cos(a.facing) * 540, vy: Math.sin(a.facing) * 540,
            r: 3, damage: 13 * game.player.damageMul * statueDamageMul(), color: "#8ee6ff", life: 1.1, pierce: 0
          });
          sfx("shoot");
        }
      }
    } else if (a.allyType === "minion") {
      a.phase = (a.phase || 0) + dt * 6;
      if (a.fromCage) {
        const p = game.player;
        const follow = dist(a.x, a.y, p.x, p.y);
        // Stay close to the player, but never crowd them.
        if (follow > 150) {
          const d = follow || 1;
          a.x += (p.x - a.x) / d * 210 * dt;
          a.y += (p.y - a.y) / d * 210 * dt;
        }
        if (target) {
          a.facing = Math.atan2(target.y - a.y, target.x - a.x);
          if (a.cd <= 0) {
            a.cd = .55;
            const ang = a.facing;
            game.bullets.push({
              owner: "player",
              x: a.x + Math.cos(ang) * (a.r + 4), y: a.y + Math.sin(ang) * (a.r + 4),
              vx: Math.cos(ang) * 520, vy: Math.sin(ang) * 520,
              r: 4, damage: 12 * game.player.damageMul * statueDamageMul(),
              color: a.color || SECRET_THEME.accent, life: 1.2, pierce: 0
            });
          }
        }
      } else if (target) {
        const d = dist(a.x, a.y, target.x, target.y) || 1;
        a.x += (target.x - a.x) / d * 210 * dt;
        a.y += (target.y - a.y) / d * 210 * dt;
        if (d < target.r + a.r + 6 && a.cd <= 0) {
          a.cd = .55;
          damageEnemy(target, 14 * game.player.damageMul * statueDamageMul(), target.x - a.x, target.y - a.y, true);
          burst(target.x, target.y, "#b8a1ff", 7, 90);
        }
      } else {
        a.x += Math.sin(a.phase) * 40 * dt;
        a.y += Math.cos(a.phase) * 40 * dt;
      }
    }
  }
}

function startReload() {
  const w = currentWeapon();
  if (!w || w.reloadT > 0 || w.ammo >= w.mag || w.reserve <= 0) return;
  const p = game.player;
  w.reloadT = w.reload * (p.reloadMul || 1);
  sfx("reload");
  floater("Перезарядка", game.player.x, game.player.y - 30, "#cfd6ff");
}

function selectWeapon(i) {
  const p = game.player;
  if (i < 0 || i >= p.weapons.length || i === p.wIndex) return;
  p.wIndex = i;
  sfx("reload");
}

function countWeaponCopy(id) {
  if (!game.weaponCopies) game.weaponCopies = {};
  if (!game.player.weapons.some(w => w.id === id && !w.fused)) game.weaponCopies[id] = 0;
  game.weaponCopies[id] = (game.weaponCopies[id] || 0) + 1;
}

function addWeapon(id) {
  const p = game.player;
  if (!WEAPONS[id]) return;
  if (!saveData.seenWeapons[id]) {
    saveData.seenWeapons[id] = true;
    writeSave(saveData);
    if (Object.keys(saveData.seenWeapons).length >= 8) unlockAchievement("arsenal");
  }
  const existing = p.weapons.find(w => w.id === id);
  if (existing) {
    countWeaponCopy(id);
    if (Number.isFinite(existing.reserve)) existing.reserve += existing.mag * 2;
    floater("+Патроны", p.x, p.y - 30, "#ffe27a");
  } else if (p.weapons.length < 4) {
    countWeaponCopy(id);
    p.weapons.push(makeWeapon(id));
    p.wIndex = p.weapons.length - 1;
    floater("Новое оружие: " + WEAPONS[id].name, p.x, p.y - 34, "#ff9de2");
    logEvent("Новое оружие: " + WEAPONS[id].name, "#ff9de2");
  } else {
    /* Never silently destroy a weapon: let the player pick what to replace. */
    pendingWeapon = id;
    weaponChoiceReturn = state === "weaponChoice" ? "playing" : state;
    state = "weaponChoice";
    clearInput();
    sfx("relic");
    return;
  }
  tryMerge(id);
  sfx("pickup");
  refreshSynergies();
}

function weaponChoiceButtons() {
  const p = game && game.player;
  if (!p || !pendingWeapon) return [];
  const out = [];
  for (let i = 0; i < p.weapons.length; i++) {
    out.push({ id: "slot" + i, i, x: 118, y: 236 + i * 58, w: 430, h: 50 });
  }
  out.push({ id: "skip", x: 576, y: 236, w: 216, h: 50 });
  return out;
}

function chooseWeaponSlot(i) {
  if (!game || !pendingWeapon) return;
  const p = game.player;
  if (i < 0 || i >= p.weapons.length) return;
  const id = pendingWeapon;
  countWeaponCopy(id);
  p.weapons[i] = makeWeapon(id);
  p.wIndex = i;
  floater("Новое оружие: " + WEAPONS[id].name, p.x, p.y - 34, "#ff9de2");
  logEvent("Заменён слот " + (i + 1) + ": " + WEAPONS[id].name, "#ff9de2");
  const returnState = weaponChoiceReturn;
  pendingWeapon = null;
  weaponChoiceReturn = "playing";
  state = returnState;
  tryMerge(id);
  refreshSynergies();
  sfx("pickup");
}

function skipWeaponChoice() {
  if (!game || !pendingWeapon) return;
  const name = WEAPONS[pendingWeapon] ? WEAPONS[pendingWeapon].name : "Оружие";
  logEvent("Отказ от оружия: " + name, "rgba(233,230,245,.6)");
  const returnState = weaponChoiceReturn;
  pendingWeapon = null;
  weaponChoiceReturn = "playing";
  state = returnState;
  sfx("buy");
}

function handleWeaponChoiceClick() {
  for (const b of weaponChoiceButtons()) {
    if (inRect(b)) {
      if (b.id === "skip") skipWeaponChoice();
      else chooseWeaponSlot(b.i);
      return true;
    }
  }
  return false;
}

function drawWeaponChoice() {
  ctx.fillStyle = "rgba(5,5,12,.86)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const nw = WEAPONS[pendingWeapon];
  ctx.fillStyle = "#ff9de2";
  ctx.font = "bold 26px 'Segoe UI', sans-serif";
  ctx.fillText("ВСЕ СЛОТЫ ЗАНЯТЫ", W / 2, 118);
  ctx.fillStyle = "rgba(233,230,245,.75)";
  ctx.font = uiFont(13);
  ctx.fillText("Выбери, какое оружие заменить — или оставь текущее", W / 2, 150);

  ctx.fillStyle = "rgba(255,157,226,.12)";
  roundRect(576, 148, 216, 66, 10); ctx.fill();
  ctx.strokeStyle = "#ff9de2"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#ff9de2";
  ctx.font = uiFont(11, true);
  ctx.fillText("НОВОЕ ОРУЖИЕ", W / 2 + 168, 164);
  ctx.fillStyle = "#e9e6f5";
  ctx.font = uiFont(16, true);
  ctx.fillText(nw ? nw.name : "?", W / 2 + 168, 188);

  const p = game.player;
  for (const b of weaponChoiceButtons()) {
    const old = p.weapons[b.i] || { name: "ПУСТОЙ СЛОТ", color: "#e9e6f5", damage: 0, rate: 1 };
    const hovered = inRect(b);
    ctx.fillStyle = hovered ? "rgba(142,230,255,.15)" : "rgba(255,255,255,.06)";
    roundRect(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = hovered ? "#8ee6ff" : "rgba(255,255,255,.16)";
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = "#8ee6ff";
    ctx.font = uiFont(12, true);
    ctx.fillText("СЛОТ " + (b.i + 1) + (b.i === p.wIndex ? " · АКТИВНЫЙ" : ""), b.x + 14, b.y + 16);
    ctx.fillStyle = old.color || "#e9e6f5";
    ctx.font = uiFont(15, true);
    ctx.fillText(old.name, b.x + 14, b.y + 36);
    ctx.fillStyle = "rgba(233,230,245,.55)";
    ctx.font = uiFont(10);
    ctx.fillText("урон " + Math.round(old.damage || 0) + " · темп " + (old.rate || 0).toFixed(2) + " с", b.x + 210, b.y + 36);
  }
  const skip = weaponChoiceButtons().find(b => b.id === "skip");
  ctx.fillStyle = inRect(skip) ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.06)";
  roundRect(skip.x, skip.y, skip.w, skip.h, 9); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#e9e6f5"; ctx.font = uiFont(13, true); ctx.textAlign = "center";
  ctx.fillText("ОСТАВИТЬ КАК ЕСТЬ", skip.x + skip.w / 2, skip.y + skip.h / 2);
  ctx.fillStyle = "rgba(233,230,245,.45)";
  ctx.font = uiFont(11);
  ctx.fillText("Клавиши 1–4 — заменить слот · Esc — оставить", W / 2, 480);
}

function tryMerge(id) {
  const p = game.player;
  const f = FUSIONS[id], base = WEAPONS[id];
  if (!f || !base) return false;
  if ((game.weaponCopies[id] || 0) < 3) return false;
  const target = p.weapons.find(w => w.id === id && !w.fused);
  if (!target) return false;
  game.weaponCopies[id] = 0;
  target.fused = true;
  target.baseId = id;
  target.name = f.name;
  target.color = f.color || base.color;
  for (const key of ["damage", "rate", "speed", "life"]) {
    if (!f[key]) continue;
    if (key === "life") target.life = f.life;
    else if (key === "rate") target.rate = base.rate * f.rate;
    else target[key] = base[key] * f[key];
  }
  target.count = (base.count || 1) + (f.count || 0);
  target.pierce = (base.pierce || 0) + (f.pierce || 0);
  target.chain = (base.chain || 0) + (f.chain || 0);
  target.bounce = (base.bounce || 0) + (f.bounce || 0);
  target.explosive = Math.min(72, (base.explosive || 0) + (f.explosive || 0));
  target.split = f.split || base.split || 0;
  target.slow = Math.max(base.slow || 0, f.slow || 0);
  for (const key of ["homing", "poison", "healOnHit", "shock", "stun", "orbit"]) {
    if (f[key] || base[key]) target[key] = (base[key] || 0) + (f[key] || 0);
  }
  if (f.fire || base.fire) target.fire = true;
  target.energy = (base.energy || 0) * 1.15;
  const curMag = target.mag, curReserve = target.reserve;
  target.mag = Math.max(curMag, Math.round(curMag * 1.3));
  target.ammo = Math.min(target.mag, target.ammo + (target.mag - curMag));
  target.reserve = Number.isFinite(curReserve) ? Math.round(curReserve * 1.3) : curReserve;
  if (p.wIndex >= p.weapons.length) p.wIndex = p.weapons.length - 1;
  if (game.mergedIds.indexOf(id) < 0) game.mergedIds.push(id);
  unlockAchievement("merge");
  logEvent("Слияние: " + f.name, "#ffd76b");
  floater("СЛИЯНИЕ: " + f.name, p.x, p.y - 50, "#ffd76b");
  burst(p.x, p.y, "#ffd76b", 26, 190);
  sfx("buy");
  buzz(45);
  return true;
}

function rollRelicRarity() {
  const f = game ? game.floor : 1;
  const weights = RARITIES.map(r => {
    if (r.id === "common") return Math.max(20, r.weight - (f - 1) * 7);
    if (r.id === "rare") return r.weight + (f - 1) * 3;
    if (r.id === "epic") return r.weight + (f - 1) * 3;
    return f >= 4 ? (f - 3) * 2 : 0;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = rng() * total;
  for (let i = 0; i < RARITIES.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return RARITIES[i];
  }
  return RARITIES[0];
}

function buildRelicChoices() {
  const owned = new Set(game.relics.map(r => r.id));
  const used = new Set();
  const banned = new Set(game.banished || []);
  const allowed = new Set(game.floor >= 4 ? ["common", "rare", "epic", "legendary"] : ["common", "rare", "epic"]);
  const choices = [];
  for (let i = 0; i < 3; i++) {
    const rarity = rollRelicRarity();
    let pool = RELICS.filter(r => !owned.has(r.id) && !used.has(r.id) && !banned.has(r.id) && r.rarity === rarity.id && allowed.has(r.rarity));
    if (!pool.length) pool = RELICS.filter(r => !owned.has(r.id) && !used.has(r.id) && !banned.has(r.id) && allowed.has(r.rarity));
    if (!pool.length) break;
    const r = pick(pool);
    used.add(r.id);
    choices.push(r);
  }
  if (choices.length < 3) {
    const stacks = RELICS.filter(r => owned.has(r.id) && !banned.has(r.id) &&
      STACKABLE_RELICS.indexOf(r.id) >= 0 && allowed.has(r.rarity) && !choices.some(c => c.id === r.id));
    while (choices.length < 3 && stacks.length) {
      const idx = randi(0, stacks.length - 1);
      const r = stacks.splice(idx, 1)[0];
      choices.push({ ...r, stack: true });
    }
  }
  return choices;
}

function openReward(room, markTaken = true) {
  if (!game || state === "reward") return;
  const target = room || currentRoom();
  if (markTaken && target.rewardTaken) return;
  if (markTaken) target.rewardTaken = true;
  const choices = buildRelicChoices();
  if (!choices.length) {
    const bonus = 40 + game.floor * 10;
    earnCoins(bonus);
    const p = game.player;
    p.hp = Math.min(p.maxHp, p.hp + 20);
    for (const w of p.weapons) if (Number.isFinite(w.reserve)) w.reserve += w.mag;
    floater("НАГРАДА: +" + bonus + " монет", W / 2, R.y + 96, "#ffe27a");
    return;
  }
  rewardChoices = choices;
  rewardBanished = false;
  state = "reward";
  clearInput();
  sfx("relic");
  buzz(25);
}

function banishRelic(i) {

  game.coins -= price;
  if (!game.banished) game.banished = [];
  game.banished.push(rewardChoices[i].id);

function applyStatue(s) {

function applyRelic(r) {
  const p = game.player;
  if (r.kind === "statue") { applyStatue(r); return; }
  switch (r.id) {
    case "vital":  p.maxHp += 30; p.hp += 30; break;
    case "rapid":  p.fireRate *= .82; break;
    case "power":  p.damageMul *= 1.2; break;
    case "vamp":   p.lifesteal += 3; break;
    case "boots":  p.speed *= 1.12; break;
    case "crit":   p.critChance += .12; break;
    case "armor":  p.armor = Math.max(.5, p.armor * .85); break;
    case "wind":   p.dashCdMax *= .75; break;
    case "ammo":
      p.magBonus += .25;
      for (const w of p.weapons) {
        if (Number.isFinite(w.reserve)) w.reserve = Math.round(w.reserve * 1.25);
        const oldMag = w.mag;
        w.mag = Math.round(w.mag * 1.25);
        w.ammo += w.mag - oldMag;
      }
      break;
    case "magnet": p.pickupRange += 60; break;
    case "focus":  p.skillCdMax *= .82; p.skillCd = Math.min(p.skillCd, p.skillCdMax); break;
    case "vigor":  p.maxHp += 40; p.hp += 40; p.armor = Math.max(.5, p.armor * .92); break;
    case "chain":  p.chainBonus += 1; break;
    case "execute": p.execute += 1; break;
    case "thorns": p.thorns += .5; break;
    case "aegis":  p.shieldMax += 40; p.shield = p.shieldMax; break;
    case "phoenix": p.phoenix += 1; break;
    case "storm":  p.storm += 1; p.stormTimer = 1.2; break;
    case "battery": p.energyMax += 30; p.energy = p.energyMax; break;
    case "recycler": p.energyOnKill += 6; break;
    case "piercer": game.pierceBonus++; break;
    case "mirror": game.bounceBonus++; break;
    case "warhead": game.explosiveBonus += 14; break;
    case "seeker": game.homingBonus++; break;
    case "haste": p.fireRate *= .92; break;
    case "stoneheart": p.maxHp += 20; p.hp += 20; p.shieldMax += 10; p.shield += 10; break;
    case "hunter": p.coinsOnKill += 2; break;
    case "frostbite": p.slowBonus += .6; break;
    case "venomrelic": p.poisonBonus += 3; break;
    case "quickload": p.reloadMul *= .85; break;
    case "leechrelic": p.lifesteal += 1; break;
    case "regeneration": p.hpRegen += .8; break;
  }
  game.relics.push(r);
}

function applyBuff(b) {

    case "energy": p.energyMax += 25; p.energy = p.energyMax; break;

    case "speed": p.speed *= 1.08; break;
    case "fire": p.fireRate *= .90; break;
    case "damage": p.damageMul *= 1.10; break;
    case "ammo":

      for (const w of p.weapons) {

        const oldMag = w.mag;
        w.mag = Math.round(w.mag * 1.2);
        w.ammo += w.mag - oldMag;
      }
      break;

    case "dash": p.dashCdMax *= .8; break;
    case "skill": p.skillCdMax *= .85; p.skillCd = Math.min(p.skillCd, p.skillCdMax); break;
    case "regen": p.hpRegen += .8; break;
  }
  game.buffs.push(b);
}

function chainFrom(x, y, damage, color, count, exclude) {
  const hit = exclude ? [exclude] : [];
  let fromX = x, fromY = y;
  for (let c = 0; c < count; c++) {
    let best = null, bestD = 150;
    for (const other of currentRoom().props) {
      if (!other.type || other.dead || hit.indexOf(other) >= 0) continue;
      const dd = dist(fromX, fromY, other.x, other.y);
      if (dd < bestD) { bestD = dd; best = other; }
    }
    if (!best) break;
    game.effects.push({ kind: "line", x: fromX, y: fromY, x2: best.x, y2: best.y,
                        color, life: .14, maxLife: .14 });
    damageEnemy(best, damage * .6, best.x - fromX, best.y - fromY, true);
    hit.push(best);
    fromX = best.x; fromY = best.y;
  }
}

function spawnShards(x, y, color, damage, count, chain) {
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2 + rand(-.22, .22);
    game.bullets.push({
      owner: "player", x, y,
      vx: Math.cos(a) * 430, vy: Math.sin(a) * 430,
      r: 3, damage: damage * .55, color,
      life: .55, maxLife: .55, chain: chain || 0, hit: [], shard: true
    });
  }
  burst(x, y, color, 8, 110);
}

function placeMine(x, y, damage, color, split) {
  currentRoom().props.push({
    kind: "mine", x, y, r: 16, arm: .35, life: 15, damage,
    color: color || "#7cff9b", split: split || 0, blink: 0, fromPlayer: true
  });
}

function fireWeapon() {
  const p = game.player;
  if (p.meleeMode) { meleeAttack(); return; }
  const w = currentWeapon();
  if (!w || w.reloadT > 0 || w.cd > 0) return;
  if (w.ammo <= 0) { startReload(); return; }
  const cost = (w.energy || 0) * p.energyCostMul * statueEnergyMul();
  if (p.energy < cost) {
    p.energyRegenT = Math.max(p.energyRegenT, .35);
    if (!p.noEnergyWarn || game.time - p.noEnergyWarn > 1.2) {
      p.noEnergyWarn = game.time;
      floater("НЕТ ЭНЕРГИИ", p.x, p.y - 46, "#8ee6ff");
      sfx("block");
    }
    return;
  }

  p.energy -= cost;
  if (cost > 0) p.energyRegenT = .75;
  w.ammo--;
  w.cd = w.rate * p.fireRate;
  const base = Math.atan2(input.aimY - p.y, input.aimX - p.x);

  if (w.mine) {
    const mx = clamp(p.x + Math.cos(base) * 155, R.x + 40, R.x + R.w - 40);
    const my = clamp(p.y + Math.sin(base) * 155, R.y + 40, R.y + R.h - 40);
    placeMine(mx, my, w.damage * p.damageMul * statueDamageMul(), w.color,
              game.syn.mineField ? 5 : (w.split || 0));
    shockwave(mx, my, 34, w.color);
    burst(mx, my, w.color, 8, 80);
    sfx("shotgun");
    if (w.ammo <= 0) startReload();
    return;
  }

  const life = w.life || (w.boomerang ? 1.7 : 1.5);
  const shot = (a, x, y) => ({
    owner: "player",
    x, y,
    vx: Math.cos(a) * w.speed,
    vy: Math.sin(a) * w.speed,
    r: w.r * (hasStatue("warrior") ? 1.25 : 1),
    damage: w.damage * p.damageMul * statueDamageMul(),
    color: w.color,
    life, maxLife: life,
    pierce: (w.pierce || 0) + game.pierceBonus,
    explosive: (w.explosive || 0) + game.explosiveBonus,
    chain: (w.chain || 0) + (p.chainBonus || 0) + statueChainBonus(),
    bounce: (w.bounce || 0) + game.bounceBonus + (w.id === "grenade" && game.syn.skipGrenade ? 1 : 0),
    boomerang: !!w.boomerang,
    returning: false,
    explodeOnWall: !!w.explosive || game.explosiveBonus > 0,
    fire: !!w.fire || w.id === "flame",
    slow: (w.slow || 0) + p.slowBonus,
    split: w.split || 0,
    homing: (w.homing || 0) + game.homingBonus,
    poison: (w.poison || 0) + p.poisonBonus,
    healOnHit: w.healOnHit || 0,
    shock: w.shock || 0,
    stun: w.stun || 0,
    hit: []
  });

  if (w.orbit) {
    const n = w.orbit;
    for (let i = 0; i < n; i++) {
      const a = base + i / n * Math.PI * 2;
      const b = shot(a, p.x + Math.cos(a) * 66, p.y + Math.sin(a) * 66);
      b.orbit = { angle: a, radius: 66, spin: 3.4, speed: 66 * 3.4 };
      b.life = life;
      b.hit.length = 0;
      game.bullets.push(b);
    }
  } else {
    for (let i = 0; i < w.count; i++) {
      const a = base + rand(-w.spread, w.spread);
      game.bullets.push(shot(a, p.x + Math.cos(base) * 20, p.y + Math.sin(base) * 20));
    }
  }
  burst(p.x + Math.cos(base) * 22, p.y + Math.sin(base) * 22, w.color, 3, 70);
  const heavy = w.id === "rail" || w.id === "sniper" || w.id === "voidgun";
  const mid = w.id === "shotgun" || w.id === "dual" || w.id === "scatter" || !!w.explosive;
  if (settings.shake) shake = Math.max(shake, heavy ? 7 : mid ? 4 : 1.5);
  sfx(mid ? "shotgun" : (w.id === "laser" || w.id === "plasma") ? "laser"
       : heavy ? "rail" : "shoot");
  if (w.ammo <= 0) startReload();
}

function interact() {
  const room = currentRoom();
  const p = game.player;
  const portal = room.props.find(o => o.kind === "portal");
  if (portal && dist(p.x, p.y, portal.x, portal.y) < 86) {
    nextStage();
    return;
  }
  const stairs = room.props.find(o => o.kind === "stairs");
  if (stairs && dist(p.x, p.y, stairs.x, stairs.y) < 82) {
    nextFloor();
    return;
  }
  const cage = room.props.find(o => o.kind === "cage" && !o.opened);
  if (cage && dist(p.x, p.y, cage.x, cage.y) < 86) {
    cage.opened = true;
    if (!game.mercenaries) game.mercenaries = [];
    const joined = game.mercenaries.length < 3;
    if (joined) {
      game.mercenaries.push({ id: "merc" + game.mercenaries.length });
      syncMercenaries(room);
    }
    p.energy = Math.min(p.energyMax, p.energy + 20);
    burst(cage.x, cage.y, SECRET_THEME.accent, 20, 160);
    sfx("buy");
    floater(joined ? "НАЁМНИК ПРИСОЕДИНИЛСЯ" : "МАКСИМУМ НАЁМНИКОВ — 3",
            cage.x, cage.y - 44, SECRET_THEME.accent);
    return;
  }
  const chest = room.props.find(o => o.kind === "chest" && !o.opened);
  if (chest && dist(p.x, p.y, chest.x, chest.y) < 70) {
    if (room.type === "ambush" && !room.armed) {
      chest.opened = true;
      burst(chest.x, chest.y, "#ff6b81", 18, 150);
      spawnAmbush(room);
      return;
    }
    chest.opened = true;
    game.stats.chests++;
    saveData.stats.chests++;
    trackQuest("chests", 1);
    if (saveData.stats.chests >= 10) unlockAchievement("chests");
    writeSave(saveData);
    burst(chest.x, chest.y, "#ffd76b", 22, 180);
    const roll = rng();
    if (roll < .45) {
      addPickup("weapon", chest.x, chest.y - 12, 0, pick(WEAPON_IDS.slice(1)));
    } else if (roll < .72) {
      addPickup("heart", chest.x, chest.y - 12, 30);
      addPickup("coin", chest.x + 30, chest.y, 25);
    } else {
      addPickup("coin", chest.x, chest.y - 10, 55);
    }
    sfx("pickup");
    floater("Сундук открыт!", chest.x, chest.y - 40, "#ffe27a");
    return;
  }
  const crack = room.props.find(o => o.kind === "crack" && !o.used);
  if (crack && dist(p.x, p.y, crack.x, crack.y) < 80) {
    crack.used = true;
    game.secretFound++;
    saveData.stats.secrets++;
    if (saveData.stats.secrets >= 3) unlockAchievement("secret");
    earnGems(6);
    addPickup("weapon", crack.x - 30, crack.y, 0, pick(WEAPON_IDS.slice(1)));
    addPickup("coin", crack.x, crack.y, 40);
    burst(crack.x, crack.y, "#ff9de2", 24, 190);
    sfx("pickup");
    floater("ТАЙНАЯ КОМНАТА!", crack.x, crack.y - 44, "#ff9de2");
    openReward(room);
    return;
  }
  if (room.type === "shop") { clearInput(); state = "shop"; }
}

function handleShopClick() {
  for (const b of shopButtons()) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
      if (b.i === -1) { closeShop(); return; }
      if (b.i === -2) { rerollShop(); return; }
      if (b.i === -3) { buyShopSlot(); return; }
      buyItem(b.i);
      return;
    }
  }
}

function buyItem(i) {
  const room = currentRoom();
  const item = room.shopItems[i];
  if (!item) return;
  if (game.coins < item.price) {
    floater("Не хватает монет", W / 2, R.y + 50, "#ff6b81");
    tone(160, .12, "square", .03, 100);
    return;
  }
  game.coins -= item.price;
  const p = game.player;
  switch (item.id) {
    case "heal":  p.hp = Math.min(p.maxHp, p.hp + 40); break;
    case "maxhp": p.maxHp += 25; p.hp += 25; break;
    case "armor": p.armor = Math.max(.5, p.armor * .85); break;
    case "ammo":
      for (const w of p.weapons) if (Number.isFinite(w.reserve)) w.reserve += 40;
      p.energy = Math.min(p.energyMax, p.energy + 20);
      break;
    case "energy":
      p.energyMax += 25; p.energy = p.energyMax;
      break;
    case "dash": p.dashCdMax = Math.max(.55, p.dashCdMax - .2); break;
    default:
      if (WEAPON_IDS.indexOf(item.id) >= 0) addWeapon(item.id);
  }
  room.shopItems.splice(i, 1);
  sfx("buy");
  floater("Куплено: " + item.title, W / 2, R.y + 50, "#7cff9b");
}

/* ---------- update ---------- */
function update(dt) {
  if (!game) return;
  const active = state === "playing";
  if (active) game.time += dt;
  if (game.transition > 0) game.transition -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  shakeX = settings.shake && shake ? rand(-shake, shake) : 0;
  shakeY = settings.shake && shake ? rand(-shake, shake) : 0;
  for (const o of currentRoom().props) {
    if (o.kind && o.flash > 0) o.flash = Math.max(0, o.flash - dt);
  }

  if (active && game.victoryTimer > 0) {
    game.victoryTimer -= dt;
    if (game.victoryTimer <= 0) {
      finishRun(true);
      state = "victory";
    }
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= .94; p.vy *= .94;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.effects.length - 1; i >= 0; i--) {
    const f = game.effects[i];
    f.life -= dt;
    if (f.kind !== "slash") f.r = f.maxR * (1 - clamp(f.life / f.maxLife, 0, 1));
