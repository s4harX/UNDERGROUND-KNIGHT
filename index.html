    position: fixed;

    z-index: 20;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    background: rgba(9,9,16,.94);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
  }
  @media (pointer: coarse) {
    html, body { padding: 0; overflow: hidden; background: #090910; }
    #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas {

      height: auto;
      max-height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (orientation: portrait) {

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function dailyKey() {
  const d = new Date();

}

function dailyQuests() {
  const r = mulberry32(hashString("quests-" + dailyKey()));
  const pool = QUEST_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 3);
}

  const daily = ensureDaily();
  const quest = dailyQuests().find(q => q.metric === metric && daily.claimed.indexOf(q.id) < 0);
  if (!quest) return;
  daily.progress[metric] = Math.min(quest.target, (daily.progress[metric] || 0) + amount);

/* ---------- helpers ---------- */
let rng = Math.random;
let runSeed = 0;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const rand = (a, b) => a + rng() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const segmentDist = (px, py, ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  if (!l2) return dist(px, py, ax, ay);
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return dist(px, py, ax + t * dx, ay + t * dy);
};
const hexA = (hex, a) => {
  const n = parseInt(String(hex).replace("#", ""), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
const chance = p => rng() < p;
const pick = arr => arr[randi(0, arr.length - 1)];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randi(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function floorData(n) {
  return FLOORS[clamp((n || 1) - 1, 0, FLOORS.length - 1)];
}
function roomTheme(room) {

}
function floorSeed(base, n) {
  return ((base ^ Math.imul(n + 1, 0x9E3779B1)) >>> 0) || 1;
}
function withRng(seed, fn) {
  const prev = rng;
  rng = mulberry32(seed >>> 0);
  try { return fn(); } finally { rng = prev; }
}

function getMoveVector() {
  let x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let y = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (touch.moveId !== null) { x = touch.moveVec.x; y = touch.moveVec.y; }
  return { x, y };
}

function angleDelta(a, b) {
  return Math.abs(((a - b + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
}

function autoAimPoint(rawX, rawY) {
  if (!game || settings.autoAim === false || state !== "playing") return { x: rawX, y: rawY, target: null };
  const p = game.player;
  const rawDist = Math.hypot(rawX - p.x, rawY - p.y);
  const rawAngle = Math.atan2(rawY - p.y, rawX - p.x);
  const maxCone = isTouch ? .8 : .38;
  let best = null, bestScore = Infinity;
  for (const e of currentRoom().props) {
    if (!e.type || e.dead) continue;
    const d = dist(p.x, p.y, e.x, e.y);
    if (d > 620) continue;
    let diff = rawDist < 50 ? 0 : angleDelta(Math.atan2(e.y - p.y, e.x - p.x), rawAngle);
    if (diff > maxCone) continue;
    let score = d + diff * 260;
    if (e === game.aimTarget) score *= .75;
    if (score < bestScore) { bestScore = score; best = e; }
  }
  game.aimTarget = best;
  return best ? { x: best.x, y: best.y, target: best } : { x: rawX, y: rawY, target: null };
}

function readInput() {
  const mv = getMoveVector();
  input.moveX = mv.x;
  input.moveY = mv.y;
  const rawX = touch.aimId !== null ? touch.aimPoint.x : mouse.x;
  const rawY = touch.aimId !== null ? touch.aimPoint.y : mouse.y;
  const aimed = autoAimPoint(rawX, rawY);
  input.aimX = aimed.x;
  input.aimY = aimed.y;

function ensureAudio() {

  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}

function applyVolume() {

function tone(freq, dur, type = "square", vol = .035, endFreq = 0) {
  if (!audioCtx || !masterGain) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + dur);
  } catch (_) {}
}

function musicNote(freq, when, dur, vol, type = "triangle") {
  if (!audioCtx || !masterGain) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + .02);
    g.gain.exponentialRampToValueAtTime(.0001, when + dur);
    o.connect(g); g.connect(masterGain);
    o.start(when); o.stop(when + dur + .02);
  } catch (_) {}
}

function updateMusic() {
  if (!audioCtx || audioCtx.state !== "running" || settings.volume <= 0) return;
  const boss = !!(game && state === "playing" && currentRoom().type === "boss");
  const beat = boss ? .145 : .225;
  const now = audioCtx.currentTime;
  if (musicNextTime < now) musicNextTime = now + .05;
  let guard = 0;
  while (musicNextTime < now + .25 && guard++ < 8) {
    const s = musicStep % 16;
    const scale = [0, 3, 5, 7, 10, 12, 10, 7, 5, 3, 0, 3, 5, 7, 10, 12];
    const root = floorData(game ? game.floor : 1).musicRoot * (boss ? .75 : 1);
    const f = root * Math.pow(2, scale[s] / 12);
    musicNote(f, musicNextTime, beat * .72, boss ? .026 : .017, boss ? "sawtooth" : "triangle");
    if (s % 4 === 0) musicNote(root / 2, musicNextTime, beat * 1.8, .03, "sine");
    if (boss && s % 2 === 1) musicNote(f * 2, musicNextTime, beat * .35, .011, "square");
    musicNextTime += beat;
    musicStep++;
  }
}

function sfx(name) {
  switch (name) {
    case "shoot":   tone(420, .06, "square", .025, 190); break;
    case "shotgun": tone(180, .12, "sawtooth", .035, 70); break;
    case "laser":   tone(880, .05, "sine", .025, 1300); break;
    case "rail":    tone(220, .18, "sawtooth", .04, 1200); break;
    case "reload":  tone(300, .07, "triangle", .025, 480); break;
    case "hurt":    tone(150, .18, "sawtooth", .05, 60); break;
    case "pickup":  tone(680, .09, "sine", .035, 1050); break;
    case "coin":    tone(920, .06, "triangle", .028, 1350); break;
    case "dash":    tone(320, .1, "sine", .025, 620); break;
    case "clear":   tone(520, .16, "triangle", .035, 880); break;
    case "buy":     tone(600, .12, "triangle", .035, 900); break;
    case "boss":    tone(110, .5, "sawtooth", .05, 70); break;
    case "relic":   tone(520, .22, "sine", .04, 1040); break;
    case "trap":    tone(140, .12, "sawtooth", .03, 80); break;
    case "block":   tone(240, .09, "square", .03, 420); break;
  }
}

/* ---------- world ---------- */
const SIZE = 5;

function makeRoom(x, y, type, floor = 1) {
  return {
    x, y, type,
    theme: floorData(floor).id,
    seed: randi(1, 999999),
    visited: false,
    spawned: false,
    cleared: type !== "combat" && type !== "boss" && type !== "arena" && type !== "mini" && type !== "secret",
    wave: 0,
    maxWaves: 3,
    doors: {},
    pickups: [],
    props: [],
    shopItems: []
  };
}

function generateWorld(floor = 1, mode = "normal") {
  const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  const sx = 2, sy = 2;
  grid[sy][sx] = makeRoom(sx, sy, "start", floor);

  const cells = [{ x: sx, y: sy }];
  let attempts = 0;
  while (cells.length < 16 && attempts < 600) {
    attempts++;
    const c = pick(cells);
    const dirs = shuffle(Object.keys(DIRS));
    let placed = false;
    for (const d of dirs) {
      const nx = c.x + DIRS[d].dx, ny = c.y + DIRS[d].dy;
      if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || grid[ny][nx]) continue;
      const roll = rng();
      const type = roll < .12 ? "treasure" : roll < .22 ? "shop"
                 : roll < .33 ? "arena" : roll < .39 ? "mini" : "combat";
      grid[ny][nx] = makeRoom(nx, ny, type, floor);
      cells.push({ x: nx, y: ny });
      placed = true;
      break;
    }
    if (!placed) continue;
  }

  let boss = cells[0], best = -1;
  for (const c of cells) {
    if (c.x === sx && c.y === sy) continue;
    const d = Math.abs(c.x - sx) + Math.abs(c.y - sy);
    if (d > best) { best = d; boss = c; }
  }
  grid[boss.y][boss.x].type = "boss";

  const ensureType = type => {
    if (cells.some(c => grid[c.y][c.x].type === type)) return;
    const candidates = cells.filter(c =>
      !(c.x === sx && c.y === sy) && !(c.x === boss.x && c.y === boss.y) &&
      grid[c.y][c.x].type === "combat"
    );
    if (candidates.length) {
      const c = pick(candidates);
      grid[c.y][c.x].type = type;
      grid[c.y][c.x].cleared = type !== "arena";
    }
  };
  ensureType("shop");
  ensureType("treasure");
  ensureType("arena");
  ensureType("mini");

  const secretPool = cells.filter(c =>
    grid[c.y][c.x].type === "combat" && !(c.x === sx && c.y === sy)
  );
  if (secretPool.length) {
    const sc = pick(secretPool);
    grid[sc.y][sc.x].secret = true;
  }
  const biomePool = cells.filter(c =>
    grid[c.y][c.x].type === "combat" && !grid[c.y][c.x].secret &&
    !(c.x === sx && c.y === sy) && !(c.x === boss.x && c.y === boss.y)
  );
  if (biomePool.length) {
    const bc = pick(biomePool);
    const room = grid[bc.y][bc.x];
    room.secretBiome = true;
    room.type = "secret";
    room.secret = true;
    room.name = "ПОЛОЕ ДНО";
  }

  if (mode === "bossRush") {
    for (const c of cells) if (c.x !== sx || c.y !== sy) grid[c.y][c.x] = null;
    const start = grid[sy][sx];
    start.type = "boss";
    start.cleared = false;
    return { grid, start: { x: sx, y: sy }, boss: { x: sx, y: sy } };
  }

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const room = grid[y][x];
      if (!room) continue;
      for (const d of Object.keys(DIRS)) {
        const nx = x + DIRS[d].dx, ny = y + DIRS[d].dy;
        if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || !grid[ny][nx]) continue;
        let px, py;
        if (d === "N") { px = R.x + R.w / 2; py = R.y; }
        if (d === "S") { px = R.x + R.w / 2; py = R.y + R.h; }
        if (d === "W") { px = R.x; py = R.y + R.h / 2; }
        if (d === "E") { px = R.x + R.w; py = R.y + R.h / 2; }
        room.doors[d] = { open: room.cleared, x: px, y: py };
      }
    }
  }

  return { grid, start: { x: sx, y: sy }, boss: { x: boss.x, y: boss.y } };
}

function currentRoom() {
  return game.grid[game.cy][game.cx];
}

function refreshDoors(room = currentRoom()) {
  for (const d of Object.keys(room.doors)) room.doors[d].open = room.cleared;
}

function makeWeapon(id) {
  const b = WEAPONS[id];
  const bonus = game && game.player ? game.player.magBonus || 0 : 0;
  const mag = Math.max(1, Math.round(b.mag * (1 + bonus)));
  const reserve = Number.isFinite(b.reserve) ? Math.round(b.reserve * (1 + bonus * .5)) : b.reserve;
  return { id, name: b.name, ...b, mag, reserve, ammo: mag, cd: 0, reloadT: 0 };
}

function makeGame() {
  const c = currentChar();
  const mode = MODES.find(m => m.id === saveData.mode) || MODES[0];
  const mods = saveData.mods.map(id => MODIFIERS.find(m => m.id === id)).filter(Boolean);
  const world = withRng(floorSeed(runSeed, 1), () => generateWorld(1, mode.id));
  let gemMul = mode.gemMul * (1 + upgradeBonus("gem") / 100);
  for (const m of mods) gemMul *= m.gemMul;
  const hp = c.hp + upgradeBonus("hp");
  const startShield = Math.max(15, Math.round(hp * .25));
  return {
    seed: runSeed,
    mode: mode.id,
    mods: mods.map(m => m.id),
    gemMul,
    syn: {},
    synergyIds: [],
    statues: [],
    statuePendingFloor: 0,
    mergedIds: [],
    weaponCopies: {},
    cutBullets: 0,
    floorNoHit: true,
    secretBiomeReady: false,
    aimTarget: null,
    eliteKills: 0,
    miniKills: 0,
    secretFound: 0,
    elitesThisFloor: 0,
    gemsCollected: 0,
    bossStage: 0,
    floor: 1,
    floorRooms: 1,
    grid: world.grid,
    cx: world.start.x,
    cy: world.start.y,
    bossPos: world.boss,
    level: 1,
    coins: 20,
    relics: [],
    bullets: [],
    particles: [],
    effects: [],
    floaters: [],
    flash: 0,
    transition: 0,
    victoryTimer: -1,
    killCount: 0,
    roomCount: 1,
    roomsCleared: 0,
    bossKills: 0,
    roomDamaged: false,
    stats: { kills: 0, coinsEarned: 0, chests: 0, boxes: 0, barrels: 0, bosses: 0 },
    time: 0,
    player: {
      x: R.x + R.w / 2, y: R.y + R.h / 2,
      r: 14,
      color: c.color,
      hp, maxHp: hp,
      armor: c.armor,
      speed: c.speed,
      dashCdMax: c.dashCd,
      dashCd: 0,
      dashTime: 0,
      dashBreak: 0,
      dashVX: 0, dashVY: 0,
      invuln: 0,
      hitFlash: 0,
      skillCd: 0,
      skillCdMax: SKILLS[c.skill].cd * (1 - upgradeBonus("skill") / 100),
      chargeVX: 0, chargeVY: 0, chargeTime: 0, chargeId: 0,
      fireRate: 1,
      damageMul: c.damage * (1 + upgradeBonus("damage") / 100),
      critChance: .05,
      critMul: 2,
      lifesteal: 0,
      pickupRange: 95,
      magBonus: 0,
      chainBonus: 0,
      shield: startShield, shieldMax: startShield, shieldRegenT: 0,
      thorns: 0, execute: 0, phoenix: 0, storm: 0, stormTimer: 3.2,
      energy: 60, energyMax: 60, energyRegenT: 0, energyCostMul: 1, energyOnKill: 0,
      meleeCd: 0, meleeT: 0, meleeAngle: 0, meleeMode: false, meleeCount: 0, meleeReflect: 0,
      weapons: [makeWeapon(c.weapon)],
      wIndex: 0,
      aim: 0
    }
  };
}

/* ---------- obstacles ---------- */
function activeObstacles() {
  return currentRoom().props.filter(o =>
    (o.kind === "box" || o.kind === "barrel" || o.kind === "pillar" || o.kind === "barrier") && !o.dead);
}

function overlapsObstacle(x, y, r) {
  return activeObstacles().some(o => dist(x, y, o.x, o.y) < r + o.r + 6);
}

function spawnObstacles(room, count) {
  for (let i = 0; i < count; i++) {
    let x, y, ok = false;
    for (let tries = 0; tries < 30 && !ok; tries++) {
      x = rand(R.x + 80, R.x + R.w - 80);
      y = rand(R.y + 80, R.y + R.h - 80);
      ok = dist(x, y, R.x + R.w / 2, R.y + R.h / 2) > 170 && !overlapsObstacle(x, y, 34);
    }
    if (!ok) continue;
    const roll = rng();
    const secret = currentRoom().secretBiome;
    const kind = secret
      ? (roll < .45 ? "barrier" : roll < .8 ? "barrel" : "pillar")
      : (roll < .42 ? "box" : roll < .74 ? "barrel" : "pillar");
    const base = {
      kind, x, y,
      r: kind === "pillar" ? 27 : kind === "barrel" ? 22 : kind === "barrier" ? 26 : 24,
      dead: false
    };
    if (kind === "box") {
      base.hp = 24;
      base.color = roomTheme(currentRoom()).accent;
    } else if (kind === "barrel") {
      base.color = secret ? (chance(.5) ? "#9ade7a" : "#b8f0ff")
                          : "#ff8a4d";
      if (secret) base.subtype = base.color === "#9ade7a" ? "toxic" : "frost";
    } else if (kind === "barrier") {
      base.hp = 36;
      base.color = SECRET_THEME.accent;
    }
    room.props.push(base);
  }
}

function resolveObstacles(entity, radius, breaker = false) {
  for (const o of activeObstacles()) {
    const d = dist(entity.x, entity.y, o.x, o.y);
    const min = radius + o.r;
    if (d >= min) continue;
    if (breaker && (o.kind === "box" || o.kind === "barrel" || o.kind === "barrier")) {
      if (o.kind === "barrel") explodeBarrel(o);
      else if (o.kind === "barrier") breakBarrier(o);
      else breakBox(o);
      continue;
    }
    const nx = d > .01 ? (entity.x - o.x) / d : 1;
    const ny = d > .01 ? (entity.y - o.y) / d : 0;
    entity.x = o.x + nx * min;
    entity.y = o.y + ny * min;
  }
}

function breakBox(o) {
  if (o.dead) return;
  o.dead = true;
  game.stats.boxes++;
  saveData.stats.boxes++;
  trackQuest("boxes", 1);
  if (saveData.stats.boxes >= 20) unlockAchievement("boxes");
  writeSave(saveData);
  burst(o.x, o.y, o.color, 16, 170);
  shockwave(o.x, o.y, 58, o.color || "#c8a06a");
  if (chance(.12)) addPickup("coin", o.x, o.y, randi(2, 5));
}

function breakBarrier(o) {
  if (o.dead) return;
  o.dead = true;
  burst(o.x, o.y, o.color || SECRET_THEME.accent, 20, 180);
  shockwave(o.x, o.y, 62, o.color || SECRET_THEME.accent);
  if (chance(.5)) addPickup("energy", o.x, o.y, 6);
  sfx("block");
}

function explodeBarrel(o) {
  if (o.exploded) return;
  o.exploded = true;
  o.dead = true;
  game.stats.barrels++;
  saveData.stats.barrels++;
  trackQuest("barrels", 1);
  if (saveData.stats.barrels >= 15) unlockAchievement("barrels");
  writeSave(saveData);
  const radius = 96;
  const toxic = o.subtype === "toxic", frost = o.subtype === "frost";
  const col = toxic ? "#9ade7a" : frost ? "#b8f0ff" : "#ffb36b";
  burst(o.x, o.y, col, 28, 230);
  shockwave(o.x, o.y, 120, col);
  if (settings.shake) shake = Math.max(shake, 9);
  sfx("shotgun");
  buzz(60);
  const p = game.player;
  if (dist(p.x, p.y, o.x, o.y) < radius) damagePlayer(18 + game.level * 3);
  for (const e of currentRoom().props) {
    if (!e.type || e.dead) continue;
    if (dist(e.x, e.y, o.x, o.y) >= radius) continue;
    damageEnemy(e, 28 + game.level * 4, e.x - o.x, e.y - o.y, true);
    if (toxic) {
      e.slowT = Math.max(e.slowT || 0, 1.8);
      if ((e.poisonT || 0) <= 0) e.poisonTick = .5;
      e.poisonT = Math.max(e.poisonT || 0, 3);
    } else if (frost) {
      e.slowT = Math.max(e.slowT || 0, 3.2);
    }
  }
  if (toxic && dist(p.x, p.y, o.x, o.y) < radius) {
    if ((p.poisonT || 0) <= 0) p.poisonTick = .6;
    p.poisonT = Math.max(p.poisonT || 0, 2.5);
  }
  for (const other of activeObstacles()) {
    if (other === o || dist(other.x, other.y, o.x, o.y) >= radius) continue;
    if (other.kind === "barrel") explodeBarrel(other);
    else if (other.kind === "box") breakBox(other);
    else if (other.kind === "barrier") breakBarrier(other);
  }
}

function damageObstacle(o, amount, vx, vy) {
  if (o.dead) return;
  if (o.kind === "barrel") { explodeBarrel(o); return; }
  if (o.kind === "barrier") {
    o.hp -= amount;
    o.flash = .12;
    burst(o.x, o.y, o.color, 5, 90);
    if (o.hp <= 0) breakBarrier(o);
    return;
  }
  if (o.kind !== "box") return;
  o.hp -= amount;
  o.flash = .12;
  burst(o.x, o.y, o.color, 5, 90);
  if (o.hp <= 0) breakBox(o);
}

/* ---------- spawning ---------- */
function enemyTypeForRoll(roll) {
  if (game.floor === 2) {
    return roll < .18 ? "grunt" : roll < .32 ? "shooter" : roll < .44 ? "charger"
         : roll < .54 ? "sniper" : roll < .64 ? "bomber" : roll < .73 ? "shielder"
         : roll < .81 ? "splitter" : roll < .88 ? "turret" : roll < .95 ? "laser" : "miner";
  }
  if (game.floor === 3) {
    return roll < .12 ? "grunt" : roll < .25 ? "shooter" : roll < .36 ? "charger"
         : roll < .46 ? "sniper" : roll < .55 ? "bomber" : roll < .65 ? "shielder"
         : roll < .74 ? "splitter" : roll < .82 ? "turret" : roll < .89 ? "laser"
         : roll < .95 ? "miner" : "phantom";
  }
  if (game.floor >= 4) {
    return roll < .10 ? "grunt" : roll < .21 ? "shooter" : roll < .31 ? "charger"
         : roll < .41 ? "sniper" : roll < .50 ? "bomber" : roll < .60 ? "shielder"
         : roll < .69 ? "splitter" : roll < .77 ? "turret" : roll < .85 ? "laser"
         : roll < .93 ? "miner" : "phantom";
  }
  return roll < .30 ? "grunt" : roll < .48 ? "shooter" : roll < .63 ? "charger"
       : roll < .74 ? "sniper" : roll < .83 ? "bomber" : roll < .90 ? "turret"
       : roll < .96 ? "miner" : "splitter";
}

function arenaSpawnPoint() {
  for (let i = 0; i < 40; i++) {
    const p = randomSpawnPoint(90);
    if (dist(p.x, p.y, game.player.x, game.player.y) > 150) return p;
  }
  return randomSpawnPoint(90);
}

function spawnArenaWave(room) {
  const n = 3 + room.wave * 2;
  const elite = room.wave === 1 && game.elitesThisFloor < 2 && chance(.7);
  for (let i = 0; i < n; i++) {
    const p = arenaSpawnPoint();
    room.props.push(makeEnemy(enemyTypeForRoll(rng()), p.x, p.y, elite && i === 0));
  }
  if (elite) game.elitesThisFloor++;
  if (room.wave >= 1) {
    const p = arenaSpawnPoint();
    room.props.push({
      kind: "trap", x: p.x, y: p.y, r: 26,
      damage: 8 + game.level * 2,
      color: floorData(game.floor).trap,
      timer: rand(1, 1.8), active: 0
    });
  }
  floater("ВОЛНА " + (room.wave + 1) + " / " + room.maxWaves, W / 2, R.y + 90, "#ffb36b");
  sfx("clear");
}

function spawnRoom(room) {
  if (room.type === "combat") {
    spawnObstacles(room, 2 + randi(0, 2) + (game.level > 4 ? 1 : 0));
    const n = 3 + Math.min(4, Math.floor(game.level * .8)) + randi(0, 2);
    const elite = game.elitesThisFloor === 0 && game.floorRooms > 1 && chance(.75);
    for (let i = 0; i < n; i++) {
      const p = randomSpawnPoint(90);
      room.props.push(makeEnemy(enemyTypeForRoll(rng()), p.x, p.y, elite && i === 0));
    }
    if (elite) game.elitesThisFloor++;
    const trapCount = game.level > 1 && chance(.55) ? randi(2, 4) : 0;
    for (let i = 0; i < trapCount; i++) {
      const p = randomSpawnPoint(110);
      room.props.push({
        kind: "trap", x: p.x, y: p.y, r: 26,
        damage: 8 + game.level * 2,
        color: floorData(game.floor).trap,
        timer: rand(.8, 1.6), active: 0
      });
    }
    if (room.secret) {
      room.props.push({
        kind: "crack", x: R.x + R.w - 26, y: R.y + R.h / 2,
        r: 20, used: false
      });
    }
    room.cleared = false;
  } else if (room.type === "arena") {
    spawnObstacles(room, 2 + randi(0, 1));
    room.wave = 0;
    spawnArenaWave(room);
    room.cleared = false;
  } else if (room.type === "mini") {
    spawnObstacles(room, 1 + randi(0, 1));
    const e = makeEnemy(pick(["shooter", "charger", "turret", "laser", "phantom"]),
                        R.x + R.w / 2, R.y + 140, true);
    e.mini = true;
    e.maxHp = e.hp = Math.round(e.hp * 2.2);
    e.color = "#ffd76b";
    e.contact = Math.round(e.contact * 1.1);
    room.props.push(e);
    room.cleared = false;
    floater("КОМНАТА ИСПЫТАНИЯ", W / 2, R.y + 90, "#ffd76b");
  } else if (room.type === "boss") {
    spawnObstacles(room, 2 + randi(0, 2));
    room.props.push(makeEnemy("boss", R.x + R.w / 2, R.y + 130));
    room.cleared = false;
    sfx("boss");
  } else if (room.type === "secret") {
    spawnObstacles(room, 3 + randi(0, 2));
    for (let i = 0; i < 3; i++) {
      const pt = randomSpawnPoint(100);
      room.props.push({
        kind: "barrel", subtype: i % 2 ? "toxic" : "frost",
        x: pt.x, y: pt.y, r: 22, dead: false,
        color: i % 2 ? "#9ade7a" : "#b8f0ff"
      });
    }
    const cage = randomSpawnPoint(130);
    room.props.push({ kind: "cage", x: cage.x, y: cage.y, r: 30, opened: false });
    const n = 4 + game.floor + randi(0, 2);
    for (let i = 0; i < n; i++) {
      const pt = randomSpawnPoint(110);
      room.props.push(makeEnemy(pick(["phantom", "bomber", "charger", "shooter"]), pt.x, pt.y));
    }
    room.cleared = false;
    floater("СКРЫТЫЙ БИОМ · ПОЛОЕ ДНО", W / 2, R.y + 90, SECRET_THEME.accent);
    sfx("boss");
  } else if (room.type === "treasure") {
    room.props.push({ kind: "chest", x: R.x + R.w / 2, y: R.y + R.h / 2, opened: false });
    room.cleared = true;
  } else if (room.type === "shop") {
    const pool = shuffle(SHOP_POOL.slice()).slice(0, 3);
    room.shopItems = pool.map(it => ({ ...it }));
    room.props.push({ kind: "merchant", x: R.x + R.w / 2, y: R.y + 118, r: 24 });
    room.cleared = true;
  } else {
    room.cleared = true;
  }
  refreshDoors(room);
}

function randomSpawnPoint(minFromCenter = 70) {
  for (let i = 0; i < 40; i++) {
    const x = rand(R.x + 55, R.x + R.w - 55);
    const y = rand(R.y + 55, R.y + R.h - 55);
    if (dist(x, y, R.x + R.w / 2, R.y + R.h / 2) > minFromCenter && !overlapsObstacle(x, y, 20)) {
      return { x, y };
    }
  }
  return { x: R.x + 90, y: R.y + 90 };
}

function makeEnemy(type, x, y, elite = false) {
  const lv = game.level;
  const base = {
    type, x, y,
    vx: 0, vy: 0,
    flash: 0,
    dead: false,
    r: 14,
    contact: 9 + lv,
    hp: 20, maxHp: 20,
    speed: 70,
    color: "#e06a6a",
    timer: rand(.4, 1.4),
    angle: 0,
    telegraph: 0,
    telegraphMax: 0,
    aimAngle: 0,
    facing: 0,
    exploded: false
  };
  if (type === "grunt") {
    base.hp = base.maxHp = 22 + lv * 6;
    base.speed = 76 + lv * 2;
    base.color = "#e56b6b";
  } else if (type === "shooter") {
    base.hp = base.maxHp = 17 + lv * 5;
    base.speed = 58;
    base.r = 13;
    base.color = "#d78ce8";
    base.timer = rand(.7, 1.6);
  } else if (type === "charger") {
    base.hp = base.maxHp = 36 + lv * 9;
    base.speed = 42;
    base.r = 17;
    base.color = "#e8a04a";
    base.state = "idle";
    base.timer = rand(1, 1.8);
    base.dx = 0; base.dy = 0;
  } else if (type === "sniper") {
    base.hp = base.maxHp = 16 + lv * 4;
    base.speed = 34;
    base.r = 12;
    base.color = "#ff7ce5";
    base.contact = 7 + lv;
    base.timer = rand(1.4, 2.4);
  } else if (type === "bomber") {
    base.hp = base.maxHp = 26 + lv * 6;
    base.speed = 96 + lv * 2;
    base.r = 15;
    base.color = "#ffb36b";
    base.contact = 6 + lv;
    base.timer = .55;
  } else if (type === "shielder") {
    base.hp = base.maxHp = 46 + lv * 12;
    base.speed = 44;
    base.r = 19;
    base.color = "#9a86e0";
    base.contact = 11 + lv;
    base.timer = rand(2.2, 3.2);
    base.state = "idle";
  } else if (type === "splitter") {
    base.hp = base.maxHp = 30 + lv * 8;
    base.speed = 66;
    base.r = 17;
    base.color = "#7cff9b";
    base.contact = 8 + lv;
    base.phase = rand(0, Math.PI * 2);
  } else if (type === "spawnling") {
    base.hp = base.maxHp = 10 + lv * 3;
    base.speed = 112;
    base.r = 9;
    base.color = "#b6ffc4";
    base.contact = 5 + lv;
    base.phase = rand(0, Math.PI * 2);
  } else if (type === "turret") {
    base.hp = base.maxHp = 44 + lv * 11;
    base.speed = 0;
    base.r = 18;
    base.color = "#ffd76b";
    base.contact = 8 + lv;
    base.timer = rand(1, 1.8);
    base.state = "idle";
  } else if (type === "laser") {
    base.hp = base.maxHp = 30 + lv * 8;
    base.speed = 52;
    base.r = 14;
    base.color = "#ff6b81";
    base.contact = 8 + lv;
    base.timer = rand(1.6, 2.6);
    base.beam = 0;
    base.beamHitCd = 0;
  } else if (type === "miner") {
    base.hp = base.maxHp = 32 + lv * 8;
    base.speed = 62;
    base.r = 15;
    base.color = "#c8a06a";
    base.contact = 7 + lv;
    base.timer = rand(1.2, 2);
  } else if (type === "phantom") {
    base.hp = base.maxHp = 26 + lv * 7;
    base.speed = 70;
    base.r = 13;
    base.color = "#b8a1ff";
    base.contact = 9 + lv;
    base.timer = rand(1.4, 2.4);
    base.phase = rand(0, Math.PI * 2);
  } else if (type === "boss") {
    const theme = floorData(game.floor);
    base.bossType = theme.boss;
    base.color = theme.accent;
    base.timer = 1.4;
    base.pattern = 0;
    base.nextPattern = 0;
    base.enraged = false;
    if (base.bossType === "frost") {
      base.hp = base.maxHp = 210 + lv * 36;
      base.speed = 42;
      base.r = 30;
      base.contact = 16 + lv * 2;
    } else if (base.bossType === "magma") {
      base.hp = base.maxHp = 250 + lv * 42;
      base.speed = 55;
      base.r = 33;
      base.contact = 22 + lv * 2;
    } else if (base.bossType === "swamp") {
      base.hp = base.maxHp = 230 + lv * 38;
      base.speed = 46;
      base.r = 32;
      base.contact = 18 + lv * 2;
    } else if (base.bossType === "void") {
      base.hp = base.maxHp = 260 + lv * 44;
      base.speed = 52;
      base.r = 32;
      base.contact = 20 + lv * 2;
    } else {
      base.hp = base.maxHp = 130 + lv * 26;
      base.speed = 48;
      base.r = 31;
      base.contact = 18 + lv * 2;
    }
    const power = playerPower();
    const hpMult = clamp(.85 + (power - 1) * .16, .85, 2.2);
    base.maxHp = base.hp = Math.round(base.hp * hpMult);
    base.contact = Math.round(base.contact * clamp(1 + (power - 1) * .12, 1, 1.4));
    base.damageScale = clamp(1 + (power - 1) * .12, 1, 1.4);
    base.hpMult = hpMult;
    base.frenzied = false;
  }
  if (game.mods.indexOf("fast") >= 0) base.speed *= 1.25;
  if (elite && type !== "boss") {
    base.elite = true;
    base.maxHp = base.hp = Math.round(base.hp * 2);
    base.contact = Math.round(base.contact * 1.25);
    base.speed *= 1.08;
    base.r = Math.round(base.r * 1.15);
    if (base.timer) base.timer *= .8;
  }
  return base;
}

function addPickup(kind, x, y, value, weaponId) {
  if (game && game.mods.indexOf("scarce") >= 0 && Number.isFinite(value)) {
    if (kind === "heart") value = Math.max(1, Math.round(value * .5));
    else if (kind === "ammo") value = Math.max(1, Math.round(value * .75));
  }
  currentRoom().pickups.push({ kind, x, y, value, weaponId, bob: rand(0, Math.PI * 2), life: 18 });
}

function shockwave(x, y, maxR, color) {
  game.effects.push({ x, y, r: 8, maxR, life: .42, maxLife: .42, color });
  game.flash = Math.max(game.flash, .22);
}

function explodeAt(x, y, radius, damage, color, skip) {
  burst(x, y, color, 22, 210);
  shockwave(x, y, radius + 24, color);
  if (settings.shake) shake = Math.max(shake, 6);
  sfx("shotgun");
  for (const e of currentRoom().props) {
    if (!e.type || e.dead || e === skip) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < radius + e.r) {
      const falloff = 1 - d / (radius + e.r) * .45;
      damageEnemy(e, damage * falloff, e.x - x, e.y - y, true);
    }
  }
  for (const o of activeObstacles()) {
    if ((o.kind === "box" || o.kind === "barrel") && dist(x, y, o.x, o.y) < radius + o.r) {
      if (o.kind === "barrel") explodeBarrel(o);
      else damageObstacle(o, damage, o.x - x, o.y - y);
    }
  }
  if (game.syn && game.syn.napalm) {
    currentRoom().props.push({
      kind: "fire", x, y, r: radius * .85, life: 2.6,
      damage: Math.max(5, Math.round(damage * .14)), tick: 0
    });
  }
}

function burst(x, y, color, count = 10, power = 140) {
  if (!settings.particles) return;
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), s = rand(power * .3, power);
    game.particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(.25, .6), maxLife: .6,
      color, size: rand(2, 5)
    });
  }
}

function floater(text, x, y, color = "#ffffff") {
  if (!game) return;
  game.floaters.push({ text, x, y, life: 1, color });
}

function checkFloorAchievements() {
  if (!game) return;
  if (game.floor >= 2) unlockAchievement("floor2");
  if (game.floor >= 3) unlockAchievement("floor3");
  if (game.floor >= 4) unlockAchievement("floor4");
  if (game.floor >= 5) unlockAchievement("floor5");
}

function earnCoins(n) {
  game.coins += n;
  game.stats.coinsEarned += n;
  saveData.stats.coinsEarned += n;
  if (saveData.stats.coinsEarned >= 500) unlockAchievement("rich");
  trackQuest("coins", n);
  writeSave(saveData);
}

function earnGems(n) {
  if (!n) return;
  const amount = game ? Math.max(1, Math.round(n * game.gemMul)) : n;
  saveData.gems += amount;
  saveData.gemsEarned += amount;
  if (game) game.gemsCollected = (game.gemsCollected || 0) + amount;
  if (saveData.gemsEarned >= 100) unlockAchievement("gems");
  writeSave(saveData);
  if (game) floater("+" + amount + " самоцвет", game.player.x, game.player.y - 56, "#ff9de2");
}

function charUnlocked(id) {
  return saveData.unlockedChars.indexOf(id) >= 0;
}

function unlockCharacter(id) {
  const c = CHARACTERS.find(v => v.id === id);
  if (!c || charUnlocked(id)) return false;
  if (saveData.gems < c.cost) {
    floater("Не хватает самоцветов", W / 2, H - 120, "#ff6b81");
    sfx("hurt");
    return false;
  }
  saveData.gems -= c.cost;
  saveData.unlockedChars.push(id);
  saveData.char = id;
  selectedChar = id;
  writeSave(saveData);
  const bought = CHARACTERS.filter(v => v.cost).filter(v => charUnlocked(v.id)).length;
  if (bought >= 3) unlockAchievement("heroes");
  sfx("buy");
  buzz(40);
  return true;
}

/* ---------- transitions / room logic ---------- */
function startGame(seedOverride) {
  ensureAudio();

  let s = seedOverride != null ? seedOverride : sharedSeed;
  if (!Number.isFinite(s) || s <= 0) s = Math.floor(Math.random() * 999999) + 1;
  runSeed = s >>> 0;
  rng = mulberry32(runSeed);
  try {
    const u = new URL(location.href);
    u.searchParams.set("seed", String(runSeed));
    history.replaceState(null, "", u);
  } catch (_) {}

  game = makeGame();
  refreshSynergies();
  ensureDaily();
  checkFloorAchievements();
  const room = currentRoom();
  room.visited = true;
  room.enterTime = game.time;
  if (room.type === "boss") { spawnRoom(room); room.spawned = true; }
  else room.spawned = true;
  state = "playing";
  shake = 0;
  touch.moveId = null;
  touch.aimId = null;
  touch.moveVec.x = touch.moveVec.y = 0;
  mouse.down = false;
  readInput();
  floater("Сид " + runSeed, W / 2, R.y + 60, "#ffe27a");
}

function finishRun(win) {
  if (!game || game.saved) return;
  game.saved = true;
  saveData.runs = (saveData.runs || 0) + 1;
  saveData.wins = (saveData.wins || 0) + (win ? 1 : 0);
  saveData.bestRooms = Math.max(saveData.bestRooms || 0, game.roomCount);
  saveData.bestFloor = Math.max(saveData.bestFloor || 0, game.floor);
  saveData.bestKills = Math.max(saveData.bestKills || 0, game.killCount);
  saveData.bestCoins = Math.max(saveData.bestCoins || 0, game.coins);
  saveData.lastSeed = game.seed;
  if (win) {
    unlockAchievement("win");
    if (game.mode === "bossRush") {
      unlockAchievement("rush");
      const rt = Math.round(game.time);
      if (!saveData.records.rushBest || rt < saveData.records.rushBest) {
        saveData.records.rushBest = rt;
      }
    }
    if (game.mode === "sprint") {
      const t = Math.round(game.time);
      if (!saveData.records.sprintBest || t < saveData.records.sprintBest) {
        saveData.records.sprintBest = t;
      }
      if (t < 720) unlockAchievement("sprint");
    }
    earnGems(15);
    const t = Math.round(game.time);
    saveData.bestWinTime = saveData.bestWinTime ? Math.min(saveData.bestWinTime, t) : t;
  }
  saveData.records.mostGems = Math.max(saveData.records.mostGems || 0, game.gemsCollected || 0);
  writeSave(saveData);
}

function togglePause() {
  if (state === "playing") state = "paused";
  else if (state === "paused") state = "playing";
  else if (state === "shop") closeShop();
}

function enterRoom(dx, dy) {
  if (game.transition > 0) return;
  const nx = game.cx + dx, ny = game.cy + dy;
  if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || !game.grid[ny][nx]) return;
  game.cx = nx; game.cy = ny;
  game.bullets.length = 0;
  game.roomDamaged = false;
  const room = currentRoom();
  room.visited = true;
  room.enterTime = game.time;
  game.roomCount++;
  game.floorRooms++;
  game.level = (game.floor - 1) * 4 + 1 + Math.floor((game.floorRooms - 1) / 3) + (room.type === "boss" ? 1 : 0);
  if (!room.spawned) {
    spawnRoom(room);
    room.spawned = true;
  }
  refreshDoors(room);

  const p = game.player;
  if (dy === -1) { p.y = R.y + R.h - 36; p.x = clamp(p.x, R.x + 60, R.x + R.w - 60); }
  if (dy === 1)  { p.y = R.y + 36;       p.x = clamp(p.x, R.x + 60, R.x + R.w - 60); }
  if (dx === -1) { p.x = R.x + R.w - 36; p.y = clamp(p.y, R.y + 60, R.y + R.h - 60); }
  if (dx === 1)  { p.x = R.x + 36;       p.y = clamp(p.y, R.y + 60, R.y + R.h - 60); }

  game.transition = .32;
  floater(room.type === "boss" ? floorData(game.floor).bossName.toUpperCase()
          : room.type === "shop" ? "МАГАЗИН"
          : room.type === "treasure" ? "СОКРОВИЩЕ"
          : room.type === "arena" ? "АРЕНА · ВОЛНА 1 / " + room.maxWaves
          : room.type === "mini" ? "ИСПЫТАНИЕ"
          : room.type === "secret" ? "ПОЛОЕ ДНО · СЕКРЕТ"
           : "Комната " + game.floorRooms,
          W / 2, R.y + 58, room.type === "boss" ? floorData(game.floor).accent : "#ffe27a");
}

function nextFloor() {
  if (!game || game.floor >= FLOORS.length) return;
  game.floor++;
  checkFloorAchievements();
  const world = withRng(floorSeed(game.seed, game.floor), () => generateWorld(game.floor, game.mode));
  game.grid = world.grid;
  game.elitesThisFloor = 0;
  game.cx = world.start.x;
  game.cy = world.start.y;
  game.bossPos = world.boss;
  game.floorRooms = 1;
  game.roomDamaged = false;
  game.bullets.length = 0;
  game.particles.length = 0;
  game.floaters.length = 0;
  const room = currentRoom();
  room.visited = true;
  room.enterTime = game.time;
  if (room.type === "boss") { spawnRoom(room); room.spawned = true; }
  else room.spawned = true;
  const p = game.player;
  p.x = R.x + R.w / 2;
  p.y = R.y + R.h / 2;
  p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * .25));
  for (const w of p.weapons) {
    if (Number.isFinite(w.reserve)) w.reserve += w.mag * 2;
  }
  game.transition = .6;
  state = "playing";
  clearInput();
  const theme = floorData(game.floor);
  floater("ЭТАЖ " + game.floor + " · " + theme.name, W / 2, R.y + 60, theme.accent);
  sfx("clear");
  buzz(50);
}

function checkRoomClear() {
  const room = currentRoom();
  if (room.cleared || (room.type !== "combat" && room.type !== "boss" &&
      room.type !== "arena" && room.type !== "mini" && room.type !== "secret")) return;
  if (room.props.some(o => o.type && !o.dead)) return;
  if (room.type === "arena" && room.wave < room.maxWaves - 1) {
    room.wave++;
    const h = randomSpawnPoint(40);
    addPickup("heart", h.x, h.y, 16);
    const a = randomSpawnPoint(40);
    addPickup("ammo", a.x, a.y, 30);
    spawnArenaWave(room);
    return;
  }
  room.cleared = true;
  if (game.player.shieldMax > 0 && game.player.shield < game.player.shieldMax) {
    game.player.shield = game.player.shieldMax;
    floater("Щит восстановлен", game.player.x, game.player.y - 44, "#ffe27a");
  }
  game.roomsCleared++;
  trackQuest("rooms", 1);
  if (!game.roomDamaged) unlockAchievement("noHit");
  if (room.type === "arena") unlockAchievement("arena");
  if (room.secretBiome) {
    game.secretBiomeReady = true;
    unlockAchievement("secretBiome");
    earnGems(4);
    addPickup("energy", R.x + R.w / 2, R.y + R.h / 2, 30);
    floater("БИОМ ОТКРЫТ · +4 самоцвета", W / 2, R.y + 112, SECRET_THEME.accent);
  }
  if (game.mode === "sprint" && game.time - (room.enterTime || 0) < 28) {
    earnGems(1);
    floater("СПРИНТ · +1 самоцвет", W / 2, R.y + 96, "#8ee6ff");
  }
  if (room.secret && room.type === "combat") {
    floater("Трещина в стене! Нажми E", W / 2, R.y + 120, "#ff9de2");
  }
  refreshDoors(room);
  sfx("clear");
  floater(room.type === "arena" ? "АРЕНА ПРОЙДЕНА!"
        : room.type === "mini" ? "ИСПЫТАНИЕ ПРОЙДЕНО!"
        : "Комната зачищена!", W / 2, R.y + 70, "#7cff9b");
  if (room.type === "combat" || room.type === "arena" || room.type === "mini" || room.type === "secret") openReward();

  const rewards = room.type === "boss" || room.type === "arena" ? 5 : randi(1, 3);
  for (let i = 0; i < rewards; i++) {
    const p = randomSpawnPoint(40);
    const roll = rng();
    if (roll < .34) addPickup("heart", p.x, p.y, 18);
    else if (roll < .72) addPickup("coin", p.x, p.y, randi(8, 16));
    else addPickup("ammo", p.x, p.y, 30);
  }
  if (room.type === "boss") {
    addPickup("weapon", R.x + R.w / 2 - 40, R.y + R.h / 2, 0,
              pick(["rail", "grenade", "crossbow", "tesla", "flame", "revolver",
                    "ricochet", "boomerang", "cluster", "frost", "minelayer"]));
    if (game.floor >= FLOORS.length) {
      game.victoryTimer = 1.6;
    } else {
      room.props.push({
        kind: "stairs",
        x: R.x + R.w / 2 + 40,
        y: R.y + R.h / 2,
        r: 30
      });
      floater("Лестница вниз открыта!", R.x + R.w / 2 + 40, R.y + R.h / 2 - 52, "#ffe27a");
      buzz(50);
    }
    if ((game.floor === 2 || game.floor === 4) && game.statuePendingFloor < game.floor) {
      game.statuePendingFloor = game.floor;
      openStatue();
    }
  }
  earnCoins(8 + game.level * 2);
}

/* ---------- actions ---------- */
function currentWeapon() {
  return game.player.weapons[game.player.wIndex];
}

function playerPower() {
  const p = game && game.player;
  if (!p) return 1;
  const w = p.weapons[p.wIndex];
  const dmg = (w ? w.damage * (w.count || 1) : 10) * p.damageMul;
  const rate = w ? w.rate * p.fireRate : .3;
  const dps = dmg / Math.max(.04, rate) * (1 + p.critChance);
  return clamp(dps / 60, .7, 4.5);
}

function tryDash() {
  const p = game.player;
  if (p.dashCd > 0 || p.dashTime > 0) return;
  let { x: dx, y: dy } = getMoveVector();
  if (!dx && !dy) { dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
  const l = Math.hypot(dx, dy) || 1;
  p.dashVX = dx / l * 720;
  p.dashVY = dy / l * 720;
  p.dashTime = .2;
  p.dashBreak = .55;
  p.dashCd = p.dashCdMax * (hasStatue("swift") ? .8 : 1);
  p.invuln = Math.max(p.invuln, .3);
  burst(p.x, p.y, "#9ad8ff", 9, 100);
  sfx("dash");
  buzz(25);
}

function meleeAttack(forcedAngle) {
  if (!game) return;
  const p = game.player;
  if (state !== "playing" || p.meleeCd > 0) return;
  const a = Number.isFinite(forcedAngle)
    ? forcedAngle
    : Math.atan2(input.aimY - p.y, input.aimX - p.x);
  const w = currentWeapon();
  const reach = 68;
  p.meleeCd = .34;
  p.meleeT = .16;
  p.meleeAngle = a;
  game.effects.push({
    kind: "slash", x: p.x, y: p.y, angle: a, r: reach,
    life: .18, maxLife: .18, color: "#e9e6f5"
  });
  let hit = 0;
  for (const e of currentRoom().props) {
    if (e.dead || !e.maxHp || e.hp <= 0) continue;
    const d = dist(p.x, p.y, e.x, e.y);
    if (d > reach + (e.r || 0)) continue;
    if (angleDelta(Math.atan2(e.y - p.y, e.x - p.x), a) > 1.05) continue;
    const dmg = (16 + (w ? w.damage * .8 : 0)) * p.damageMul * statueDamageMul();
    damageEnemy(e, dmg, Math.cos(a), Math.sin(a), true);
    hit++;
  }
  let cut = 0;
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    if (b.owner !== "enemy") continue;
    const d = dist(p.x, p.y, b.x, b.y);
    if (d > reach + b.r) continue;
    if (angleDelta(Math.atan2(b.y - p.y, b.x - p.x), a) > .9) continue;
    if (p.meleeReflect > 0 || hasStatue("warrior")) {
      const speed = Math.hypot(b.vx, b.vy) * 1.15;
      b.owner = "player";
      b.vx = Math.cos(a) * speed;
      b.vy = Math.sin(a) * speed;
      b.damage = (b.damage || 8) * 1.6 * p.damageMul * statueDamageMul();
      b.color = "#ffe27a";
      b.hit = [];
      b.life = Math.max(b.life, 1.4);
    } else {
      game.bullets.splice(i, 1);
    }
    cut++;
  }
  if (cut) {
    game.cutBullets += cut;
    burst(p.x + Math.cos(a) * 40, p.y + Math.sin(a) * 40, "#ffe27a", 8 + cut * 2, 130);
    floater("СРУБЛЕНО " + cut, p.x, p.y - 48, "#ffe27a");
    if (game.cutBullets >= 20) unlockAchievement("blade");
  }
  if (hit) floater("УДАР", p.x, p.y - 36, "#b8a1ff");
  p.meleeCount++;
  sfx(hit || cut ? "block" : "dash");
  buzz(cut ? 30 : 12);
}

function toggleMelee() {
  const p = game.player;
  p.meleeMode = !p.meleeMode;
  floater(p.meleeMode ? "КЛИНОК ВКЛЮЧЁН" : "КЛИНОК ВЫКЛЮЧЕН", p.x, p.y - 54, "#b8a1ff");
  sfx("reload");
}

function useSkill() {
  const p = game.player;
  const char = currentChar();
  const sk = SKILLS[char.skill];
  if (p.skillCd > 0 || state !== "playing") return;
  p.skillCd = p.skillCdMax = sk.cd;
  const base = Math.atan2(input.aimY - p.y, input.aimX - p.x);

  if (char.skill === "wave") {
    explodeAt(p.x, p.y, 130, 34 * p.damageMul * statueDamageMul(), "#9ad8ff");
    for (const e of currentRoom().props) {
      if (!e.type || e.dead) continue;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.x += Math.cos(a) * 46; e.y += Math.sin(a) * 46;
    }
  } else if (char.skill === "volley") {
    for (let i = -4; i <= 4; i++) {
      const a = base + i * .075;
      game.bullets.push({
        owner: "player", x: p.x + Math.cos(a) * 20, y: p.y + Math.sin(a) * 20,
        vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
        r: 4, damage: 11 * p.damageMul * statueDamageMul(), color: "#7cff9b", life: 1.1, pierce: 0
      });
    }
    sfx("shoot");
  } else if (char.skill === "charge") {
    p.chargeId++;
    p.chargeTime = .34;
    p.chargeVX = Math.cos(base) * 620;
    p.chargeVY = Math.sin(base) * 620;
    p.invuln = Math.max(p.invuln, .45);
    sfx("dash");
  } else if (char.skill === "flask") {
    const tx = clamp(input.aimX, R.x + 40, R.x + R.w - 40);
    const ty = clamp(input.aimY, R.y + 40, R.y + R.h - 40);
    explodeAt(tx, ty, 105, 58 * p.damageMul * statueDamageMul(), "#ff9de2");
  } else if (char.skill === "turret") {
    currentRoom().props.push({
      kind: "ally", allyType: "turret", x: p.x + Math.cos(base) * 46, y: p.y + Math.sin(base) * 46,
      r: 16, life: 9, cd: 0, color: "#8ee6ff", facing: base
    });
    floater("Турель развёрнута!", p.x, p.y - 42, "#8ee6ff");
  } else if (char.skill === "minions") {
    for (let i = 0; i < 2; i++) {
      const a = base + (i ? .9 : -.9);
      currentRoom().props.push({
        kind: "ally", allyType: "minion", x: p.x + Math.cos(a) * 44, y: p.y + Math.sin(a) * 44,
        r: 11, life: 10, cd: 0, phase: rand(0, 7), color: "#b8a1ff"
      });
    }
    floater("Духи призваны!", p.x, p.y - 42, "#b8a1ff");
  }
  burst(p.x, p.y, sk.color, 14, 130);
  buzz(25);
}

function nearestEnemy(x, y, maxD = 400) {
  let best = null, bestD = maxD;
  for (const e of currentRoom().props) {
    if (!e.type || e.dead) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function updateAllies(dt) {
  const props = currentRoom().props;
  for (let i = props.length - 1; i >= 0; i--) {
    const a = props[i];
    if (a.kind !== "ally") continue;
    a.life -= dt;
    a.cd = Math.max(0, a.cd - dt);
    if (a.life <= 0) { props.splice(i, 1); continue; }
    const target = nearestEnemy(a.x, a.y, a.allyType === "turret" ? 420 : 600);
    if (a.allyType === "turret") {
      if (target) {
        a.facing = Math.atan2(target.y - a.y, target.x - a.x);
        if (a.cd <= 0) {
          a.cd = .22;
          game.bullets.push({
            owner: "player", x: a.x + Math.cos(a.facing) * 18, y: a.y + Math.sin(a.facing) * 18,
            vx: Math.cos(a.facing) * 540, vy: Math.sin(a.facing) * 540,
            r: 3, damage: 13 * game.player.damageMul * statueDamageMul(), color: "#8ee6ff", life: 1.1, pierce: 0
          });
          sfx("shoot");
        }
      }
    } else if (a.allyType === "minion") {
      a.phase += dt * 6;
      if (target) {
        const d = dist(a.x, a.y, target.x, target.y) || 1;
        a.x += (target.x - a.x) / d * 210 * dt;
        a.y += (target.y - a.y) / d * 210 * dt;
        if (d < target.r + a.r + 6 && a.cd <= 0) {
          a.cd = .55;
          damageEnemy(target, 14 * game.player.damageMul * statueDamageMul(), target.x - a.x, target.y - a.y, true);
          burst(target.x, target.y, "#b8a1ff", 7, 90);
        }
      } else {
        a.x += Math.sin(a.phase) * 40 * dt;
        a.y += Math.cos(a.phase) * 40 * dt;
      }
    }
  }
}

function startReload() {
  const w = currentWeapon();
  if (!w || w.reloadT > 0 || w.ammo >= w.mag || w.reserve <= 0) return;
  w.reloadT = w.reload;
  sfx("reload");
  floater("Перезарядка", game.player.x, game.player.y - 30, "#cfd6ff");
}

function selectWeapon(i) {
  const p = game.player;
  if (i < 0 || i >= p.weapons.length || i === p.wIndex) return;
  p.wIndex = i;
  const w = currentWeapon();
  if (w.reloadT > 0) w.reloadT = 0;
  sfx("reload");
}

function addWeapon(id) {
  const p = game.player;
  if (!saveData.seenWeapons[id]) {
    saveData.seenWeapons[id] = true;
    writeSave(saveData);
    if (Object.keys(saveData.seenWeapons).length >= 8) unlockAchievement("arsenal");
  }
  if (!p.weapons.some(w => w.id === id && !w.fused)) game.weaponCopies[id] = 0;
  game.weaponCopies[id] = (game.weaponCopies[id] || 0) + 1;
  const existing = p.weapons.find(w => w.id === id);
  if (existing) {
    if (Number.isFinite(existing.reserve)) existing.reserve += existing.mag * 2;
    floater("+Патроны", p.x, p.y - 30, "#ffe27a");
  } else if (p.weapons.length < 4) {
    p.weapons.push(makeWeapon(id));
    p.wIndex = p.weapons.length - 1;
    floater("Новое оружие: " + WEAPONS[id].name, p.x, p.y - 34, "#ff9de2");
  } else {
    p.weapons[p.wIndex] = makeWeapon(id);
    floater("Оружие заменено: " + WEAPONS[id].name, p.x, p.y - 34, "#ff9de2");
  }
  tryMerge(id);
  sfx("pickup");
  refreshSynergies();
}

function tryMerge(id) {
  const p = game.player;
  const f = FUSIONS[id], base = WEAPONS[id];
  if (!f || !base) return false;
  if ((game.weaponCopies[id] || 0) < 3) return false;
  const target = p.weapons.find(w => w.id === id && !w.fused);
  if (!target) return false;
  game.weaponCopies[id] = 0;
  target.fused = true;
  target.baseId = id;
  target.name = f.name;
  target.color = f.color || base.color;
  for (const key of ["damage", "rate", "speed", "life"]) {
    if (f[key]) target[key] = key === "rate" ? base.rate * f.rate : base[key] * f[key];
  }
  target.count = (base.count || 1) + (f.count || 0);
  target.pierce = (base.pierce || 0) + (f.pierce || 0);
  target.chain = (base.chain || 0) + (f.chain || 0);
  target.bounce = (base.bounce || 0) + (f.bounce || 0);
  target.explosive = (base.explosive || 0) + (f.explosive || 0);
  target.split = f.split || base.split || 0;
  target.slow = Math.max(base.slow || 0, f.slow || 0);
  target.energy = (base.energy || 0) * 1.15;
  const curMag = target.mag, curReserve = target.reserve;
  target.mag = Math.max(curMag, Math.round(curMag * 1.3));
  target.ammo = Math.min(target.mag, target.ammo + (target.mag - curMag));
  target.reserve = Number.isFinite(curReserve) ? Math.round(curReserve * 1.3) : curReserve;
  if (p.wIndex >= p.weapons.length) p.wIndex = p.weapons.length - 1;
  if (game.mergedIds.indexOf(id) < 0) game.mergedIds.push(id);
  unlockAchievement("merge");
  floater("СЛИЯНИЕ: " + f.name, p.x, p.y - 50, "#ffd76b");
  burst(p.x, p.y, "#ffd76b", 26, 190);
  sfx("buy");
  buzz(45);
  return true;
}

function rollRelicRarity() {
  const f = game ? game.floor : 1;
  const weights = RARITIES.map(r => {
    if (r.id === "common") return Math.max(20, r.weight - (f - 1) * 7);
    if (r.id === "rare") return r.weight + (f - 1) * 3;
    if (r.id === "epic") return r.weight + (f - 1) * 3;
    return f >= 4 ? (f - 3) * 2 : 0;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = rng() * total;
  for (let i = 0; i < RARITIES.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return RARITIES[i];
  }
  return RARITIES[0];
}

function openReward() {
  const owned = new Set(game.relics.map(r => r.id));
  const used = new Set();
  const choices = [];
  for (let i = 0; i < 3; i++) {
    const rarity = rollRelicRarity();
    let pool = RELICS.filter(r => !owned.has(r.id) && !used.has(r.id) && r.rarity === rarity.id);
    if (!pool.length) pool = RELICS.filter(r => !owned.has(r.id) && !used.has(r.id));
    if (!pool.length) break;
    const r = pick(pool);
    used.add(r.id);
    choices.push(r);
  }
  if (!choices.length) return;
  rewardChoices = choices;
  state = "reward";
  clearInput();
  sfx("relic");
  buzz(25);
}

function openStatue() {
  if (!game || state === "reward") return;
  const owned = new Set(game.statues);
  const pool = shuffle(STATUES.filter(s => !owned.has(s.id)));
  const choices = pool.slice(0, 3).map(s => ({ ...s, kind: "statue", rarity: "epic" }));
  if (!choices.length) { openReward(); return; }
  rewardChoices = choices;
  state = "reward";
  clearInput();
  sfx("relic");
  buzz(30);
}

function applyStatue(s) {
  const p = game.player;
  if (game.statues.indexOf(s.id) >= 0) return;
  game.statues.push(s.id);
  if (s.id === "guardian") { p.shieldMax += 35; p.shield = p.shieldMax; }
  floater("СТАТУЯ: " + s.name, p.x, p.y - 56, s.color);
  sfx("buy");
  buzz(40);
}

function applyRelic(r) {
  const p = game.player;
  if (r.kind === "statue") { applyStatue(r); return; }
  switch (r.id) {
    case "vital":  p.maxHp += 30; p.hp += 30; break;
    case "rapid":  p.fireRate *= .82; break;
    case "power":  p.damageMul *= 1.2; break;
    case "vamp":   p.lifesteal += 3; break;
    case "boots":  p.speed *= 1.12; break;
    case "crit":   p.critChance += .12; break;
    case "armor":  p.armor *= .85; break;
    case "wind":   p.dashCdMax *= .75; break;
    case "ammo":
      p.magBonus += .25;
      for (const w of p.weapons) {
        if (Number.isFinite(w.reserve)) w.reserve = Math.round(w.reserve * 1.25);
        const oldMag = w.mag;
        w.mag = Math.round(w.mag * 1.25);
        w.ammo += w.mag - oldMag;
      }
      break;
    case "magnet": p.pickupRange += 60; break;
    case "focus":  p.skillCdMax *= .82; p.skillCd = Math.min(p.skillCd, p.skillCdMax); break;
    case "vigor":  p.maxHp += 40; p.hp += 40; p.armor *= .92; break;
    case "chain":  p.chainBonus += 1; break;
    case "execute": p.execute += 1; break;
    case "thorns": p.thorns += .5; break;
    case "aegis":  p.shieldMax += 40; p.shield = p.shieldMax; break;
    case "phoenix": p.phoenix += 1; break;
    case "storm":  p.storm += 1; p.stormTimer = 1.2; break;
    case "battery": p.energyMax += 30; p.energy = p.energyMax; break;
    case "recycler": p.energyOnKill += 6; break;
  }
  game.relics.push(r);
}

function chooseRelic(i) {
  if (state !== "reward" || !rewardChoices[i]) return;
  const r = rewardChoices[i];
  applyRelic(r);
  floater(r.name + "!", game.player.x, game.player.y - 42, r.color);
  rewardChoices = [];
  state = "playing";
  clearInput();
  sfx("pickup");
  buzz(30);
}

function chainFrom(x, y, damage, color, count, exclude) {
  const hit = exclude ? [exclude] : [];
  let fromX = x, fromY = y;
  for (let c = 0; c < count; c++) {
    let best = null, bestD = 150;
    for (const other of currentRoom().props) {
      if (!other.type || other.dead || hit.indexOf(other) >= 0) continue;
      const dd = dist(x, y, other.x, other.y);
      if (dd < bestD) { bestD = dd; best = other; }
    }
    if (!best) break;
    game.effects.push({ kind: "line", x: fromX, y: fromY, x2: best.x, y2: best.y,
                        color, life: .14, maxLife: .14 });
    damageEnemy(best, damage * .6, best.x - fromX, best.y - fromY, true);
    hit.push(best);
    fromX = best.x; fromY = best.y;
  }
}

function spawnShards(x, y, color, damage, count, chain) {
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2 + rand(-.22, .22);
    game.bullets.push({
      owner: "player", x, y,
      vx: Math.cos(a) * 430, vy: Math.sin(a) * 430,
      r: 3, damage: damage * .55, color,
      life: .55, maxLife: .55, chain: chain || 0, hit: [], shard: true
    });
  }
  burst(x, y, color, 8, 110);
}

function placeMine(x, y, damage, color, split) {
  currentRoom().props.push({
    kind: "mine", x, y, r: 16, arm: .35, life: 15, damage,
    color: color || "#7cff9b", split: split || 0, blink: 0, fromPlayer: true
  });
}

function fireWeapon() {
  const p = game.player;
  if (p.meleeMode) { meleeAttack(); return; }
  const w = currentWeapon();
  if (!w || w.reloadT > 0 || w.cd > 0) return;
  if (w.ammo <= 0) { startReload(); return; }
  const cost = (w.energy || 0) * p.energyCostMul * statueEnergyMul();
  if (p.energy < cost) {
    p.energyRegenT = Math.max(p.energyRegenT, .35);
    if (!p.noEnergyWarn || game.time - p.noEnergyWarn > 1.2) {
      p.noEnergyWarn = game.time;
      floater("НЕТ ЭНЕРГИИ", p.x, p.y - 46, "#8ee6ff");
      sfx("block");
    }
    return;
  }

  p.energy -= cost;
  p.energyRegenT = .75;
  w.ammo--;
  w.cd = w.rate * p.fireRate;
  const base = Math.atan2(input.aimY - p.y, input.aimX - p.x);

  if (w.mine) {
    const mx = clamp(p.x + Math.cos(base) * 155, R.x + 40, R.x + R.w - 40);
    const my = clamp(p.y + Math.sin(base) * 155, R.y + 40, R.y + R.h - 40);
    placeMine(mx, my, w.damage * p.damageMul * statueDamageMul(), w.color,
              game.syn.mineField ? 5 : (w.split || 0));
    shockwave(mx, my, 34, w.color);
    burst(mx, my, w.color, 8, 80);
    sfx("shotgun");
    if (w.ammo <= 0) startReload();
    return;
  }

  const life = w.life || (w.boomerang ? 1.7 : 1.5);
  for (let i = 0; i < w.count; i++) {
    const a = base + rand(-w.spread, w.spread);
    game.bullets.push({
      owner: "player",
      x: p.x + Math.cos(base) * 20,
      y: p.y + Math.sin(base) * 20,
      vx: Math.cos(a) * w.speed,
      vy: Math.sin(a) * w.speed,
      r: w.r * (hasStatue("warrior") ? 1.25 : 1),
      damage: w.damage * p.damageMul * statueDamageMul(),
      color: w.color,
      life, maxLife: life,
      pierce: w.pierce || 0,
      explosive: w.explosive || 0,
      chain: (w.chain || 0) + (p.chainBonus || 0) + statueChainBonus(),
      bounce: w.bounce || (w.id === "grenade" && game.syn.skipGrenade ? 1 : 0),
      boomerang: !!w.boomerang,
      returning: false,
      explodeOnWall: !!w.explosive,
      fire: w.id === "flame",
      slow: w.slow || 0,
      split: w.split || 0,
      hit: []
    });
  }
  burst(p.x + Math.cos(base) * 22, p.y + Math.sin(base) * 22, w.color, 3, 70);
  if (settings.shake) shake = Math.max(shake, w.id === "rail" ? 7 : w.id === "shotgun" ? 4 : 1.5);
  sfx(w.id === "shotgun" ? "shotgun" : w.id === "laser" ? "laser" : w.id === "rail" ? "rail" : "shoot");
  if (w.ammo <= 0) startReload();
}

function interact() {
  const room = currentRoom();
  const p = game.player;
  const stairs = room.props.find(o => o.kind === "stairs");
  if (stairs && dist(p.x, p.y, stairs.x, stairs.y) < 82) {
    nextFloor();
    return;
  }
  const cage = room.props.find(o => o.kind === "cage" && !o.opened);
  if (cage && dist(p.x, p.y, cage.x, cage.y) < 86) {
    cage.opened = true;
    if (room.props.filter(a => a.kind === "ally" && a.fromCage).length < 3) {
      const pos = randomSpawnPoint(60);
      room.props.push({
        kind: "ally", allyType: "minion", x: pos.x, y: pos.y, r: 13,
        life: 999, cd: 0, color: SECRET_THEME.accent, fromCage: true
      });
    }
    p.energy = Math.min(p.energyMax, p.energy + 20);
    burst(cage.x, cage.y, SECRET_THEME.accent, 20, 160);
    sfx("buy");
    floater("НАЁМНИК ПРИСОЕДИНИЛСЯ", cage.x, cage.y - 44, SECRET_THEME.accent);
    return;
  }
  const chest = room.props.find(o => o.kind === "chest" && !o.opened);
  if (chest && dist(p.x, p.y, chest.x, chest.y) < 70) {
    chest.opened = true;
    game.stats.chests++;
    saveData.stats.chests++;
    trackQuest("chests", 1);
    if (saveData.stats.chests >= 10) unlockAchievement("chests");
    writeSave(saveData);
    burst(chest.x, chest.y, "#ffd76b", 22, 180);
    const roll = rng();
    if (roll < .45) {
      addPickup("weapon", chest.x, chest.y - 12, 0, pick(WEAPON_IDS.slice(1)));
    } else if (roll < .72) {
      addPickup("heart", chest.x, chest.y - 12, 30);
      addPickup("coin", chest.x + 30, chest.y, 25);
    } else {
      addPickup("coin", chest.x, chest.y - 10, 55);
    }
    sfx("pickup");
    floater("Сундук открыт!", chest.x, chest.y - 40, "#ffe27a");
    return;
  }
  const crack = room.props.find(o => o.kind === "crack" && !o.used);
  if (crack && dist(p.x, p.y, crack.x, crack.y) < 80) {
    crack.used = true;
    game.secretFound++;
    saveData.stats.secrets++;
    if (saveData.stats.secrets >= 3) unlockAchievement("secret");
    earnGems(6);
    addPickup("weapon", crack.x - 30, crack.y, 0, pick(WEAPON_IDS.slice(1)));
    addPickup("coin", crack.x, crack.y, 40);
    burst(crack.x, crack.y, "#ff9de2", 24, 190);
    sfx("pickup");
    floater("ТАЙНАЯ КОМНАТА!", crack.x, crack.y - 44, "#ff9de2");
    openReward();
    return;
  }
  if (room.type === "shop") state = "shop";
}

function closeShop() { if (state === "shop") state = "playing"; }

function shopButtons() {
  const out = [];
  for (let i = 0; i < 3; i++) out.push({ x: 252, y: 246 + i * 72, w: 456, h: 54, i });
  out.push({ x: 392, y: 470, w: 176, h: 42, i: -1 });
  return out;
}

function handleShopClick() {
  for (const b of shopButtons()) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
      if (b.i === -1) { closeShop(); return; }
      buyItem(b.i);
      return;
    }
  }
}

function buyItem(i) {
  const room = currentRoom();
  const item = room.shopItems[i];
  if (!item) return;
  if (game.coins < item.price) {
    floater("Не хватает монет", W / 2, R.y + 50, "#ff6b81");
    tone(160, .12, "square", .03, 100);
    return;
  }
  game.coins -= item.price;
  const p = game.player;
  switch (item.id) {
    case "heal":  p.hp = Math.min(p.maxHp, p.hp + 40); break;
    case "maxhp": p.maxHp += 25; p.hp += 25; break;
    case "armor": p.armor = Math.max(.55, p.armor - .15); break;
    case "ammo":
      for (const w of p.weapons) if (Number.isFinite(w.reserve)) w.reserve += 40;
      p.energy = Math.min(p.energyMax, p.energy + 20);
      break;
    case "energy":
      p.energyMax += 25; p.energy = p.energyMax;
      break;
    case "dash": p.dashCdMax = Math.max(.55, p.dashCdMax - .2); break;
    default:
      if (WEAPON_IDS.indexOf(item.id) >= 0) addWeapon(item.id);
  }
  room.shopItems.splice(i, 1);
  sfx("buy");
  floater("Куплено: " + item.title, W / 2, R.y + 50, "#7cff9b");
}

/* ---------- update ---------- */
function update(dt) {
  if (!game) return;
  game.time += dt;
  if (game.transition > 0) game.transition -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  shakeX = settings.shake && shake ? rand(-shake, shake) : 0;
  shakeY = settings.shake && shake ? rand(-shake, shake) : 0;
  for (const o of currentRoom().props) {
    if (o.kind && o.flash > 0) o.flash = Math.max(0, o.flash - dt);
  }

  if (game.victoryTimer > 0) {
    game.victoryTimer -= dt;
    if (game.victoryTimer <= 0) {
      finishRun(true);
      state = "victory";
    }
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= .94; p.vy *= .94;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.effects.length - 1; i >= 0; i--) {
    const f = game.effects[i];
    f.life -= dt;
    if (f.kind !== "slash") f.r = f.maxR * (1 - clamp(f.life / f.maxLife, 0, 1));
    if (f.life <= 0) game.effects.splice(i, 1);
  }
  game.flash = Math.max(0, game.flash - dt * 1.4);
  for (let i = game.floaters.length - 1; i >= 0; i--) {
    const f = game.floaters[i];
    f.life -= dt; f.y -= 24 * dt;
    if (f.life <= 0) game.floaters.splice(i, 1);
  }

  if (state !== "playing") return;

  readInput();
  const p = game.player;
  const room = currentRoom();

  p.aim = Math.atan2(input.aimY - p.y, input.aimX - p.x);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.skillCd = Math.max(0, p.skillCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt);
  p.meleeCd = Math.max(0, p.meleeCd - dt);
  p.meleeT = Math.max(0, p.meleeT - dt);

  if (p.energyRegenT > 0) p.energyRegenT = Math.max(0, p.energyRegenT - dt);
  p.energy = Math.min(p.energyMax, p.energy + (p.energyRegenT > 0 ? 4 : 22) * dt);
  if (p.poisonT > 0) {
    p.poisonT = Math.max(0, p.poisonT - dt);
    p.poisonTick = (p.poisonTick || 0) - dt;
    if (p.poisonTick <= 0) {
      p.poisonTick = .6;
      damagePlayer(3 + game.level * .5);
    }
  }

  if (p.shieldRegenT > 0) p.shieldRegenT = Math.max(0, p.shieldRegenT - dt);
  else if (p.shield < p.shieldMax) {
    p.shield = Math.min(p.shieldMax, p.shield + (14 + p.shieldMax * .06) * statueRegenMul() * dt);
  }

  if (p.meleeCd <= 0) {
    let near = null, bestD = 46;
    for (const e of room.props) {
      if (e.dead || !e.maxHp || e.hp <= 0) continue;
      const d = dist(p.x, p.y, e.x, e.y);
      if (d < bestD) { bestD = d; near = e; }
    }
    if (near) meleeAttack(Math.atan2(near.y - p.y, near.x - p.x));
  }

  if (p.storm > 0) {
    p.stormTimer -= dt;
    if (p.stormTimer <= 0) {
      p.stormTimer = 3.2;
      let target = null, bestD = 420;
      for (const e of currentRoom().props) {
        if (!e.type || e.dead) continue;
        const d = dist(p.x, p.y, e.x, e.y);
        if (d < bestD) { bestD = d; target = e; }
      }
      if (target) chainFrom(p.x, p.y, 16 * p.damageMul * p.storm * statueDamageMul(), "#c08cff", 2 + p.storm + statueChainBonus());
    }
  }

  for (const w of p.weapons) {
    w.cd = Math.max(0, w.cd - dt);
    if (w.reloadT > 0) {
      w.reloadT -= dt;
      if (w.reloadT <= 0) {
        w.reloadT = 0;
        const need = Math.min(w.mag - w.ammo, w.reserve);
        w.ammo += need;
        if (Number.isFinite(w.reserve)) w.reserve -= need;
      }
    }
  }

  let mx = input.moveX;
  let my = input.moveY;
  if (p.dashBreak > 0) p.dashBreak -= dt;
  if (p.chargeTime > 0) {
    p.chargeTime -= dt;
    p.x += p.chargeVX * dt;
    p.y += p.chargeVY * dt;
    for (const e of currentRoom().props) {
      if (!e.type || e.dead || e.chargeHitId === p.chargeId) continue;
      if (dist(p.x, p.y, e.x, e.y) < p.r + e.r + 12) {
        e.chargeHitId = p.chargeId;
        damageEnemy(e, 30 * p.damageMul * statueDamageMul(), p.chargeVX, p.chargeVY, true);
        burst(e.x, e.y, "#ffd76b", 10, 130);
      }
    }
    if (chance(.7)) game.particles.push({ x: p.x, y: p.y, vx: rand(-40, 40), vy: rand(-40, 40), life: .3, maxLife: .3, color: "#ffd76b", size: 5 });
  } else if (p.dashTime > 0) {
    p.dashTime -= dt;
    p.x += p.dashVX * dt;
    p.y += p.dashVY * dt;
    if (chance(.6)) game.particles.push({ x: p.x, y: p.y, vx: rand(-30,30), vy: rand(-30,30), life: .25, maxLife: .25, color: "#9ad8ff", size: 4 });
  } else {
    const l = Math.hypot(mx, my) || 1;
    p.x += mx / l * p.speed * statueSpeedMul() * dt;
    p.y += my / l * p.speed * statueSpeedMul() * dt;
  }

  const bounds = getPlayerBounds();
  p.x = clamp(p.x, bounds.l, bounds.r);
  p.y = clamp(p.y, bounds.t, bounds.b);
  resolveObstacles(p, p.r, p.dashTime > 0 || p.dashBreak > 0);

  if (game.transition <= 0) {
    const d = room.doors;
    if (d.N && d.N.open && p.y < R.y - 4 && Math.abs(p.x - d.N.x) < 54) enterRoom(0, -1);
    else if (d.S && d.S.open && p.y > R.y + R.h + 4 && Math.abs(p.x - d.S.x) < 54) enterRoom(0, 1);
    else if (d.W && d.W.open && p.x < R.x - 4 && Math.abs(p.y - d.W.y) < 54) enterRoom(-1, 0);
    else if (d.E && d.E.open && p.x > R.x + R.w + 4 && Math.abs(p.y - d.E.y) < 54) enterRoom(1, 0);
  }

  if (input.fire) fireWeapon();

  updateEnemies(dt);
  updateAllies(dt);
  updateTraps(dt);
  updateBullets(dt);
  updatePickups(dt);

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const q = game.particles[i];
    if (q.life <= 0) game.particles.splice(i, 1);
  }

  room.props = room.props.filter(o =>
    !(o.type && o.dead) && !((o.kind === "box" || o.kind === "barrel") && o.dead)
  );
  checkRoomClear();
}

function getPlayerBounds() {
  const p = game.player;
  const doors = currentRoom().doors;
  let l = R.x + 20, r = R.x + R.w - 20;
  let t = R.y + 20, b = R.y + R.h - 20;
  if (doors.N && doors.N.open && Math.abs(p.x - doors.N.x) < 52) t = R.y - 34;
  if (doors.S && doors.S.open && Math.abs(p.x - doors.S.x) < 52) b = R.y + R.h + 34;
  if (doors.W && doors.W.open && Math.abs(p.y - doors.W.y) < 52) l = R.x - 34;
  if (doors.E && doors.E.open && Math.abs(p.y - doors.E.y) < 52) r = R.x + R.w + 34;
  return { l, r, t, b };
}

function updateEnemies(dt) {
  const p = game.player;
  const enemies = currentRoom().props.filter(o => o.type && !o.dead);

  for (const e of enemies) {
    e.flash = Math.max(0, e.flash - dt);
    e.slowT = Math.max(0, (e.slowT || 0) - dt);
    if (e.poisonT > 0) {
      e.poisonT = Math.max(0, e.poisonT - dt);
      e.poisonTick = (e.poisonTick || 0) - dt;
      if (e.poisonTick <= 0) {
        e.poisonTick = .5;
        damageEnemy(e, 3 + game.level * .6, 0, 0, true);
        if (e.dead) continue;
      }
    }
    const slowStartX = e.x, slowStartY = e.y;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    let sx = 0, sy = 0;
    for (const o of enemies) {
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od = Math.hypot(ox, oy) || 1;
      if (od < e.r + o.r + 8) { sx += ox / od; sy += oy / od; }
    }

    if (e.type === "grunt") {
      e.x += (nx + sx * .5) * e.speed * dt;
      e.y += (ny + sy * .5) * e.speed * dt;
    } else if (e.type === "shooter") {
      if (d > 265) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else if (d < 165) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .7 * dt; e.y += nx * e.speed * .7 * dt; }
      e.x += sx * 30 * dt; e.y += sy * 30 * dt;
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .45;
        e.aimAngle = Math.atan2(dy, dx);
        e.timer = Math.max(.8, 1.8 - game.level * .07) + rand(0, .5);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          enemyBullet(e, e.aimAngle, 300, 9 + game.level, "#e79bff");
          sfx("shoot");
        }
      }
    } else if (e.type === "sniper") {
      if (d < 300) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else if (d > 430) { e.x += nx * e.speed * .6 * dt; e.y += ny * e.speed * .6 * dt; }
      else { e.x += -ny * e.speed * .5 * dt; e.y += nx * e.speed * .5 * dt; }
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .85;
        e.aimAngle = Math.atan2(dy, dx);
        e.timer = rand(1.9, 2.7);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          enemyBullet(e, e.aimAngle, 620, 14 + game.level * 2, "#ff7ce5", 2);
          sfx("laser");
        }
      }
    } else if (e.type === "bomber") {
      e.x += nx * e.speed * dt;
      e.y += ny * e.speed * dt;
      if (d < 70) {
        e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
        if (e.timer <= 0) explodeBomber(e);
      } else {
        e.timer = .55;
      }
    } else if (e.type === "charger") {
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.state === "idle") {
        e.x += (nx * .55 + sx) * e.speed * dt;
        e.y += (ny * .55 + sy) * e.speed * dt;
        if (d < 250 && e.timer <= 0) {
          e.state = "windup"; e.timer = .7; e.dx = nx; e.dy = ny;
        }
      } else if (e.state === "windup") {
        if (e.timer <= 0) {
          e.state = "dash"; e.timer = .38;
          e.vx = e.dx * 360; e.vy = e.dy * 360;
          sfx("dash");
        }
      } else {
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.timer <= 0 || e.x < R.x + 25 || e.x > R.x + R.w - 25 || e.y < R.y + 25 || e.y > R.y + R.h - 25) {
          e.state = "idle"; e.timer = rand(1.1, 2); e.vx = e.vy = 0;
        }
      }
    } else if (e.type === "shielder") {
      e.facing = Math.atan2(dy, dx);
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.state === "bash") {
        e.x += e.bashVX * dt; e.y += e.bashVY * dt;
        if (e.timer <= 0) { e.state = "idle"; e.timer = rand(2.2, 3.2); }
      } else {
        e.x += (nx * .7 + sx) * e.speed * dt;
        e.y += (ny * .7 + sy) * e.speed * dt;
        if (d < 170 && e.timer <= 0) {
          e.state = "bash"; e.timer = .32;
          e.bashVX = nx * 300; e.bashVY = ny * 300;
          sfx("dash");
        }
      }
    } else if (e.type === "splitter" || e.type === "spawnling") {
      e.phase += dt * (e.type === "splitter" ? 7 : 11);
      const wobble = Math.sin(e.phase) * (e.type === "splitter" ? .5 : .35);
      e.x += (nx - ny * wobble) * e.speed * dt;
      e.y += (ny + nx * wobble) * e.speed * dt;
    } else if (e.type === "turret") {
      e.facing = Math.atan2(dy, dx);
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = .4;
        e.aimAngle = e.facing;
        e.timer = Math.max(1.1, 2.1 - game.level * .08);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) {
          for (let k = -1; k <= 1; k++) {
            enemyBullet(e, e.aimAngle + k * .12, 330, 8 + game.level, "#ffe27a");
          }
          sfx("shoot");
          shockwave(e.x, e.y, 44, "#ffd76b");
        }
      }
    } else if (e.type === "laser") {
      if (d > 360) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else if (d < 250) { e.x -= nx * e.speed * dt; e.y -= ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .6 * dt; e.y += nx * e.speed * .6 * dt; }
      e.aimAngle = e.beam > 0 || e.telegraph > 0 ? e.aimAngle : Math.atan2(dy, dx);
      e.beamHitCd = Math.max(0, e.beamHitCd - dt);
      if (e.beam > 0) {
        e.beam -= dt;
        const bx = Math.cos(e.aimAngle), by = Math.sin(e.aimAngle);
        const proj = (p.x - e.x) * bx + (p.y - e.y) * by;
        const perp = Math.abs((p.x - e.x) * by - (p.y - e.y) * bx);
        if (proj > 0 && proj < 900 && perp < p.r + 7 && e.beamHitCd <= 0) {
          damagePlayer(10 + game.level * 2);
          e.beamHitCd = .22;
        }
      } else {
        e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
        if (e.timer <= 0 && e.telegraph <= 0) {
          e.telegraph = e.telegraphMax = .9;
          e.aimAngle = Math.atan2(dy, dx);
          e.timer = rand(2.2, 3.2);
        }
        if (e.telegraph > 0) {
          e.telegraph -= dt;
          if (e.telegraph <= 0) { e.beam = .6; sfx("laser"); buzz(35); }
        }
      }
    } else if (e.type === "miner") {
      e.x += (nx * .7 + sx) * e.speed * dt;
      e.y += (ny * .7 + sy) * e.speed * dt;
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.timer <= 0) {
        e.timer = rand(2.2, 3.4);
        currentRoom().props.push({
          kind: "mine", x: e.x, y: e.y, r: 16,
          arm: 1, life: 13, damage: 12 + game.level * 2, blink: 0
        });
        burst(e.x, e.y, "#c8a06a", 6, 60);
      }
    } else if (e.type === "phantom") {
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      e.phase += dt * 5;
      e.x += (nx * .5 + sx + Math.sin(e.phase) * .5) * e.speed * dt;
      e.y += (ny * .5 + sy + Math.cos(e.phase) * .5) * e.speed * dt;
      if (e.timer <= 0) {
        e.timer = rand(2.4, 3.4);
        burst(e.x, e.y, e.color, 14, 130);
        const a = rand(0, Math.PI * 2), rr = rand(150, 220);
        e.x = clamp(p.x + Math.cos(a) * rr, R.x + 40, R.x + R.w - 40);
        e.y = clamp(p.y + Math.sin(a) * rr, R.y + 40, R.y + R.h - 40);
        burst(e.x, e.y, e.color, 14, 130);
        enemyBullet(e, Math.atan2(p.y - e.y, p.x - e.x), 190, 10 + game.level, "#d8b8ff");
        sfx("laser");
      }
    } else if (e.type === "boss") {
      if (d > 190) { e.x += nx * e.speed * dt; e.y += ny * e.speed * dt; }
      else { e.x += -ny * e.speed * .6 * dt; e.y += nx * e.speed * .6 * dt; }
      if (!e.enraged && e.hp < e.maxHp * .55) {
        e.enraged = true;
        e.speed *= 1.2;
        e.timer = .3;
        floater(floorData(game.floor).bossName + " ЗЛИТСЯ!", e.x, e.y - 60, "#ffd76b");
        sfx("boss");
        buzz(80);
      }
      if (!e.frenzied && e.hp < e.maxHp * .25) {
        e.frenzied = true;
        e.speed *= 1.18;
        e.timer = .15;
        shockwave(e.x, e.y, 100, e.color);
        floater("ПРЕДЕЛЬНАЯ ЯРОСТЬ!", e.x, e.y - 74, "#ff6b81");
        sfx("boss");
        buzz(100);
      }
      e.timer -= dt * (game.mods.indexOf("overload") >= 0 ? 1.35 : 1);
      if (e.timer <= 0 && e.telegraph <= 0) {
        e.telegraph = e.telegraphMax = e.frenzied ? .3 : e.enraged ? .38 : .55;
        e.nextPattern = e.pattern++ % 3;
        e.timer = Math.max(.6, 1.9 - game.level * .06) * (e.frenzied ? .55 : e.enraged ? .72 : 1);
      }
      if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) fireBossPattern(e, e.nextPattern);
      }
    }

    if (e.slowT > 0) {
      e.x = slowStartX + (e.x - slowStartX) * .5;
      e.y = slowStartY + (e.y - slowStartY) * .5;
    }
    e.x = clamp(e.x, R.x + e.r + 6, R.x + R.w - e.r - 6);
    e.y = clamp(e.y, R.y + e.r + 6, R.y + R.h - e.r - 6);
    resolveObstacles(e, e.r);

    if (d < e.r + p.r && p.invuln <= 0 && p.dashTime <= 0) {
      damagePlayer(e.type === "boss" ? Math.round(e.contact * (e.damageScale || 1)) : e.contact, e);
      const push = 18;
      e.x -= nx * push; e.y -= ny * push;
    }
  }
}

function explodeBomber(e) {
  if (e.exploded) return;
  e.exploded = true;
  e.dead = true;
  burst(e.x, e.y, "#ffb36b", 26, 220);
  if (settings.shake) shake = Math.max(shake, 7);
  sfx("shotgun");
  buzz(60);
  const p = game.player;
  if (dist(p.x, p.y, e.x, e.y) < 100) damagePlayer(14 + game.level * 3);
}

function fireBossPattern(e, pattern) {
  const enraged = !!e.enraged;
  const frenzied = !!e.frenzied;
  const ds = e.damageScale || 1;
  const lv = game.level;
  const p = game.player;
  const color = e.color;

  if (e.bossType === "frost") {
    if (pattern === 0) {
      const n = (enraged ? 24 : 16) + (frenzied ? 8 : 0);
      const off = e.pattern * .13;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + off;
        enemyBullet(e, a, 185 + (i % 2) * 45, Math.round((9 + lv) * ds), i % 2 ? "#8ee6ff" : "#d8f7ff");
      }
    } else if (pattern === 1) {
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      const arms = enraged ? 6 : 4;
      const steps = enraged ? 3 : 2;
      for (let arm = 0; arm < arms; arm++) {
        for (let k = 0; k < steps; k++) {
          enemyBullet(e, a0 + arm * Math.PI * 2 / arms + k * .09, 235 + k * 32, Math.round((10 + lv) * ds), "#b8f0ff");
        }
      }
    } else {
      const count = enraged ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const q = randomSpawnPoint(60);
        currentRoom().props.push(makeEnemy(i % 3 === 0 ? "laser" : i % 3 === 1 ? "shielder" : "sniper", q.x, q.y));
      }
      const spikes = (enraged ? 4 : 3) + (frenzied ? 2 : 0);
      for (let i = 0; i < spikes; i++) {
        const a = i / spikes * Math.PI * 2 + game.time;
        currentRoom().props.push({
          kind: "trap",
          x: clamp(p.x + Math.cos(a) * 100, R.x + 55, R.x + R.w - 55),
          y: clamp(p.y + Math.sin(a) * 100, R.y + 55, R.y + R.h - 55),
          r: 24, damage: Math.round((10 + lv) * ds),
          color: "#b8f0ff", timer: .7 + i * .06, active: 0
        });
      }
      floater("Ледяные шипы!", e.x, e.y - 48, "#b8f0ff");
    }
  } else if (e.bossType === "magma") {
    if (pattern === 0) {
      const a0 = Math.atan2(p.y - e.y, p.x - e.x);
      const n = (enraged ? 13 : 9) + (frenzied ? 5 : 0);
      for (let i = 0; i < n; i++) {
        const spread = (i - (n - 1) / 2) * .12;
        enemyBullet(e, a0 + spread, 255 + (i % 3) * 35, Math.round((12 + lv) * ds), i % 2 ? "#ff9d4d" : "#ffd76b");
      }
    } else if (pattern === 1) {
      const n = (enraged ? 6 : 4) + (frenzied ? 3 : 0);
      for (let i = 0; i < n; i++) {
